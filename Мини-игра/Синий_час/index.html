<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Синий час</title>
<!-- Черновик сценарной игры. Стиль A: пиксельная рама + место под живую картинку.
     Ни одного обращения к модели — весь текст написан. Картинки пока заглушки. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Geologica:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noch:#0b0d14; --panel:#10131d; --raise:#1b2030; --line:#2a3145;
  --text:#efe6d8; --mute:#7c8699; --sin:#6f8fd0; --svecha:#e0a95a; --krov:#b4614e; --trava:#8fae86;
  --px:'Press Start 2P',monospace; --body:'Geologica',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--noch);color:var(--text);font:300 16px/1.6 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.px{font-family:var(--px);font-weight:400}
.mono{font-family:var(--mono)}

/* кнопки 8-бит */
.b{background:var(--raise);color:var(--text);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:11px 14px;
   text-align:left;transition:transform .05s linear,box-shadow .05s linear}
.b:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.b:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.b:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 #000}
.b.on{background:var(--svecha);color:#171308}
.b.sin{background:#22314f}
.cost{font:11px var(--mono);color:var(--sin);white-space:nowrap}
.cost.gr{color:var(--svecha)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%}

#app{height:100%;display:flex;flex-direction:column}

/* ── верхняя полоса ── */
#hud{display:flex;align-items:center;gap:20px;padding:11px 18px;background:var(--panel);
     border-bottom:2px solid #000;box-shadow:0 3px 0 #000;position:relative;z-index:5;flex-wrap:wrap}
#hud .ttl{font:11px var(--px);color:var(--sin);letter-spacing:.04em}
.meter{display:flex;align-items:center;gap:7px}
.meter .lbl{font:10px var(--mono);color:var(--mute);letter-spacing:.06em}
.pips{display:flex;gap:2px}
.pip{width:11px;height:12px;background:#151a28;border:2px solid #000}
.pip.on{background:#2b3a63}.pip.now{background:var(--svecha)}
.coin{width:12px;height:12px;border-radius:50%;background:var(--svecha);border:2px solid #000}

/* ── сцена ── */
#scene{flex:1;position:relative;min-height:34vh;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#151a2a,#0f1018)}
#tint{position:absolute;inset:0;pointer-events:none;transition:background 1.2s ease}
#scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.10) 4px)}
#bgtag{position:absolute;top:12px;left:16px;font:11px var(--mono);color:rgba(214,223,240,.34);z-index:2}
#portrait{position:absolute;right:48px;bottom:0;width:300px;height:400px;z-index:2;
  border:4px solid var(--text);box-shadow:0 0 0 4px var(--noch),0 0 0 8px var(--sin),6px 6px 0 8px #000;
  background:linear-gradient(180deg,#34303a,#191821);display:none;align-items:flex-end;justify-content:center;
  font:11px var(--mono);color:rgba(214,223,240,.45);text-align:center;padding:0 8px 14px;line-height:1.7;overflow:hidden;word-break:break-all}
#portrait.sprite{border:0;box-shadow:none;background:none;width:auto;height:92%;right:26px;bottom:0;padding:0;
  filter:drop-shadow(0 6px 26px rgba(0,0,0,.75));
  -webkit-mask-image:linear-gradient(to top,transparent 0,#000 9%);mask-image:linear-gradient(to top,transparent 0,#000 9%)}
#portrait.sprite img{display:block;width:auto;height:100%;object-fit:contain;object-position:bottom}
#temy{position:absolute;left:16px;top:44px;width:220px;z-index:2;display:flex;flex-direction:column;gap:6px}
#temy .h{font:8px var(--px);color:var(--sin);letter-spacing:.06em;margin-bottom:2px}
#temy .t{font:12px var(--mono);color:#cfd8ea;background:rgba(27,32,48,.85);border:2px solid #000;
  box-shadow:2px 2px 0 #000;padding:6px 9px}

/* ── плашка ── */
#plate{position:relative;z-index:4;margin:0 16px 14px;background:var(--panel);border:4px solid var(--text);
  box-shadow:0 0 0 4px var(--noch),0 0 0 8px var(--sin),6px 6px 0 8px #000;padding:14px 18px 16px;
  max-height:52vh;overflow-y:auto}
#who{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
#who b{font:11px var(--px);color:var(--svecha);font-weight:400}
#who span{font:11px var(--mono);color:var(--mute)}
#say{margin:0 0 14px;font-size:17px;line-height:1.55;color:#e7dfd2;white-space:pre-wrap}
#say em{color:var(--mute);font-style:italic}
#say .my{color:var(--sin);font-style:italic}
#tone{display:flex;gap:8px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
#tone .lbl{font:10px var(--mono);color:var(--mute);letter-spacing:.06em}
#tone .b{padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 #000}
#acts{display:flex;flex-direction:column;gap:7px}

/* ── оверлеи ── */
.ov{position:fixed;inset:0;background:rgba(6,8,14,.92);z-index:20;display:flex;align-items:center;
    justify-content:center;padding:20px;overflow-y:auto}
.ovbox{width:min(760px,100%);background:var(--panel);border:4px solid var(--text);
  box-shadow:0 0 0 4px var(--noch),0 0 0 8px var(--svecha),6px 6px 0 8px #000;padding:22px 24px}
.ovbox h1{font:13px var(--px);color:var(--svecha);font-weight:400;margin:0 0 14px;line-height:1.7}
.ovbox h2{font:10px var(--px);color:var(--sin);font-weight:400;margin:20px 0 10px}
.ovbox p{margin:0 0 12px}
.card{background:var(--raise);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:13px 15px;margin-bottom:10px;
  width:100%;text-align:left;display:block}
.card b{display:block;font:11px var(--px);color:var(--text);font-weight:400;margin-bottom:7px;line-height:1.6}
.card span{font-size:14px;color:#c6cddb;display:block}
.card i{font:11px var(--mono);color:var(--svecha);font-style:normal;display:block;margin-top:7px}

/* карта */
#mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
.mroom{background:var(--raise);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:13px 10px;text-align:center;
  font-size:13px;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.mroom.here{background:var(--svecha);color:#171308}
.mroom.dark{background:#141824;color:#4c5568}
.mroom small{font:10px var(--mono);opacity:.8}

.fin{font-size:16px;line-height:1.7}
.fin .ln{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}
.fin .ln span:last-child{color:var(--svecha);font-family:var(--mono);font-size:13px;text-align:right}

@media (max-width:430px){ #hud .ttl{display:none} }   /* на узких экранах название только мешает */
@media (max-width:820px){
  body{font-size:15px}
  /* шапка уезжала в три ряда и съедала треть экрана */
  #hud{gap:9px;padding:7px 9px;flex-wrap:nowrap;overflow:hidden}
  #hud .ttl{font-size:8px}
  #hud .meter .lbl{display:none}
  #hud .pip{width:6px;height:9px;border-width:1px}
  #hud #money,#hud .ttl,#hud #dom{white-space:nowrap}
  #hud #money{font-size:11px}
  #hud #dom{font-size:11px}
  #hud .b{padding:7px 9px!important;font-size:11px!important}
  #hud #btn-map{font-size:8px!important;padding:8px 8px!important}
  #tone .b{padding:6px 10px;font-size:12px}
  #portrait{right:10px;width:31vw;max-width:150px;height:auto;aspect-ratio:3/4;font-size:9px;border-width:2px;
    box-shadow:0 0 0 2px var(--noch),0 0 0 4px var(--sin),3px 3px 0 4px #000}
  #portrait.sprite{width:auto;height:88%;right:0;border-width:0;box-shadow:none;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.75))}
  #temy{width:150px;top:36px;left:10px}
  #temy .t{font-size:11px;padding:5px 7px}
  #plate{margin:0 8px 8px;padding:12px 13px 13px;border-width:2px;max-height:56vh;
    box-shadow:0 0 0 2px var(--noch),0 0 0 4px var(--sin),3px 3px 0 4px #000}
  #say{font-size:16px}
  .ovbox{padding:16px 14px;border-width:2px;box-shadow:0 0 0 2px var(--noch),0 0 0 4px var(--svecha),3px 3px 0 4px #000}
  #mapgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="ttl">СИНИЙ ЧАС</span>
    <div class="meter"><span class="lbl">ВЕЧЕР</span><div class="pips" id="pips"></div></div>
    <div class="meter"><span class="coin"></span><span class="mono" id="money" style="font-size:13px;color:#f0dcb4"></span></div>
    <div class="meter"><span class="lbl">ДОМ</span><span class="mono" id="dom" style="font-size:12px;color:#9fb4dd"></span></div>
    <button class="b" id="btn-back" disabled style="margin-left:auto;padding:8px 12px;font-size:14px;line-height:1"
      title="Отменить последний шаг" aria-label="Отменить последний шаг">&#8592;</button>
    <button class="b px" id="btn-map" style="font-size:9px;padding:9px 12px">КАРТА</button>
    <button class="b" id="btn-restart" style="padding:8px 11px;font-size:13px;line-height:1;background:#141824;color:#5c6478"
      title="Начать вечер заново" aria-label="Начать вечер заново">&#8635;</button>
  </div>

  <div id="scene">
    <div id="bg"></div>
    <div id="tint"></div>
    <div id="scan"></div>
    <div id="bgtag"></div>
    <div id="temy"></div>
    <div id="portrait"></div>
  </div>

  <div id="plate">
    <div id="who"></div>
    <p id="say"></p>
    <div id="tone"></div>
    <div id="acts"></div>
  </div>
</div>

<script>
/* ═══════════════════ ДАННЫЕ ═══════════════════ */

const ВЕЧЕР = 12;          /* отрезков в вечере */
const ВХОД = 20;           /* гроши за вход */

const ПЕРСОНАЖИ = [
  { id:'prikazchik', имя:'Приказчик с баржи', деньги:220, дом:0, темы:['ceny'], нож:false, жетон:false,
    опис:'Сдал груз в Приречье, получил долю и впервые за месяц никому не должен. Денег больше, чем у всех, кто сегодня войдёт в эту дверь, — и ни одного знакомого лица внутри.' },
  { id:'naemnica', имя:'Наёмница с жетоном Сайдена', деньги:140, дом:0, темы:['dom_pravila'], нож:true, жетон:true,
    опис:'Жетон конторы на шнурке. По правилам дома оружие можно не сдавать — но платить втрое. В доме это знают раньше, чем ты откроешь рот.' },
  { id:'iglica', имя:'Мастер по наколкам', деньги:80, дом:1, темы:['nakolki'], нож:false, жетон:false,
    опис:'Половина этого дома ходит с твоей работой на коже. Денег мало, зато тебя тут читают как свою — и рассказывают то, чего гостям не рассказывают.' },
  { id:'pisar', имя:'Писарь меняльной конторы', деньги:160, дом:0, темы:['dolgi_doma'], нож:false, жетон:false,
    опис:'Ты считаешь чужие деньги на первом этаже, ровно под этими комнатами. Слышал всё и не видел ничего. Наверх поднялся впервые.' }
];

const ТЕМЫ = {
  ni_o_chem:   { ярлык:'ни о чём',            всегда:true },
  dom_pravila: { ярлык:'правила дома' },
  ceny:        { ярлык:'цены' },
  nakolki:     { ярлык:'наколки' },
  dolgi_doma:  { ярлык:'долги дома' },
  sib:         { ярлык:'Сиб на дверях' },
  yarna:       { ярлык:'хозяйка' },
  knigi:       { ярлык:'дом без книг' },
  gore:        { ярлык:'что у старшей' },
  pigment:     { ярлык:'синий пигмент' },
  muzykant:    { ярлык:'музыкант' }
};

/* Что игрок говорит вслух. Одна и та же тема звучит по-разному в зависимости
   от тона — это и есть выбор, а не «нажать на существительное». */
const ФРАЗЫ = {
  ni_o_chem:   { прямо:'Ну? Как тут у вас.',
                 мягко:'Хороший вечер. Тихо у вас.',
                 деньгами:'Это тебе. За компанию, не за дело.' },
  dom_pravila: { прямо:'Какие тут правила?',
                 мягко:'Подскажешь, чего у вас не делают?',
                 деньгами:'Это за правила. Не хочу узнавать их на своей шкуре.' },
  ceny:        { прямо:'Сколько тут всё стоит?',
                 мягко:'Не сочти за грубость: во сколько мне обойдётся вечер?',
                 деньгами:'Это вперёд. Теперь скажи, на что я могу рассчитывать.' },
  nakolki:     { прямо:'Кто тебе бил?',
                 мягко:'Красивая работа. Сама выбирала?',
                 деньгами:'Это за работу, которую я вижу на твоей коже.' },
  dolgi_doma:  { прямо:'Кому этот дом должен?',
                 мягко:'Тут тяжело с деньгами, да?',
                 деньгами:'Это за разговор о деньгах. Так честнее.' },
  sib:         { прямо:'Что за человек на дверях?',
                 мягко:'Сиб у вас давно?',
                 деньгами:'Это за пару слов о том, кто стоит на дверях.' },
  yarna:       { прямо:'Кто такая Ярна Сотт?',
                 мягко:'А хозяйка — она какая?',
                 деньгами:'Это за хозяйку. Про неё, не для неё.' },
  knigi:       { прямо:'Почему у вас нет книг?',
                 мягко:'Вы правда ничего не записываете?',
                 деньгами:'Это за то, чего вы не пишете.' },
  gore:        { прямо:'Что у старшей случилось?',
                 мягко:'Цветок на окне — он чей?',
                 деньгами:'Это за старшую. Если можно.' },
  pigment:     { прямо:'Откуда у вас синий пигмент?',
                 мягко:'Синее тут повсюду. Почему именно оно?',
                 деньгами:'Это за синее. Оно ведь не отсюда.' },
  muzykant:    { прямо:'Кто играет?',
                 мягко:'Хорошо играет. Давно он у вас?',
                 деньгами:'Это ему, не тебе. Пусть сыграет своё.' }
};

function фраза(тид, подход){
  const т = ФРАЗЫ[тид];
  return (т && т[подход]) || (т && т['прямо']) || ТЕМЫ[тид].ярлык;
}

const ЛЮДИ = {
  sib:       { имя:'Сиб',                портрет:'siniy_chas_sib.jpg',       любит:'прямо',    место:'у двери' },
  starshaya: { имя:'Старшая работница',  портрет:'siniy_chas_starshaya.jpg', любит:'деньгами', место:'в зале' },
  ola:       { имя:'Ола',                портрет:'siniy_chas_ola.jpg',       любит:'мягко',    место:'на лестнице' },
  niya:      { имя:'Ния',                портрет:'siniy_chas_niya.jpg',      любит:'прямо',    место:'у себя' },
  freya:     { имя:'Фрея',               портрет:'siniy_chas_freya.jpg',     любит:'мягко',    место:'у себя' },
  povariha:  { имя:'Повариха',           портрет:'siniy_chas_povariha.jpg',  любит:'прямо',    место:'на кухне' },
  yarna:     { имя:'Ярна Сотт',          портрет:'siniy_chas_yarna.jpg',     любит:'прямо',    место:'в кабинете' }
};
const ОНА = ['starshaya','ola','niya','freya','povariha','yarna'];   /* для «ей заходит» вместо «ему» */

const КОМНАТЫ = {
  krylco: { имя:'Крыльцо', фон:'крыльцо под синими фонарями, мокрый камень',
    текст:'Два фонаря над дверью забраны синим стеклом. Дождь кончился час назад, и камень ещё блестит. Изнутри слышно струну и смех — негромко, дом не кричит о себе.',
    люди:['sib'], соседи:['zal'],
    детали:[
      { id:'fonari', имя:'Синие фонари', текст:'Стекло привозное, такое же синее, как пигмент, которым здесь красят веки. За два фонаря отдано больше, чем портовый грузчик видит за год. Это не украшение, это ценник, вывешенный наружу.', тема:'pigment' },
      { id:'vyveska', имя:'Вывеска', текст:'Вывески нет. Есть доска с выжженным полукругом — час между закатом и темнотой. Кто не знает, тот и не нужен.' },
      { id:'luzha', имя:'Лужа у порога', текст:'В луже отражаются оба фонаря и твоё лицо между ними. Вид у лица такой, будто оно ещё решает, заходить или нет.' }
    ] },

  zal: { имя:'Общий зал', фон:'общий зал, свечи, музыкант у окна',
    текст:'Низкий потолок, восемь свечей, запах вина и тёплой пыли. У окна мужчина настраивает что-то струнное и не смотрит на людей. За столами двое, обоим есть что скрывать, и оба делают это плохо.',
    люди:['starshaya'], соседи:['krylco','lestnica','kuhnya'],
    детали:[
      { id:'stol', имя:'Стол у стены', текст:'Столешница исчиркана ножами — счёт, который кто-то вёл, пока ждал. Зарубки идут группами по три, последняя недочёркнута.' },
      { id:'muzyka', имя:'Музыкант', текст:'Играет ровно, глядя в окно, и ни разу не сбился за всё время, что ты смотришь. Дом ему не платит: он живёт тем, что кладут гости.', тема:'muzykant' },
      { id:'okno', имя:'Окно на улицу', текст:'Ставни изнутри закрываются на брус толщиной в руку. Не от воров: от тех, кто приходит договариваться.' }
    ] },

  lestnica: { имя:'Лестница и коридор', фон:'коридор второго этажа, свет из-под дверей',
    текст:'Лестница узкая, ковёр на ней старый и чистый — его выбивают каждый день. Наверху четыре двери, из-под двух идёт свет. Здесь тише, чем в зале, и слышно, как внизу перебирают струну.',
    люди:['ola'], соседи:['zal','komnata_nii','komnata_frei'],
    детали:[
      { id:'kovyor', имя:'Ковёр', текст:'Хороший, линдасской работы, и протёрт ровно посередине — по нему ходят одной тропой. Край подвёрнут, чтобы не спотыкались пьяные.' },
      { id:'dveri', имя:'Двери', текст:'Замки стоят изнутри, не снаружи. Мелочь, на которую гости не смотрят, а стоит: в доме, где двери запираются изнутри, работницы не заперты.' }
    ] },

  komnata_nii: { имя:'Комната Нии', фон:'комната наверху, свеча, тёмно-бордовые ткани',
    текст:'Комната узкая и высокая, свеча одна, зеркало в полный рост — единственная дорогая вещь. Ния стоит у косяка, придерживая его рукой, и ждёт, пока ты закончишь осматриваться.',

/* ═══════════════════ СОСТОЯНИЕ ═══════════════════ */

let S = null;

function начать(персИд){
  const п = ПЕРСОНАЖИ.find(x=>x.id===персИд);
  S = { перс:п.id, имяПерс:п.имя, жетон:п.жетон, ножПри:п.нож,
        час:0, гроши:п.деньги, дом:п.дом, долг:0,
        распол:{}, темы:['ni_o_chem'].concat(п.темы), флаги:[], осмотрено:[], спрошено:[], исчерпано:[],
        комната:'krylco', собеседник:null, подход:'мягко', история:[], ветка:null,
        реплика:'', заголовок:'', конец:null, вошёл:false };
  сохранить(); экран();
}

function датьТему(т){ if(т && !S.темы.includes(т)) S.темы.push(т); }
function флаг(ф){ if(!S.флаги.includes(ф)) S.флаги.push(ф); }
function есть(ф){ return S.флаги.includes(ф); }
function расп(кто){ return S.распол[кто]||0; }

const ГЛУБИНА_ОТКАТА = 40;

function снимок(){
  if(!S) return;
  const копия = Object.assign({}, S);
  delete копия.история;                       /* иначе снимок внутри снимка */
  if(!S.история) S.история = [];
  S.история.push(JSON.stringify(копия));
  if(S.история.length > ГЛУБИНА_ОТКАТА) S.история.shift();
}

function назад(){
  if(!S || !S.история || !S.история.length) return;
  const ист = S.история;
  const пред = JSON.parse(ист.pop());
  S = пред; S.история = ист;
  document.querySelectorAll('.ov').forEach(o=>o.remove());   /* в том числе экран финала */
  экран();
}

function заново(){
  if(!confirm('Начать вечер заново? Текущий вечер пропадёт.')) return;
  localStorage.removeItem('siniy_chas');
  location.reload();
}

function применить(э){
  if(!э) return;
  if(э.час) S.час += э.час;
  if(э.гроши) S.гроши += э.гроши;
  if(э.дом) S.дом = Math.max(-3,Math.min(3,S.дом+э.дом));
  if(э.распол) for(const k in э.распол)
    S.распол[k] = Math.max(-2, Math.min(4, (S.распол[k]||0) + э.распол[k]));
  if(э.тема) датьТему(э.тема);
  if(э.флаг) флаг(э.флаг);
}

function времяИдёт(n){
  S.час += n;
  if(S.час >= ВЕЧЕР && !S.конец) финал('время');
}

const БАЗА = location.pathname.includes('/game/') ? '../../img/' : '../../wiki/img/';
const проверено = {};
function естьФайл(путь, ок, нет){
  if(проверено[путь]!==undefined){ (проверено[путь] ? ок : (нет||function(){}))(); return; }
  const i = new Image();
  i.onload = ()=>{ проверено[путь]=true; ок(); };
  i.onerror = ()=>{ проверено[путь]=false; if(нет) нет(); };
  i.src = путь;
}

/* Перебирает пути по порядку и отдаёт первый существующий.
   Нужно, чтобы переезд картинок по папкам не ломал игру. */
function перваяКартинка(пути, ок){
  const шаг = i => {
    if(i >= пути.length) return;
    естьФайл(пути[i].путь, ()=>ок(пути[i]), ()=>шаг(i+1));
  };
  шаг(0);
}

const ПАПКИ_ЛИЦ = ['faces/siniy-chas/', 'faces/'];
const ПАПКИ_ФОНОВ = ['siniy-chas/', 'siniy-chas/фоны/'];

function экран(){
  if(S.конец){ рисоватьФинал(); return; }
  рисоватьHUD();
  const к = КОМНАТЫ[S.комната];
  const град = фонДля(S.комната);
  $('bg').style.background = град;
  $('bgtag').textContent = '[ фон: '+к.фон+' ]';
  const эта = S.комната;
  const пути = [];
  ПАПКИ_ФОНОВ.forEach(d=>['.jpg','.webp','.png'].forEach(р=>пути.push({путь: БАЗА+d+эта+р})));
  перваяКартинка(пути, в=>{
    if(S.комната !== эта || !$('bg')) return;   /* комнату успели сменить */
    /* 40% по высоте: низ кадра всё равно перекрыт плашкой, а главное обычно выше середины */
    $('bg').style.background = 'url('+в.путь+') center 40%/cover no-repeat, '+град;
    $('bgtag').textContent = '';                 /* подпись нужна только пока картинки нет */
  });
  $('tint').style.background = тинт();
  рисоватьТемы();

  if(S.собеседник) рисоватьРазговор(); else рисоватьКомнату();
  сохранить();
}

function фонДля(id){
  const карта = {
    krylco:'radial-gradient(520px 340px at 50% 18%, rgba(111,143,208,.32), transparent 70%), linear-gradient(180deg,#141a2c,#0c0e16)',
    zal:'radial-gradient(420px 320px at 22% 62%, rgba(224,169,90,.30), transparent 70%), radial-gradient(300px 240px at 72% 40%, rgba(224,169,90,.16), transparent 72%), linear-gradient(180deg,#151a2a,#1b1a20 55%,#0f1018)',
    lestnica:'radial-gradient(300px 260px at 70% 55%, rgba(224,169,90,.20), transparent 72%), linear-gradient(180deg,#14161f,#0d0e14)',
    komnata_nii:'radial-gradient(360px 300px at 35% 55%, rgba(224,169,90,.26), transparent 70%), linear-gradient(180deg,#221720,#100c12)',
    komnata_frei:'radial-gradient(420px 340px at 60% 40%, rgba(180,190,215,.20), transparent 72%), linear-gradient(180deg,#1b1e28,#101219)',
    kuhnya:'radial-gradient(380px 300px at 30% 70%, rgba(224,140,70,.30), transparent 70%), linear-gradient(180deg,#1d1811,#0f0c0a)',
    kabinet:'radial-gradient(360px 280px at 65% 30%, rgba(111,143,208,.24), transparent 70%), linear-gradient(180deg,#151824,#0c0d13)'
  };
  return карта[id]||карта.zal;
}

function тинт(){
  const д = S.час/ВЕЧЕР;
  if(д < .3)  return 'linear-gradient(180deg, rgba(58,86,150,.30), rgba(30,44,86,.22))';
  if(д < .65) return 'linear-gradient(180deg, rgba(120,80,30,.16), rgba(60,40,20,.14))';
  return 'linear-gradient(180deg, rgba(8,10,20,.42), rgba(4,5,10,.52))';
}

function экранируй(т){ return String(т).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function сказать(текст, моя){
  $('say').innerHTML = (моя ? '<span class="my">— '+экранируй(моя)+'</span>\n\n' : '')+экранируй(текст);
}

function рисоватьHUD(){
  let p='';
  for(let i=0;i<ВЕЧЕР;i++){
    const c = i<S.час ? 'pip on' : (i===S.час ? 'pip now' : 'pip');
    p += '<span class="'+c+'"></span>';
  }
  $('pips').innerHTML = p;
  $('money').textContent = S.гроши+' гр.'+(S.долг?' (долг '+S.долг+')':'');
  const имена = {'-3':'чужой','-2':'чужой','-1':'настороже','0':'гость','1':'гость','2':'почти свой','3':'свой'};
  $('dom').textContent = имена[String(S.дом)]||'гость';
  const бб = $('btn-back');
  if(бб) бб.disabled = !(S.история && S.история.length);
}

function рисоватьТемы(){
  const т = S.темы.filter(x=>x!=='ni_o_chem');
  $('temy').innerHTML = т.length
    ? '<div class="h">ЧТО ТЫ ЗНАЕШЬ</div>'+т.map(x=>'<div class="t">'+ТЕМЫ[x].ярлык+'</div>').join('')
    : '';
}

function кнопка(текст, цена, действие, выкл){
  const b = document.createElement('button');
  b.className = 'b';
  b.disabled = !!выкл;
  b.innerHTML = '<span class="row"><span>'+текст+'</span>'+(цена?'<span class="cost'+(цена.includes('гр')?' gr':'')+'">'+цена+'</span>':'')+'</span>';
  if(!выкл) b.onclick = ()=>{ снимок(); действие(); };
  return b;
}

/* ── разговор ── */
function рисоватьРазговор(){
  const ч = ЛЮДИ[S.собеседник];
  const p = $('portrait');
  p.style.display='flex';
  p.innerHTML = '[ портрет 3:4 ]<br>'+ч.портрет;
  p.className = '';
  p.style.padding = '0 8px 14px';   /* отступ нужен подписи-заглушке */
  const этот = S.собеседник;
  /* Вырезанный по фону (.webp или .png) — во весь рост без рамы;
     обычное фото (.jpg) — в пиксельной раме. Ищем во всех известных папках,
     чтобы переезд картинок ничего не ломал. */
  const пути = [];
  ['.webp','.png'].forEach(р=>{
    const в = ч.портрет.replace(/\.jpg$/, р);
    ПАПКИ_ЛИЦ.forEach(d=>пути.push({путь: БАЗА+d+в, спрайт:true}));
  });
  ПАПКИ_ЛИЦ.forEach(d=>пути.push({путь: БАЗА+d+ч.портрет, спрайт:false}));
  перваяКартинка(пути, в=>{
    if(S.собеседник !== этот || !p) return;   /* собеседника успели сменить */
    p.style.padding = '0';                     /* с фото отступ давал светлые поля */
    p.className = в.спрайт ? 'sprite' : '';
    p.innerHTML = '<img src="'+в.путь+'" alt="'+ч.имя+'"'+
      (в.спрайт ? '>' : ' style="display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%">');
  });
  const р = расп(S.собеседник);
  const тепло = р>=3?'доверяет':(р>=1?'слушает с интересом':(р<=-1?'держит дистанцию':'терпит'));
  $('who').innerHTML = '<b>'+ч.имя.toUpperCase()+'</b><span>'+ч.место+' · '+тепло+'</span>';
  сказать(S.реплика || вступление(S.собеседник), S.мояреплика);

  const t = $('tone'); t.innerHTML='<span class="lbl">КАК СКАЗАТЬ:</span>';
  ['прямо','мягко','деньгами'].forEach(п=>{
    const b=document.createElement('button');
    b.className='b'+(S.подход===п?' on':'');
    b.textContent=п;
    if(п==='деньгами' && знаетЛюбит(S.собеседник)) b.textContent='деньгами';
    b.onclick=()=>{S.подход=п;экран();};
    t.appendChild(b);
  });
  if(знаетЛюбит(S.собеседник)){
    const s=document.createElement('span');
    s.className='lbl';
    s.style.marginLeft='6px';
    s.textContent='· ему заходит: '+ч.любит;
    if(ОНА.includes(S.собеседник)) s.textContent='· ей заходит: '+ч.любит;
    t.appendChild(s);
  }

  const a=$('acts'); a.innerHTML='';
  const кто = S.собеседник;

  /* приватная комната, сцена уже отыграна — только спуститься вниз */
  const послеСцены = (S.комната==='komnata_nii' && кто==='niya' && есть('вышла_niya')) ||
                      (S.комната==='komnata_frei' && кто==='freya' && есть('вышла_freya'));
  if(послеСцены){
    a.appendChild(кнопка('Спуститься вниз', '', ()=>{ S.комната='lestnica'; S.собеседник=null; S.реплика=''; S.мояреплика=''; экран(); }));
    return;
  }

  /* ветка разговора не отыграна до конца — сперва её, темы подождут */
  if(S.ветка && S.ветка.кто===кто){
    рисоватьВетку(a);
    a.appendChild(кнопка('Отойти', '', ()=>{ S.собеседник=null; S.реплика=''; S.мояреплика=''; экран(); }));
    return;
  }

  S.темы.forEach(тид=>{
    const ключТема = кто+':'+тид;
    const исчерпана = S.исчерпано.includes(ключТема);
    const было = S.спрошено.includes(ключТема+':'+S.подход);
    a.appendChild(кнопка(
      (исчерпана||было?'· ':'')+'— '+фраза(тид, S.подход),
      исчерпана?'сказано':(было?'уже':'1 ч.'),
      ()=>спросить(тид),
      исчерпана
    ));
  });

  const комнатаЕё = (кто==='niya' && S.комната==='komnata_nii') || (кто==='freya' && S.комната==='komnata_frei');
  if(комнатаЕё) a.appendChild(кнопка('Остаться', '', ()=>ходИнтим(кто)));

  a.appendChild(кнопка('Отойти', '', ()=>{ S.собеседник=null; S.реплика=''; S.мояреплика=''; экран(); }));
}

function рисоватьВетку(a){
  a.appendChild(кнопка('— Продолжить', '', ()=>{
    const в = S.ветка;
    const узел = Р[в.кто][в.тид][S.подход] || Р[в.кто][в.тид]['любой'];
    const шаги = узел.дальше;
    const шаг = шаги[в.шаг];
    if(шаг.э) применить(шаг.э);
    if(шаг.тема) датьТему(шаг.тема);
    S.реплика = шаг.т;
    S.мояреплика = '';
    S.ветка.шаг++;
    if(S.ветка.шаг >= шаги.length){
      S.исчерпано.push(в.кто+':'+в.тид);
      S.ветка = null;
    }
    экран();
  }));
}

function ходИнтим(кто){
  флаг('nsfw_'+кто);
  флаг('вышла_'+кто);
  применить({распол:{[кто]:1}});
  S.реплика = СЦЕНЫ_NSFW[кто] || 'Дальше — без слов.';
  S.мояреплика = '';
  экран();
}

function знаетЛюбит(кто){ return (S.распол[кто]||0) >= 1; }

function вступление(кто){
  const в = {
    sib:'Он поворачивает к тебе голову, не меняя позы. Ждёт.',
    starshaya:'Она кивает на свободное место напротив и ждёт, пока ты сядешь. Торопить не станет.',
    ola:'Ола прижимает к себе стопку белья и улыбается — быстро, на всякий случай.',
    niya:'Ния опирается плечом о косяк и смотрит прямо, без спешки.',
    freya:'Фрея подбирает под себя ногу и разворачивается к тебе от окна.',
    povariha:'Нож на доске не сбивается с ритма, но ты понимаешь, что тебя заметили.'
  };
  return в[кто];
}

function спросить(тид){
  const кто = S.собеседник;
  const узел = (Р[кто]||{})[тид];
  let р = null;
  if(узел){ р = узел[S.подход] || узел['любой'] || null; }

  const ключТон = кто+':'+тид+':'+S.подход;
  const ключТема = кто+':'+тид;
  const повтор = S.спрошено.includes(ключТон);

  S.мояреплика = фраза(тид, S.подход);

  if(!р){
    S.реплика = ОТГОВОРКИ[кто];
    if(!повтор){ S.спрошено.push(ключТон); времяИдёт(1); }
    экран(); return;
  }

  /* об одном и том же одним и тем же тоном второй раз — тот же ответ,
     но вечер на это не тратится и расположение не копится. Кроме веток
     с продолжением: их читают заново, чтобы дойти до конца. */
  if(повтор && !р.дальше){
    S.реплика = р.т;
    экран(); return;
  }
  if(!повтор) S.спрошено.push(ключТон);

  /* персональный отклик: та же тема, другой текст, если он написан для этого героя */
  const овер = р.поПерсонажу && р.поПерсонажу[S.перс];
  const текст = (typeof овер==='string' ? овер : (овер && овер.т)) || р.т;
  const эффект = (овер && typeof овер==='object' && овер.э) || р.э;

  S.реплика = текст;
  if(эффект) применить(эффект);
  if(р.тема) датьТему(р.тема);

  /* подход против натуры: нажим стоит расположения */
  const ч = ЛЮДИ[кто];
  if(S.подход!==ч.любит && !узел['любой'] && S.подход==='прямо' && ['ola','freya'].includes(кто)){
    S.распол[кто]=(S.распол[кто]||0)-1;
  }
  времяИдёт(1);

  if(р.дальше && р.дальше.length){
    S.ветка = { кто:кто, тид:тид, шаг:0 };
  }
  экран();
}

function часСловами(){
  if(S.час<3) return 'синий час';
  if(S.час<7) return 'разгар вечера';
  if(S.час<10) return 'поздно';
  return 'дом скоро закроется';
}

/* ═══════════════════ ФИНАЛ ═══════════════════ */

function финал(причина){
  S.конец = причина;
  сохранить();
  рисоватьФинал();
}

function рисоватьФинал(){
  if(document.querySelector('.ov.finov')) return;   /* финал рисуется один раз */
  const лучший = Object.keys(S.распол).sort((a,b)=>S.распол[b]-S.распол[a])[0];
  const тепло = лучший ? S.распол[лучший] : 0;
  let заг, текст;

  if(S.конец==='несмог'){
    заг='ТЫ НЕ ЗАШЁЛ';
    текст='Ты стоишь под синими фонарями ещё минуту, потом разворачиваешься и идёшь вниз по улице.\n\nЗа спиной никто не окликает. В этом доме не уговаривают — это, пожалуй, единственное, что ты про него узнал.';
  } else if(S.конец==='двор'){
    заг='ТЫ УШЁЛ ЧЕРЕЗ ДВОР';
    текст='Калитка не скрипит — её и правда смазывают. Со двора дом выглядит обычным: два этажа, тёмные окна, дым из кухонной трубы.\n\nНикто не вышел следом, и это либо вежливость, либо расчёт.';
  } else if(тепло>=3 && S.дом>=1 && !S.долг){
    заг='ХОРОШИЙ ВЕЧЕР';
    текст='Ты выходишь, когда свечи в зале догорели до половины. Улица после тепла кажется стеклянной, и это даже приятно.\n\nВечер получился не таким, за какой платят двадцать грошей у входа. Такой вечер вообще не продаётся — он либо складывается, либо нет.';
  } else if(S.долг){
    заг='ДОРОГОЙ ВЕЧЕР';
    текст='Ты выходишь в темноту, и первое, о чём думаешь, — не о доме, а о том, что теперь должен.\n\nЯрна не ведёт книг. Это значит только одно: забыть о долге может кто угодно, кроме неё.';
  } else if(тепло>=1){
    заг='ОБЫЧНЫЙ ВЕЧЕР';
    текст='Вечер вышел неплохой, хотя и не тот, ради которого сюда ходят второй раз.\n\nТы запомнил пару лиц. Лица, кажется, запомнили тебя — ровно настолько, чтобы в следующий раз кивнуть.';
  } else {
    заг='ПУСТОЙ ВЕЧЕР';
    текст='Ты просидел вечер в тёплом доме и вышел в холод, ничего не унеся с собой.\n\nТак тоже бывает, и дом тут ни при чём: он честно предлагал разговор, а ты честно за него не заплатил — ни деньгами, ни вниманием.';
  }

  const строки = [];
  строки.push(['Потрачено', (ПЕРСОНАЖИ.find(p=>p.id===S.перс).деньги - S.гроши)+' грошей']);
  if(S.долг) строки.push(['Долг дому', S.долг+' грошей']);
  строки.push(['Узнано тем', String(S.темы.length-1)]);
  строки.push(['Осмотрено', String(S.осмотрено.length)]);
  const имена = {'-3':'как чужого','-2':'как чужого','-1':'настороженно','0':'как гостя','1':'как гостя','2':'почти как своего','3':'как своего'};
  строки.push(['Дом читает тебя', имена[String(S.дом)]]);
  if(лучший && тепло>0) строки.push(['Тебя запомнила', ЛЮДИ[лучший].имя+' ('+тепло+')']);

  const утечки = [];
  if(есть('спрятал')) утечки.push('Сиб сказал старшей, что ты вошёл с ножом. Старшая сказала хозяйке. Тебя пустят, но считать будут громче.');
  if(есть('вдолг')) утечки.push('Твой долг нигде не записан. Через неделю о нём напомнят так, будто ты сам предложил.');
  if(S.темы.includes('pigment')) утечки.push('Ты спрашивал про синий пигмент. Такие вопросы в доме запоминают отдельно — и передают дальше не сразу, а когда станет выгодно.');
  if(S.темы.includes('knigi')) утечки.push('Ты понял, что в доме нет книг. Хозяйка узнает об этом раньше, чем ты дойдёшь до угла.');
  if(есть('музыка')) утечки.push('Музыкант запомнил, что ты платил не за просьбу, а просто так. Он из тех, кто такие вещи помнит дольше, чем следовало бы.');

  const ov = document.createElement('div');
  ov.className='ov finov';
  ov.innerHTML = '<div class="ovbox"><h1>'+заг+'</h1><p style="white-space:pre-wrap">'+текст+'</p>'+
    '<h2>СЧЁТ ВЕЧЕРА</h2><div class="fin">'+
    строки.map(s=>'<div class="ln"><span>'+s[0]+'</span><span>'+s[1]+'</span></div>').join('')+'</div>'+
    (утечки.length?'<h2>ЧТО ОСТАЛОСЬ ПОСЛЕ ТЕБЯ</h2>'+утечки.map(u=>'<p style="color:#c6cddb;font-size:15px">— '+u+'</p>').join(''):'')+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">'+
      (S.история && S.история.length ? '<button class="b" id="undo">&#8592; Отменить последний шаг</button>' : '')+
      '<button class="b" id="again">Начать вечер заново</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#again').onclick=()=>{ localStorage.removeItem('siniy_chas'); location.reload(); };
  const u = ov.querySelector('#undo');
  if(u) u.onclick = назад;
}

/* ═══════════════════ КАРТА ═══════════════════ */

function карта(){
  const порядок = ['krylco','zal','lestnica','komnata_nii','komnata_frei','kuhnya'];
  const ov=document.createElement('div');
  ov.className='ov';
  const клетки = порядок.map(id=>{
    const к=КОМНАТЫ[id];
    const тут = id===S.комната;
    const был = S.осмотрено.some(x=>x.startsWith(id+':')) || тут;
    const cls = тут?'mroom here':(был?'mroom':'mroom dark');
    const подпись = тут?'ты здесь':(к.цена?к.цена+' гр.':(был?'':'не был'));
    return '<div class="'+cls+'">'+(был||тут?к.имя:'?')+'<small>'+подпись+'</small></div>';
  }).join('');
  ov.innerHTML='<div class="ovbox"><h1>ПЛАН ДОМА</h1>'+
    '<p style="color:#9aa3b5;font-size:14px">Два этажа над меняльной конторой. Ходить по дому времени не стоит — время стоят разговоры и комнаты наверху.</p>'+
    '<div id="mapgrid">'+клетки+'</div>'+
    '<p style="color:#7c8699;font-size:13px;margin-top:14px">'+(есть('была_у_ярны')?'Кабинет хозяйки открыт для тебя сегодня — через общий зал.':'Кабинет хозяйки — через общий зал, если дом станет доверять или найдётся сорок грошей.')+'</p>'+
    '<button class="b" id="closemap" style="margin-top:8px">Закрыть</button></div>';
  document.body.appendChild(ov);
  ov.querySelector('#closemap').onclick=()=>ov.remove();
}

/* ═══════════════════ СТАРТ И СОХРАНЕНИЕ ═══════════════════ */

function сохранить(){ try{ localStorage.setItem('siniy_chas', JSON.stringify(S)); }catch(e){} }

function выборПерсонажа(){
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML='<div class="ovbox"><h1>СИНИЙ ЧАС</h1>'+
    '<p>Дом Ярны Сотт, торговый квартал Порта Теней. Осень 1026-го, вечер, дождь только что кончился.</p>'+
    '<p style="color:#9aa3b5;font-size:15px">Ты пришёл отдохнуть — не по делу, не за долгом. Вечер короткий: двенадцать отрезков, и каждый разговор стоит один. Ходить по дому бесплатно, смотреть по сторонам бесплатно. Платят здесь за слова и за комнаты.</p>'+
    '<h2>КТО ТЫ СЕГОДНЯ</h2>'+
    ПЕРСОНАЖИ.map(п=>'<button class="card" data-id="'+п.id+'"><b>'+п.имя+'</b><span>'+п.опис+'</span>'+
      '<i>'+п.деньги+' грошей'+(п.жетон?' · жетон Сайдена':'')+(п.нож?' · при оружии':'')+(п.дом?' · дом читает как своего':'')+'</i></button>').join('')+
    '</div>';
  document.body.appendChild(ov);
  ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>{ ov.remove(); начать(b.dataset.id); });
}

$('btn-map').onclick = карта;
$('btn-back').onclick = назад;
$('btn-restart').onclick = заново;

(function(){
  let сейв=null;
  try{ сейв = JSON.parse(localStorage.getItem('siniy_chas')||'null'); }catch(e){}
  if(сейв && !сейв.конец){ S=сейв; if(!S.спрошено) S.спрошено=[]; if(!S.история) S.история=[]; if(!S.исчерпано) S.исчерпано=[]; if(S.ветка===undefined) S.ветка=null; экран(); }
  else { localStorage.removeItem('siniy_chas'); выборПерсонажа(); }
})();
</script>
