ГЛУБИНА. В глубине есть следы, не принадлежащие ни одному известному животному. Кесс их видел и молчит. Единственный совет Вана: не ходите туда, куда ведут следы.` },

        { id: "van_kess", title: "Ван и Кесс — хозяева тракта", keys: ["Ван", "Кесс", "Корен", "разбойник"], constant: false, order: 102, scanDepth: 4, recursive: false, maxChars: 1314,
          text: `ВАН — последний Дорожный страж, около пятидесяти, живёт в полуразрушенном посту на середине лесного тракта. Знает тракт лучше любого живого человека. Продаёт знание всем, кто платит, — и купцам, и разбойникам. Кесс его не трогает, Ван его не выдаёт; негласный договор держится годами.
КЕСС по прозвищу Корень — атаман, около сорока пяти, двадцать лет в лесу. Худой, жилистый, кожа цвета старой коры, двигается совершенно бесшумно. Под ним сорок-шестьдесят человек, число гуляет по сезону.
ВЛАСТЬ. Его люди боятся леса, он — нет. В этом и власть: не деньги и не жестокость, а то, что он единственный знает правила. Он не безумец и не отшельник, а полевой командир партизан, у которого самая надёжная крепость в Кордиме — живая и не нанесённая на карту.
КОДЕКС. Не убивать без нужды. Не трогать лекарей и священников. Идущий под словом Сайдена платит небольшую предсказуемую «лесную пошлину» вместо полного ограбления — договор личный, ему годы, и держится на том, что Сайден ни разу не подводил.
КОМПРОМАТ. За двадцать лет через его людей прошло много грузов и разговоров. Кесс знает о поставках Дома Рохт то, чего Рохт не хочет афишировать, — и молчание Кесса стоит дороже военной операции.
ПРИВЫЧКА. Перед каждым выходом Кесс оставляет что-то на старом дубе у северной опушки. Что именно — в банде дважды не спрашивают.` },

        { id: "port", title: "Порт Теней", keys: ["Порт Тен", "Порта Тен", "Порту Тен", "контрабанд", "док"], constant: false, order: 103, scanDepth: 4, recursive: false, maxChars: 1209,
          text: `Каменный прибрежный город ~15 000 человек, чёрный рынок Кордима.
СЕНСОРИКА. Соль, гнилая рыба, смола и старая кровь с доков. Ветер со Свинцового моря пронизывает в любое время года. Каждую ночь туман такой, что человека теряешь в трёх шагах.
ДОКИ, север вдоль берега — земля Мокрых ножей. Рест Дорр официально старший смотритель доков; каждый корабль платит пошлину официальную и вторую — Доррам. Контрабанда, алхимия с Кладбища китов, оружие без клейма.
ТОРГОВЫЙ КВАРТАЛ, центр — Серый картель. Рынки, аптеки, меняльные конторы. Аптека Сибиллы Рейн — сердце картеля. Здесь же торгуют табаком, дорогим южным импортом.
ТРУЩОБЫ, юг — Братство кулака. Горм держит рэкет над мелкой торговлей, низовые бордели. Стража сюда не заходит.
МАЯК И СКАЛЫ, западный мыс. Смотритель меняет режим огня по просьбе Мокрых ножей. Под скалами пещеры, известные контрабандистам.
ТОВАР. Легально — рыба, соль, канаты, корабельный лес, восточные специи, табак. Нелегально — оружие без клейма Коллегии, алхимия без лицензии Ложи, поддельные бумаги, «серая радость». Уникальное — кость левиафана с Кладбища китов.
ВЛАСТЬ. Три синдиката в неустойчивом равновесии. Городской совет формально есть, фактически ротируется между их людьми.` },

        { id: "whales", title: "Кладбище китов", keys: ["Кладбище кит", "левиафан"], constant: false, order: 104, scanDepth: 4, recursive: false, maxChars: 395,
          text: `Полоса безлюдного серого побережья к югу от Порта Теней, усеянная огромными скелетами левиафанов. Ветер воет сквозь колоссальные рёбра. Пахнет старым рассолом и сухой костью. По ночам здесь видят огни. Рыбаки из Морского обходят этот берег после заката и не объясняют почему.
Кость левиафана идёт на алхимию и стоит дорого. Между рёбрами скрыты три укрытия для кораблей — база Свинцовых клинков.` },

        { id: "morskoy", title: "Морской", keys: ["Морск", "рыбацк", "рыбак", "рыбач", "рыбаков"], constant: false, order: 105, scanDepth: 4, recursive: false, maxChars: 590,
          text: `Северная прибрежная деревня, около сорока человек, едва выживает.
СЕНСОРИКА. Постоянный ветер с моря, запах соли, дыма и мокрых сетей. Прибой слышен везде.
УСТРОЙСТВО. Одна таверна — она же гостиница, склад и место, где решается всё важное. Один причал. Дальше дневного перехода в море не ходят.
ИСТОРИЯ. Деревня была под крылом рода Астерн. Когда замок на мысе пал, Морской остался деревней, которую никто не защищает. Рыбаки помнят и вслух не говорят.
ПУТИ. Северным берегом до Порта Теней три дня — дорога тех, кто хочет войти в Порт незамеченным. Мыс, где стоял замок, обходят стороной.` },

        { id: "smitgard", title: "Смитгард", keys: ["Смитгард", "кузн", "плавильн"], constant: false, order: 106, scanDepth: 4, recursive: false, maxChars: 849,
          text: `Промышленный город-кузня ~9 000 человек, производственная столица Кордима.
СЕНСОРИКА. Небо постоянно серое от кузнечного дыма — облако видно за десять миль. Ритм молотов от рассвета до заката. Запах горячего железа, угля и пота въелся в камень стен.
УСТРОЙСТВО. Западная часть жилая и торговая, восточная — цеха и плавильни. Рабочих рук хронически не хватает: уход квалифицированного мастера — катастрофа.
ВЛАСТЬ. Коллегия оружейников фактически владеет городом, Мастер-Кузнец — Хорд Вейн. Коллегия производит, Дом Рохт торгует. Начни Коллегия торговать напрямую — станет угрозой всем торговым домам разом, потому и держится нейтральным производителем.
ШАХТЫ. Свои шахты на западном склоне дают руду для базового производства. Лучшая руда идёт с восточного склона через перевал Ордена; без восточных поставок Коллегия работает не на полную мощность.` },

        { id: "montin", title: "Монтин", keys: ["Монтин", "перевал", "подъёмный мост"], constant: false, order: 107, scanDepth: 4, recursive: false, maxChars: 767,
          text: `Город-крепость ~4 000 человек, единственный проходимый восточный перевал.
СЕНСОРИКА. Холодный ветер даже летом. Звук цепей подъёмного моста слышен по всему городу. Воздух тонкий — новоприбывшие два дня дышат тяжело.
УСТРОЙСТВО. Западная часть — город для проезжающих, восточная — укрепления Ордена. Последний день подъёма стоит проделать на горной лошади: Орден держит конюшню в деревне у подножия — ещё один источник дохода.
ОРДЕН Железного Перевала не подчиняется ни Совету, ни Церкви, ни Короне. Командор — Брайд Каск. Пошлина фиксирована, торговаться нельзя. Долгосрочного договора Дому Рохт Орден не даёт намеренно: гибкость ставки — рычаг. Часть редких металлов берёт пошлиной натурой и не объясняет зачем. Копит сведения о чужих схемах как пассивную страховку.` },

        { id: "osherk", title: "Ошерск и Приречье", keys: ["Ошерск", "Приречь", "баржа", "Крайм", "Утопленник"], constant: false, order: 108, scanDepth: 4, recursive: false, maxChars: 860,
          text: `Речной торговый город ~12 000 человек, второй по величине вместе с Портом Теней.
СЕНСОРИКА. Запах речного ила, рыбного рынка, мокрой верёвки. Скрип пришвартованных барж.
УСТРОЙСТВО. Река разрезает город; два-три каменных моста, на каждом пошлина. ПРИРЕЧЬЕ — южный пригород. «Утопленник» — постоялый двор без записи в книге. СИНИЙ ДВОР за красильней, синие камни мостовой. МОКРЫЙ СПУСК — место, где Крайм разбирает своих.
ВЛАСТЬ. Крайм Руфус — альдерман Приречья, глава гильдии виноторговцев, держит четыре баржи. Официально возит вино и зерно. Дешёвое вино идёт с юга по суше, дорогое — с востока через Дом Сел, и в счетах он их намеренно смешивает. Дом Сел об этой двойной бухгалтерии знает; реакция — вопрос времени.
РЕКА. Течёт с севера, Ошерск выше по течению, чем Столица. Баржой вниз до Столицы — 3 дня, обратно вверх — 5–6. Верхом в обе стороны — 2 дня.` },

        { id: "vrata", title: "Врата", keys: ["Врат", "перекрёсток", "перекресток", "пошлин", "КПП"], constant: false, order: 109, scanDepth: 4, recursive: false, maxChars: 549,
          text: `Город-крепость ~7 500 человек, обязательный КПП.
СЕНСОРИКА. Конский навоз, грязь и немытые тела. Скрип тележных колёс круглосуточно. У главного входа две виселицы, обе редко пустуют.
ОПИСАНИЕ. Все южные торговые пути сходятся здесь. За южными воротами тракт идёт дальше — через два дня пути приграничные земли Линдаса; армия Идвальда держит этот участок в хорошем состоянии ради снабжения. Лучший рынок сведений за пределами Столицы и Порта Теней. Пряха держит здесь почтовую контору Вестников.
ОПАСНОСТЬ средняя. Взятки работают быстрее аргументов.` },

        { id: "top", title: "Топь", keys: ["Топь", "Топи", "болот", "мостк"], constant: false, order: 110, scanDepth: 4, recursive: false, maxChars: 446,
          text: `Болотное поселение ~500 человек, конец дороги.
СЕНСОРИКА. Густой запах гнили, серы и стоячей воды. Постоянное жужжание насекомых. Мостки скрипят, всё вечно влажное, туман не уходит даже в полдень.
ОПИСАНИЕ. Дома на сваях над чёрной водой, соединённые узкими мостками. Сюда приходят прятаться: дезертиры с южной границы, должники Кальвера, беженцы из приграничных деревень. Ни гарнизона, ни конторы, ни Церкви. Без проводника с мостков не сходить.` },

        { id: "rucheiny", title: "Ручейный", keys: ["Ручейн", "лесоруб", "просек"], constant: false, order: 111, scanDepth: 4, recursive: false, maxChars: 582,
          text: `Небольшой город ~2 000 человек на южной опушке Гнилого Леса. Лесорубы, семьи бандитов Кесса, люди, которые не задают вопросов. Приходящий стражник получает пустые взгляды и ответ «не знаем никакого Кесса».
СЛЕПОЕ ПЯТНО. С той стороны просеки сидит банда, которая людям Кесса не подчиняется: залётные, платят монетой и сбывают не здесь. Стек, местный лошадник, с ними связан и о южной дороге молчит совсем. Лавочник боится и говорит прямо: на юг не ходи. То, что такая банда живёт в двух часах от опушки, означает одно из двух — либо Кесс о ней не знает, либо она ему пока не мешает.` },
        /* --- СИСТЕМЫ И ФРАКЦИИ --- */
        { id: "alchemy", title: "Алхимия", keys: ["алхими", "алхимик", "зель", "микстур", "реагент", "вспышк", "едкий дым", "кислот", "смол", "паралитическ", "горюч", "болеутоляющ", "серая радость", "зависимост"], constant: false, order: 200, scanDepth: 4, recursive: false, maxChars: 1626,
          text: `ПРИНЦИП. Алхимия — химия, а не магия. У всего есть физический механизм, цена и режим отказа. Алхимия НЕ МОЖЕТ воскрешать, мгновенно лечить и давать сверхъестественную силу. Любой эффект, звучащий как магия, — мошенничество либо имеет жестокую скрытую цену.
РЕГЕНЕРИРУЮЩАЯ МИКСТУРА. Крайне редкая, 15–20 кордов, три-четыре производителя на страну. Форсирует заживление тканей и давит инфекцию, но не возвращает объём крови и не сращивает переломы. Лихорадка под сорок, недееспособность 6–8 часов, слабость три дня. Две дозы за неделю — риск отказа органов. Густая тёмно-янтарная жидкость, пахнет жжёной серой и полынью.
БОЛЕУТОЛЯЮЩИЙ НАСТОЙ. Дёшев, есть в любой таверне. Глушит боль на 2–4 часа, замедляет реакцию и маскирует нарастающее кровотечение. При регулярном приёме привыкание: начинают с раны, продолжают потому, что без настоя обычная боль кажется невыносимой.
СЕРАЯ РАДОСТЬ. Очень редкая, только через Серый картель, дорого. Несколько часов полного отсутствия тревоги и боли. Зависимость быстрая, физическая и психическая.
БОЕВОЕ. Ослепляющая вспышка — слепит на 2–4 секунды, ночью до шести, действует и на того, кто бросил. Едкий дым — облако радиусом три метра на 20–30 секунд, ветер сносит. Кислотная колба — разъедает металл, замки и кожу, пары токсичны в закрытом помещении. Горючая смесь — загорается от воздуха, тушится только песком, вода усиливает. Паралитическая пыль — паралич на 10–20 минут при вдыхании, на ветру бесполезна. Липкая смола — твердеет за 10–15 секунд, на морозе хрупкая.
УЛИКИ. Обученный медик Ложи узнаёт её кислоту по характеру ожога и по картине видит, лили на стоящего или на лежащего.` },

        { id: "guild", title: "Контора Сайдена", keys: ["контор", "Сайден", "наёмник", "наемник", "жетон", "поручительств", "заказ"], constant: false, order: 201, scanDepth: 4, recursive: false, maxChars: 1100,
          text: `ПРИСУТСТВИЕ. Гильдии наёмников нет. Есть одна частная семейная контора в Торговом поясе Столицы — серое здание без вывески, третье поколение рода Сайден — и сеть посредников вокруг неё в других городах. У конторы нет ни власти, ни мандата, ни своих людей: товар конторы — слово. Сайден ручается перед заказчиком за исполнителя и перед исполнителем за оплату.
КАК ПРИХОДИТ ДЕЛО. Заказ нигде не вывешивают: мальчишка с запиской, слово через хозяйку таверны, «зайди завтра». Позвали — вправе отказаться без всякого наказания, кроме очереди. Наказуемо только брошенное уже взятое дело.
ЖЕТОН. Именной знак поручительства — пластина с номером, под которым имя записано в книге. Не лицензия и не разрешение убивать: за ним стоит только имя Сайдена. Кесс жетон признаёт и берёт лесную пошлину вместо грабежа. Если человека под словом конторы убили, Сайден мстить не объявляет — снимает своё слово со всех дел убийцы и говорит об этом там, где слушают. Жетон срезают публично, во дворе, при тех, кто был.
БРОК САЙДЕН — держит контору третьим в роду, 60 лет, нет двух пальцев на левой руке. Осторожен, а не нейтрален. Отказывает чаще, чем соглашается, и в городе за это его ценят.
МАРРА ХОЛТ — 40 лет, бывший информатор Церкви. Держит связь с Советом, стражей и половиной трактиров. Улыбается всегда, и опытных людей это пугает.
СЕДРИК «АРХИВ» — тридцать лет чужих дел в личной коллекции, не служба и не система. Бумаги можно сжечь, Седрика нельзя; Марра боится его именно поэтому.` },

        { id: "state", title: "Совет, Церковь, стража", keys: ["Совет", "Церк", "стража", "стражник", "Вейр", "архиеписк"], constant: false, order: 202, scanDepth: 4, recursive: false, maxChars: 1167,
          text: `ГОРОДСКОЙ СОВЕТ. Номинальное гражданское управление, на практике — сбор налогов и политическое маневрирование. Члены глубоко коррумпированы; долговые записи и компромат одновременно их главное оружие и главная слабость.
ЛОРД КАСТЕН ВЕЙР — 55 лет, три поколения семьи в Совете. Говорит тихо, и остальные при этом замолкают. Слабость одна: единственный сын, молодой, амбициозный и глупый.
ЦЕРКОВЬ. Больницы, приюты, разведывательная сеть через исповедь. Контролирует погребение и церковные архивы: запись о крещении — единственный официальный документ, подтверждающий, что человек вообще существовал. Отсюда следует, что человек без такой записи юридически не существует.
АРХИЕПИСКОП БРАН — 60 лет. Публично осуждает насилие и частным образом финансирует его через посредников. Публично осуждает табак и курит у себя в покоях. Публичный скандал разрушил бы его власть мгновенно.
СТРАЖА. Качество разное. В Столице профессиональна и политически скомпрометирована. В Порту Теней работает на синдикаты. В мелких поселениях недоплачена и легко подкупается. Стража применяет закон того, кто ей платит. Полноценной полиции в Кордиме нет — порядок держат частные силы фракций.` },

        { id: "syndicates", title: "Три синдиката Порта Теней", keys: ["синдикат", "Мокрые нож", "Мокрых нож", "Мокрым нож", "картел", "Братство кулак", "Братства кулак", "Дорр", "Горм", "Нотариус", "Сибилл"], constant: false, order: 203, scanDepth: 4, recursive: false, maxChars: 1241,
          text: `МОКРЫЕ НОЖИ. Доки и морская контрабанда. Граница со Свинцовыми клинками проведена ясно: открытое море и побережье — клинки, доки и портовая инфраструктура — ножи.
РЕСТ и КЕЙН ДОРР — близнецы, по сорок, внешне неотличимы. Рест публичное лицо и официально старший смотритель доков, Кейн — тень. Кто узнал, что их двое, молчит по понятным причинам.
СЕРЫЙ КАРТЕЛЬ. Торговый квартал, а также сведения и яды по всему Кордиму. Тесно сплетён с Домом Сел через общих людей, но формально независим: Нотариус никогда не называет себя человеком Дома Сел, Дом Сел никогда не признаёт связь. Обоим выгодно, что их трудно разделить.
НОТАРИУС — настоящее имя неизвестно, пол является предметом споров. Никогда не врёт. Продаёт сведения обеим сторонам любого конфликта.
СИБИЛЛА РЕЙН — держит аптеку, торгует лекарствами, табаком и ядами. Знает состав «серой радости». Сведения получает от работниц среднего звена в борделях.
БРАТСТВО КУЛАКА. Трущобы: рэкет, прямое насилие, низовые бордели. ГОРМ «Печать», 52 года, бывший боец на ставки. Суеверен до абсурда — семь амулетов, важных разговоров в чётные дни не начинает. Всё держится на его личном авторитете: не станет его — не станет структуры. Серый картель использует Братство, когда нужны руки без головы.` },

        { id: "lodge", title: "Алхимическая Ложа", keys: ["Ложа", "Ложи", "Орра", "сборщик", "лиценз"], constant: false, order: 204, scanDepth: 4, recursive: false, maxChars: 645,
          text: `Контролирует производство и распределение редких составов по всему Кордиму.
СБОР СЫРЬЯ устроен смешанно. Для безопасных мест — реестр вольных сборщиков. Для опасных, вроде Гнилого Леса и Топи, — договоры с местными: Кесс за лес, жители Топи за болота. Платят фиксированно и не спрашивают, как добыто. Отсюда и неприкосновенность Кесса: за ним тихий договор с организацией, у которой длинные руки.
МАСТЕР ВЕШ ОРРА — 68 лет, маленькая сухая женщина, руки в химических ожогах до локтей. Говорит медленно и очень точно. Продаёт всем с одинаковым безразличием. О привыкании к болеутоляющему знает и считает это проблемой пациента, а не производителя.` },

        { id: "hunters", title: "Охотники за головами", keys: ["Охотник", "Сурн", "мандат", "за голову"], constant: false, order: 205, scanDepth: 4, recursive: false, maxChars: 375,
          text: `Берут контракты на людей и работают легально: у них мандаты на задержание от городских советов. С конторой Сайдена не пересекаются напрямую — та только ручается словом за людей, розыском не занимается.
ДАЛК СУРН — 47 лет, педантичен. Держит реестр фрилансеров по всему Кордиму: приметы, специализация, последнее известное место. Реестр справочный, но при удобном случае Сурн никого не прикроет.` },

        { id: "houses", title: "Торговые дома", keys: ["Торговый дом", "Торговые дом", "Кальвер", "Рохт", "Дом Сел", "Эйнар", "Магна", "Оррен"], constant: false, order: 206, scanDepth: 4, recursive: false, maxChars: 1392,
          text: `Три семьи в постоянном напряжённом союзе.
ДОМ КАЛЬВЕР — зерно, скот, земля. ЛОРД ЭЙНАР КАЛЬВЕР, 70 лет, в кресле на колёсах. Держит власть долговым рабством: крестьянин берёт зерно в голодный год и отдаёт трудом, а долг устроен так, что не закрывается никогда. Платит налоги за должников разом и потому является крупнейшим единичным налогоплательщиком страны. Наследники ждут его смерти двадцать лет, и он получает от этого тихое удовольствие.
ДОМ РОХТ — металл, оружие, транспорт. МАГНА РОХТ, 40 лет, беспощадна в переговорах. Зависит от Ордена в перевозке восточной руды, и это её бесит: она хочет договора на годы, Орден отказывает, потому что гибкость ставки — его рычаг.
ДОМ СЕЛ — сведения, специи, редкие товары. ОРРЕН СЕЛ, 55 лет, формальный глава; реальные решения, возможно, принимает кто-то другой. Держит восточную торговлю через Монтин и южные морские пути. Никогда не реагирует немедленно и никогда лично — всегда через слой посредников.
ОТКРЫТЫЙ УЗЕЛ. Весной 1025-го в структуре Рохт убили Обрана Дюра, посредника, распоряжавшегося очередью на погрузку. Магна ищет не убийц, а выгодоприобретателя. Отдельно всплыло, что Дюр нанимал охрану за деньги, которых у него быть не могло; чего он боялся на самом деле, не знает никто.
ЕЩЁ ОДИН. Дом Сел потерял в Приречье сундук с документами, где лежала схема двойной бухгалтерии Крайма — часть архитектуры, которую строили поколениями.` },

        { id: "order", title: "Орден Железного Перевала и Кузнечная Коллегия", keys: ["Орден", "Железный Перевал", "Каск", "Коллеги", "Хорд Вейн", "клейм"], constant: false, order: 207, scanDepth: 4, recursive: false, maxChars: 687,
          text: `ОРДЕН. Военный орден, основанный раньше самого Кордима. Держит единственный проходимый восточный перевал и не подчиняется ни Совету, ни Церкви, ни Короне. Пошлину назначает односторонне, часть редких металлов берёт натурой. Копит сведения о чужих схемах как пассивную страховку — не пускает в ход, просто знает.
БРАЙД КАСК — Командор, 50 лет, тридцать лет службы, покидал Монтин восемь раз. Говорит мало.
КУЗНЕЧНАЯ КОЛЛЕГИЯ. ХОРД ВЕЙН — Мастер-Кузнец, 61 год, руки деформированы сорока годами работы, живёт в пристройке к штабу, говорит громко по привычке. Клеймо Коллегии на оружии — гарантия качества, которую невозможно подделать; оружие без клейма стоит дешевле и продаётся не везде.` },

        { id: "messengers", title: "Вестники и Корона", keys: ["Вестник", "Пряха", "почт", "письм", "Идвальд", "корол"], constant: false, order: 208, scanDepth: 4, recursive: false, maxChars: 708,
          text: `ВЕСТНИКИ. Люди, которые ходят по дорогам Кордима с письмами за плату. Нейтралитет у них не идея, а деловое условие: им пользуются все фракции, поэтому их не трогает никто. Правило держится шестьдесят лет без единого письменного договора.
ПРЯХА — почтовая контора во Вратах, около семидесяти. Помнит каждое письмо за сорок лет: не содержание, а от кого кому. Это делает её одним из самых осведомлённых людей страны, и она об этом знает.
КОРОНА. ИДВАЛЬД III, 42 года, один из лучших фехтовальщиков Кордима. Армия любит его искренне, политически он слаб. Воюет с Линдасом на юге — единственное место, где делает то, для чего создан. Вейр эту войну поддерживает: король на границе — это король далеко от Столицы.` },
        /* --- СИСТЕМЫ МИРА --- */
        { id: "politics", title: "Политическая механика", keys: ["политик", "власт", "союз", "конфликт", "фракци"], constant: false, order: 300, scanDepth: 4, recursive: false, maxChars: 869,
          text: `СОЮЗЫ. Вейр, торговые дома и Церковь — негласный треугольник, управляющий Столицей. Дом Рохт и Коллегия Смитгарда — производственный симбиоз: одни делают, другие торгуют, разделение выгодно обоим. Дом Сел и Серый картель сплетены тесно и формально независимы. Ложа и Коллегия — технический симбиоз: лучшее оружие с лучшими составами.
КОНФЛИКТЫ. Орден против Дома Рохт — холодная война из-за пошлин; Орден трижды задерживал обозы, Рохт трижды уступал. Церковь против Ложи — идеологическое: Церковь хочет монополии на чудесные исцеления. Дом Кальвер против Дома Рохт — старые деньги против новых. Контора Сайдена против Охотников — конкуренция за рынок, напряжение без войны. Кордим против Линдаса — вялотекущая пограничная война на юге, настоящая причина в торговых путях.
ПРИНЦИП. В Кордиме нет добра и зла, есть интересы и цены. Золото важнее верности. Выживание важнее всего.` },

        { id: "wounds", title: "Ранения и лечение", keys: ["ран", "кровотеч", "лечи", "перевяз", "лекар", "перелом", "сломан", "заражен", "жар"], constant: false, order: 301, scanDepth: 4, recursive: false, maxChars: 1387,
          text: `ПРИНЦИП. Тело — ненадёжный механизм, а средневековая медицина убивает почти так же часто, как само ранение. Алхимия даёт преимущество, но не чудеса.
ПОРЕЗЫ И НЕГЛУБОКИЕ КОЛОТЫЕ. Выживаемость высокая при чистой перевязке. Без обработки заражение приходит на вторые сутки. До полной боеспособности 7–14 дней.
ГЛУБОКИЕ РАНЫ. Выживаемость средняя, всё решает место. Восстановление 3–6 недель; с регенерирующей микстурой — 5–7 дней до частичной боеспособности и 2–3 недели до полной.
АРБАЛЕТНЫЙ БОЛТ. Зазубренный наконечник при извлечении рвёт ткань сильнее, чем рвал при входе. Болт в поясничной мышце рядом с позвоночником — риск задеть почку или нерв. В мягкие ткани с микстурой: 6–8 часов недееспособности, три дня сильной слабости, 10–14 дней до боевой готовности. Без микстуры — 4–6 недель, если выживет.
ЗАРАЖЕНИЕ БЕЗ МИКСТУРЫ приходит на вторую ночь: жар и розовая полоса от раны к ближайшему суставу. Лечится не лечением, а временем. Отвар ивовой коры и прошлогодней таволги сбивает жар на несколько часов, и только. Сосновая смола и кислый болотный мох под повязку работают, но исход решает тело: отжимает толчками, три ночи. На четвёртое утро либо полоса встала и запаха нет, либо всё.
ЖЁСТКОЕ ПРАВИЛО. Никакого «к утру почти оправился». Боль, слабость и ограниченная подвижность держатся явно и влияют на действия. Алхимия даёт шанс выжить и ускоряет ход дела, но не отменяет его.` },

        { id: "roads", title: "Дороги и время в пути", keys: ["дорог", "маршрут", "переход", "верхом", "пешком", "день пути", "расстоян", "баржа"], constant: false, order: 302, scanDepth: 4, recursive: false, maxChars: 943,
          text: `СКОРОСТЬ. Пешком 20–25 миль в день по хорошей дороге, 10–15 в дождь. Верхом 35–40 без спешки. Обоз 15, в грязь меньше.
МАРШРУТЫ. Ошерск — Столица: 2 дня верхом, 4–5 пешком; баржой вниз по реке 3 дня, обратно вверх 5–6. Столица — Порт Теней лесом: 4 дня верхом, 7–8 пешком, и только группой от шести человек. Столица — Порт Теней в обход через Врата: 7–8 дней верхом, зато безопасно. Столица — Смитгард: 5 дней верхом. Столица — Монтин: 7 дней верхом через Смитгард, последний день подъёма лучше на горной лошади. Столица — Врата: 3 дня верхом. Врата — граница Линдаса: 2 дня верхом по дороге, которую содержит армия. Порт Теней — Морской: 3 дня пешком вдоль берега. Врата — Топь: 2 дня пешком, без проводника не стоит.
СЕЗОННОСТЬ. Осенью и зимой грунтовые дороги замедляют вдвое. Лесной тракт зимой непроходим для обозов. Баржи стоят, пока река подо льдом, — около двух месяцев. Весной таяние делает грунтовку хуже зимней на три-четыре недели.` },

        { id: "prices", title: "Цены и заработки", keys: ["цен", "корд", "марк", "грош", "монет", "заплат", "купи", "прода", "заработ", "жаловань", "стоит"], constant: false, order: 303, scanDepth: 4, recursive: false, maxChars: 1379,
          text: `ВАЛЮТА. Корд (золото) = 20 марок = 200 грошей. Марка — основная расчётная единица, грош — повседневность.
ПОВСЕДНЕВНОЕ. Ночлег в общей комнате 2 гроша, отдельная комната 1 марка. Миска похлёбки с хлебом 1 грош, кружка эля 1 грош. Корм лошади на день 2–3 гроша.
ВЗЯТКИ. Стражнику 2–5 марок, офицеру 2–5 кордов, чиновнику 10–30 кордов.
СНАРЯЖЕНИЕ. Простой нож 3–5 марок, боевой с клеймом 3–5 кордов. Меч среднего качества 5–8 кордов, с клеймом Коллегии 15–25. Кольчуга 10–15, бригандина 20–30. Арбалет среднего класса 8–12; тяжёлый составной, около двухсот фунтов, со взводом козьей ножкой — 60–80. Десяток бронебойных болтов 2 марки.
ЛОШАДИ. Рабочая 5–8 кордов, верховая под седло 10–12, старая вьючная 5, боевая 20–40.
АЛХИМИЯ. Регенерирующая микстура 15–20 кордов у того, кто варит, и до трёх дней ожидания. Ночью, срочно и мимо очереди — вдвое. Табак фунт 1–2 корда, дорогой импорт.
ТРУД. Подёнщик и чернорабочий 8–10 грошей в день, зимой работы меньше, а не платят хуже. Ремесленник 3–5 марок в день. Месяц стражника 3–4 корда, месяц опытного вольного бойца 8–12. Охрана обоза за неделю 1–3 корда, это рутина, а не риск.
КОНТРАКТЫ. Сложный, с устранением охраняемой цели, — 50–100 кордов, что-то совсем особое до 300. Контора Сайдена берёт своё с заказчика — десятой частью сверх цены; с исполнителя не удерживает ничего. Мимо конторы, через посредника, платят иначе: сорок кордов за выбитые сведения (десять вперёд, тридцать по сдаче), сто девяносто за двор с охраной; задатка на хранении нет, перерасход не возмещают.
МАСШТАБ. Семьдесят кордов — это дом в Ручейном с коровой.` },

        { id: "plague", title: "Белая Чума", keys: ["Белая Чума", "чум", "поветри", "эпидеми"], constant: false, order: 304, scanDepth: 4, recursive: false, maxChars: 1203,
          text: `КОГДА. Две волны. Первая около 986 года — тотальный мор: Столица потеряла треть населения за два месяца, несколько малых городов вымерли полностью, Чумной квартал замуровали. Вторая около 1006-го — малая вспышка, беженцы на дорогах, локальные очаги. Потом чума исчезла так же внезапно, как пришла. Источник не найден ни разу.
СИМПТОМЫ. Белые пятна на коже, расползающиеся от конечностей к центру. Смерть на пятый-восьмой день.
ВЕРСИИ. Церковь говорит о божественном испытании. Ложа — о химическом агенте природного происхождения, предположительно из подземных вод Гнилого Леса; источник не найден, негласный мониторинг продолжается, и Орра знает больше, чем говорит. Есть догадка, что чума пришла не из Гнилого Леса, а через него — из чего-то, что было до леса или под лесом. И есть версия без имени: Вейры закрыли Верхний город за три дня до первых случаев. За три дня. Доказать невозможно.
ПОСЛЕДСТВИЯ. Дефицит рабочих рук на целое поколение, Нижний город Столицы до сих пор не восстановился. Чумной квартал — выжившие, которых некуда было выпустить, и их дети: второе поколение людей, не знающих другого мира. Кто старше пятидесяти, помнит лично, и любая массовая болезнь вызывает немедленную панику.` },
        /* --- ОБЩЕСТВО --- */
        { id: "rumours", title: "Слухи и байки Кордима", keys: ["слух", "байк", "легенд", "поговарива", "болтают"], constant: false, order: 305, scanDepth: 4, recursive: false, maxChars: 1720,
          text: `ПРО ЛЮДЕЙ. «Смерть в кожаном плаще» — по трактам ходит байка о фигуре, которую никто не видит, но все слышат: один сухой щелчок, и человек падает замертво. Одни говорят, дух мести, другие — наёмный демон богатых домов; с конкретным живым человеком байку не связывает никто.
Нотариус бессмертен — существует сорок лет и не стареет. Прагматики отвечают, что это должность, а не человек.
Про Идвальда шепчут, что его сын не его сын.
Про братьев Дорр: торговец, увидевший их вместе, рассказал об этом — через неделю его нашли в доках, несчастный случай.
Про Каска: Орден охраняет не торговый путь, а что-то конкретное в горах.
Про Седого с Кладбища: Свинцовые клинки живут среди костей левиафанов, а их капитан разговаривает с морем. Кто видел его ночью у воды, говорит разное. Живые говорят мало.
ПРО МЕСТА. В Чумном квартале регулярно видят огни, хотя он пуст сорок лет. В Гнилом Лесу есть следы, не принадлежащие ни одному известному животному. На Кладбище китов по ночам видят огни. У мыса Астернов замок пуст, но в тихую погоду вода у мыса иногда светится холодным белым светом снизу.
ПРО МОРЕ. Одну историю рассказывают только зимой, только в помещении и только когда шторм снаружи достаточно громкий, чтобы заглушить слова: будто Свинцовое море иногда отвечает — не всем, только тем, кто провёл на воде достаточно и научился правильно молчать. Большинство слышавших смеются. Те, кто провёл в море достаточно, не смеются, а молчат и меняют тему.
ПРО МИР. Белая Чума вернётся: источник не найден, Ложа говорит «мониторинг продолжается», а версия без имени гласит, что чума не исчезла, а ждёт. И ещё: восточные торговцы, когда выпьют, говорят про земли за горами, которых нет на картах. Трезвые отрицают и быстро уходят.` },

        { id: "threats", title: "Внешние угрозы", keys: ["угроз", "за Хребтом", "за хребтом", "восток", "открытое море", "война"], constant: false, order: 306, scanDepth: 4, recursive: false, maxChars: 1059,
          text: `ЗА ХРЕБТОМ. Никто в Кордиме не знает точно, что там. Страна существует тысячу лет и так и не выяснила — либо выяснила и решила не говорить. Восточные торговцы, приходящие через Монтин, откуда-то идут, а на вопросы отвечают уклончиво. Каск получает донесения с востока через курьеров, которых никто не видел входящими с запада. Что Орден охраняет не только торговый путь, очевидно всякому, кто подумает дольше минуты. Три сотни лет без единого происшествия — либо угрозы нет, либо Орден работает хорошо.
ОТКРЫТОЕ МОРЕ. Семьдесят лет назад с запада вернулся один корабль из трёх. Капитан прожил ещё два года и молчал; что-то написал перед смертью, и документ лежит в архивах Дома Сел. Седой на запад не ходит никогда — а для человека, который ходит на север, где другие не возвращаются, это говорит само за себя.
ЛЕС. Гнилой Лес давит на границы человеческого пространства постоянно и методично. Заброшенная деревня зарастает за сорок лет, тракт требует непрерывного обслуживания. Это не враг, которого можно победить в битве, а среда, медленно забирающая своё.` },

        { id: "population", title: "Население и военные силы", keys: ["населен", "численност", "сколько люд", "жител", "армия", "гарнизон"], constant: false, order: 307, scanDepth: 4, recursive: false, maxChars: 1014,
          text: `ГОРОДА. Столица ~27 000 (до Белой Чумы было ~40 000). Порт Теней ~15 000. Ошерск с Приречьем ~12 000. Смитгард ~9 000. Врата ~7 500. Монтин ~4 000, треть из них Орден и семьи. Ручейный ~2 000. Топь ~500. Морской ~40.
СТРАНА. Всего около 430 000 человек; до Чумы было семьсот-восемьсот тысяч. Мор выкосил половину страны. Естественный прирост съедают пограничные стычки, болезни и долговое рабство. Кордим не вымирает, но и не восстанавливается.
СИЛЫ. Армия Идвальда ~2 500, половина размазана по южной границе. Гарнизон Столицы ~300 стражников, в малых городах по 30–50. Орден ~300 бойцов — мало, но каждый элита. Гильдии наёмников нет, армии наёмников тоже: контора Сайдена — это книга имён, а не реестр, и постоянного войска за ней не стоит. По-настоящему опасных вольных бойцов на всю страну — не больше полутора сотен. Свинцовых клинков ~120, и на фоне общих цифр это грозная сила под рукой одного человека.
СЛЕДСТВИЕ. Мир маленький и тесный: профессионалы знают друг друга по именам или по почерку работы. Потеря десятка обученных людей — событие. Дефицит людей и есть главный ресурсный кризис Кордима.` },

        { id: "taverns", title: "Таверны, бордели, чтецы", keys: ["таверн", "постоялый двор", "трактир", "бордел", "чтец", "хозяин", "Утопленник", "Три моста"], constant: false, order: 308, scanDepth: 4, recursive: false, maxChars: 1492,
          text: `ТАВЕРНА — единственное публичное место, где люди разных слоёв сидят за соседними столами. Хозяин знает всё, что происходит у него в зале, и немного сверх того: это не любопытство, а выживание — хозяин, который не знает, кто у него сидит, живёт недолго.
ПРИДОРОЖНАЯ обслуживает путников, сведения транзитные, со всех концов страны; хозяин продаёт их Вестникам или Серому картелю. ГОРОДСКАЯ живёт постоянными клиентами и устоявшимися столами — здесь заключают сделки, которые нельзя заключить в конторе. ПОРТОВАЯ у доков самая грязная и самая полезная; в каждой такой в Порту Теней сидит человек Мокрых ножей.
Курят в тавернах трубками после еды — у кого есть табак. Запах табачного дыма в общем зале обычное дело.
ЧТЕЦЫ сидят у ворот, рынков и таверн и за плату читают вслух письма и документы. Через их руки проходит всё, и Серый картель держит своих людей среди чтецов.
ЗАВЕДЕНИЯ. «Утопленник» в Приречье — плесень и прелые опилки; хозяин платит долю Крайму за право работать без вопросов и нейтрален настолько, насколько это возможно. «Три моста» в Столице — три зала на разных уровнях.
БОРДЕЛИ трёх уровней: низовые при портовых тавернах под Братством кулака; средние в торговых кварталах, поделены между Мокрыми ножами и Серым картелем; высокие в верхних городах, устроены как салоны, официально не существуют, клиенты — советники, купцы, знать.
ПОТОК. Клиент сказал лишнее, хозяин запомнил, сведения ушли скупщику и дальше вверх. Большинство людей не знают, что участвуют в этой системе.` },

        { id: "calendar", title: "Календарь и сезоны", keys: ["сезон", "время года", "зим", "весн", "лето", "летом", "осен", "календар", "праздник", "жатв", "урожай"], constant: false, order: 309, scanDepth: 4, recursive: false, maxChars: 1506,
          text: `СИСТЕМА. Двенадцать месяцев, названий у них нет. Говорят «в начале жатвы», «когда река встаёт», «на третью неделю после первого снега». В официальных бумагах — порядковые номера. Год начинается с первого месяца весны, счёт крестьянский, от земли.
ВЕСНА, месяцы 1–3. Первые две-три недели — худшее время для дорог, грунтовка хуже зимней, обозы стоят, цены в городах растут. Реки разливаются, баржи встают на две-три недели. Если урожай был плохой — голод: старые запасы кончились, новые не выросли, и Дом Кальвер в это время влиятелен как никогда.
ЛЕТО, месяцы 4–6. Лучшее время для всего: дороги сухие, реки судоходны, торговля на пике. Гнилой Лес чуть менее опасен — меньше тумана, топи подсыхают по краям. Порт Теней работает вдвое быстрее.
ОСЕНЬ, месяцы 7–9. Сейчас ранняя осень. Дожди начались, тракты раскисают, но проходимы. Реки полные, баржи идут последние недели. Жатва — главное событие года, деревни закрыты для чужих. Конец осени — время расчётов: долги Кальвера предъявляют после урожая.
ЗИМА, месяцы 10–12. Лесной тракт непроходим для обозов, баржи встают на два месяца, Монтин отрезан. Цены растут от начала зимы к концу. Разбойники с трактов почти исчезают — им тоже надо где-то сидеть. Лес зимой тихий и белый, волки голодные и потому опаснее; Кесс говорит, что зима — единственное время, когда лес честен.
ПРАЗДНИКИ. Начало жатвы: три дня, когда не работают даже должники Кальвера, таверны набиты, сведения текут рекой. Зимний Огонь в середине зимы: жгут костры, пьют, вспоминают мёртвых.` },

        { id: "death", title: "Болезни и смерть", keys: ["болезн", "смерт", "умер", "похорон", "тиф", "лихорадк", "кашел", "зараз", "гангрен", "погребен", "хорони"], constant: false, order: 310, scanDepth: 4, recursive: false, maxChars: 1406,
          text: `БОЛЕЗНИ. Тиф — хроника Нижнего города и портовых кварталов: грязная вода, скученность, крысы. Вспышки раз в два-три года, умирают дети и старики; проблему никто не решает, потому что перестройка канализации дорога и политически неудобна. Болотная лихорадка у Топи и сырых берегов, летом, когда много комаров: жар и бред, местные переносят легче, чужаки тяжело. Лёгочная гниль — медленная, неизлечимая, заразная; характерный кашель узнают, и от кашляющего незнакомца люди инстинктивно отодвигаются. Кожная короста в Гнилом Лесу и сырых районах — не смертельна, но мучительна. Раневая гниль: запах гангрены узнаваем, и лекарь, идущий к такому больному, заранее думает о плате — из прагматизма, не из жестокости.
ПОГРЕБЕНИЕ контролирует Церковь, три уровня. Бедный — яма на краю без камня и короткая молитва. Средний — место с деревянным крестом и полная служба, несколько марок. Богатый — каменный склеп, именная плита, заупокойные мессы; способ показать, что человек был кем-то. Кого не хоронит никто — общая яма, которую закапывают, когда наполнится, имён не записывают. Самоубийц Церковь на освящённой земле не хоронит, и это рычаг для семей. Хоронят быстро: летом ждать нельзя.
БЕЗ СВИДЕТЕЛЕЙ. За пределами крупных городов регистрации смерти нет. Человек просто перестаёт существовать, и никто не ищет. Работает в обе стороны: можно тихо убрать человека, а можно самому умереть на бумаге и начать заново.` },
        /* --- ПРИРОДА --- */
        { id: "flora_forest", title: "Флора Гнилого Леса и Топи", keys: ["растени", "дерев", "мох", "гриб", "папоротник", "плющ", "ель", "дуб", "осин", "тростник", "рогоз"], constant: false, order: 400, scanDepth: 4, recursive: false, maxChars: 1935,
          text: `ПРИРОДА ЛЕСА. Лес не враждебен — он безразличен, как время, холод или глубокая вода, и не делает для людей исключений. Долгое пребывание меняет человека незаметно для него самого: через месяц он тише и настороженнее, через год слышит лес раньше, чем видит. Это не магия, а изоляция, особый воздух и вечный полусумрак.
ДЕРЕВЬЯ. Чёрная ель — до тридцати метров, ствол в три обхвата, кора угольная от сырости и грибка, нижние ветви мёртвые и торчат как обломанные кости; её чёрная смола горит даже в сырости. Серый дуб — искривлённый, в наростах, иногда полый; жёлуди мелкие и горькие. Осина-утопленница по болотным границам: кора белая с серыми пятнами, ствол наклонён над водой, листья дрожат без ветра. Мёртвый вяз — не порода, а явление: вязы умирают стоя и стоят десятилетиями, серебристо-серые, без коры, сочатся тёмной влагой; опираться нельзя.
ПОДЛЕСОК. Сплошной ковёр мха, папоротника и гниющей листвы, в низинах по колено. Бесшумно ходить почти невозможно. Папоротник-гигант в низинах выше пояса. Плющ-душитель вьётся по стволам; несколько деревьев задушены полностью и стоят зелёными колоннами с мёртвым деревом внутри.
СЕНСОРИКА ЛЕСА. Сырая земля, прелая листва, грибок, поверх — кислинка смолы, в низинах тухлятина болота. Тишина неправильная: капель без дождя, треск там, где никто не ходит. Сумрак в любое время суток; в полдень как поздней осенью за час до заката, ночью — абсолютная темнота.
ОПАСНОЕ. Красная шляпка — гриб на гнилых пнях, выглядит съедобным, только ярче; конвульсии через два часа. Белый плющ в глубине: сок даёт волдыри за шесть часов, в глазах — слепота до суток.
ТОПЬ. Тростник стеной на три-четыре метра — лодку в нём не видно с трёх шагов. Рогоз съедобен, корень богат крахмалом. Болотный мох выглядит твёрдой землёй, человек проваливается по пояс мгновенно. Водяная чума-ряска в тумане делает воду неотличимой от берега. Болотный белладонн с фиолетовыми ягодами — паралич дыхания за двадцать минут.` },

        { id: "flora_other", title: "Флора Хребта, побережья, равнин и алкоголь", keys: ["хреб", "горн", "побереж", "равнин", "поле", "поля", "хмел", "вино", "пив", "сидр", "табак", "рожь", "яблон"], constant: false, order: 401, scanDepth: 4, recursive: false, maxChars: 1853,
          text: `ХРЕБЕТ. Высокогорье убивает методично, растительность здесь борьба, а не украшение, и потому концентрированная. Железный стланик — карликовая сосна, стелется вдоль камня и не поднимается выше колена; ствол в руку бывает старше столетия. Серый чабрец в скальных трещинах, запах резкий и холодный, в горной концентрации вдвое сильнее равнинного — основа болеутоляющего, сбор контролирует Орден. Горная живица из-под корней стланика — сильный антисептик до затвердевания. Чёрный лишайник на северных сторонах скал съедобен после варки: горький, питательный, гарнизон Монтина знает рецепт. Ветреница Хребта — единственный цветок на этой высоте, живёт две недели в начале весны, Ложа платит за неё непропорционально много и не объясняет почему.
ПОБЕРЕЖЬЕ. Почва солёная и тонкая, растения приземистые и жёсткие. Морской овёс держит берег от размыва. Солянка идёт на мыловарение. Морской чистотел в расщелинах скал даёт едкий оранжевый сок для кислотных составов. Штормовой мох в зоне прибоя скользок до опасности. У Кладбища китов почва химически иная: белая костяника растёт только в тени рёбер левиафанов, и Ложа платит за неё по весу как за золото.
РАВНИНЫ. Единственная зона, где природа отступила перед человеком: поля, пастбища, придорожные дубравы. Опасность здесь человеческая. Поля, заброшенные после Чумы, заросли бурьяном и молодым осинником — такие места обходят. Полевая рожь — основная культура, зерновые запасы Дом Кальвер держит как политический инструмент.
АЛКОГОЛЬ. Пиво варят в каждой деревне на своём хмеле, без всякого контроля. Яблоки идут на сидр, и северные деревни пьют его чаще пива — он дешевле всего. Вишня и слива на наливки и настойки: напиток стражников, мастеровых, мелких торговцев. Виноград в северном климате не вызревает, вино привозное. Крепкое с востока через Монтин — для знати. Табак с юга — отдельный статусный товар.` },

        { id: "ingredients", title: "Алхимические ингредиенты", keys: ["ингредиент", "серая плет", "чёрный мох", "черный мох", "слепен", "болотный мак", "дурман", "плевальщиц", "желч", "жир левиафан", "живиц", "костяник", "купорос", "собира", "сбор"], constant: false, order: 402, scanDepth: 4, recursive: false, maxChars: 2050,
          text: `РАСТИТЕЛЬНОЕ. Серая плеть (Гнилой Лес) — нитчатый гриб-паразит на корнях мёртвых деревьев, выглядит как седые волосы, свисающие с гнилого пня; основа регенерирующей микстуры, форсирует деление клеток — отсюда и лихорадка, и риск отказа органов. Споры дают сыпь на месяц, собирать только с тряпкой на лице. Чёрный мох на камнях у болот замедляет гниение: антисептик, консервант, в концентрате основа паралитической пыли. Слепень — кустарник с белыми ягодами в самой тёмной глубине леса, основа ослепляющей вспышки; птицы после ягод теряют ориентацию на часы. Кесс знает, где он растёт, и маршрут туда только через его людей. Болотный белладонн, белая костяника, морской чистотел, горный чабрец и горная живица описаны в записях о флоре. Дурман-трава растёт на равнинах повсеместно: жуют или заваривают, лёгкое головокружение и притупление голода — крестьяне используют, когда еды мало, стража смотрит сквозь пальцы. Болотный мак сильнее дурмана и слабее алхимии, в города попадает через мелких торговцев. Кислый гриб — эффект непредсказуем, от эйфории до ужаса.
ЖИВОТНОЕ. Желчь лесных волков — катализатор регенерирующей микстуры: пузырь брать целиком и сразу в спирт, иначе катализатор мёртв, три-пять штук на партию. Сначала, впрочем, надо убить лесного волка, а они ходят по двадцать и молча. Яд болотных гадюк — основа паралитической пыли. Жир левиафана горит даже в воде; добыча опасна не из-за костей, а из-за того, что приходит ночью. Железы плевальщицы — крупной болотной жабы, что плюётся кислотой на два метра с точностью; попадание в глаза калечит зрение навсегда. Ложа официально этим не торгует, неофициально — через Серый картель.
МИНЕРАЛЬНОЕ. Горная сера из фумарол Хребта — взрывные и дымовые составы, Орден добывает сам и продаёт дозированно. Болотный битум — связующее. Железный купорос из шахт, отход Коллегии. Глубоководная соль из пещер под Кладбищем китов — стабилизатор.
МОНОПОЛИЯ. Что плеть и желчь суть основа — знает любой ученик Ложи. Секрет в обработке и пропорции, и на нём держатся три-четыре производителя на всю страну.` },

        { id: "fauna", title: "Дикая фауна", keys: ["звер", "волк", "медвед", "лось", "лося", "лиса", "лисы", "олен", "хищник", "охот", "фаун", "стая", "стаи", "берлог", "кабан", "орёл", "акул", "тюлен"], constant: false, order: 403, scanDepth: 4, recursive: false, maxChars: 2013,
          text: `ГНИЛОЙ ЛЕС. Основа цепочки — кабаны, олени, зайцы, грызуны; лес богат, голода нет, и потому хищники здесь крупнее. Лось вырастает заметно больше обычного, в гон бьёт передними копытами и опасен не меньше кабана. Медведь крупнее равнинного и темнее, людей не боится — двадцать лет без серьёзной охоты; без причины не агрессивен, но «без причины» у медведя означает не то же, что у человека. Весной выходит голодным, первые две недели самый опасный. Волки ходят стаями до двадцати, тёмная шерсть, охотятся в полной тишине; с медведем за территорию конкурируют, но прямых столкновений избегают. В глубине есть следы, не принадлежащие ни одному известному животному; они ведут к тому, что осталось от оленя или кабана, иногда от человека. Это не обсуждают.
РАВНИНЫ. Фауна бедна после столетий охоты: заяц, куропатка, перепел — основа крестьянской охоты. Олень в придорожных дубравах пуглив и умён, угодья держит Дом Кальвер и бьёт за браконьерство жёстко. Волк здесь редок — изгои и молодые самцы.
ХРЕБЕТ. Горный козёл — основная добыча, стада по 10–15 голов ходят одними маршрутами из поколения в поколение. Горный лев редок и одинок, прыгает с высоты, первым ударом лапы ломает шею; шкура стоит как хороший контракт, охоту монополизировал Орден. Горный орёл с размахом до двух метров уносит детей и мелкий скот, когти оставляют плохо заживающие раны. Сурок кормит гарнизон Монтина, жир идёт от обморожений.
ПОБЕРЕЖЬЕ. Треска, сельдь, камбала — главный ресурс. Серая акула крупнее и злее обычных, летом держит рыбаков у берега. Тюлень на скальных мысах: жир и шкура, мясо едят только в голодный год. Левиафаны существуют — кости на Кладбище тому доказательство; живых видят редко, только в шторм и только силуэтом.
ВЫДАЮЩИЕСЯ. В каждой зоне есть звери, пережившие достаточно: родились крупнее и быстрее, а десятки встреч с охотниками довершили дело. Охотники знают таких поимённо и передают сведения устно. Через контору Сайдена иногда проходит заказ, когда зверь начинает вредить систематически: цена высокая, берутся редко.` },
        /* --- ХОЗЯЙСТВО, ПРАВО, СОСЕДИ --- */
        { id: "trade", title: "Ресурсы и торговля", keys: ["торговл", "ресурс", "импорт", "экспорт", "желез", "зерн", "соль", "пушнин", "обоз", "груз"], constant: false, order: 311, scanDepth: 4, recursive: false, maxChars: 1619,
          text: `ЖЕЛЕЗО И УГОЛЬ — главное богатство страны. Западный склон Хребта с мелкими шахтами Коллегия держит напрямую, и этого хватает на базовое производство; лучшая руда идёт с восточного склона только через перевал Ордена. Треугольник устойчив: Коллегия делает, Орден пропускает, Рохт торгует.
ЗЕРНО И СКОТ — второй столп. Центральные равнины кормят Кордим, и Дом Кальвер держит это поколениями через долговое рабство. Голод не постоянен, но всегда возможен: два плохих урожая подряд или перекрытая река.
РЫБА И СОЛЬ. Соль важнее рыбы: без неё не сохранить мясо, не выдубить кожу, не сварить половину лекарств Ложи. Соляные болота у Топи от портовых синдикатов не зависят.
СТРОЕВОЙ ЛЕС. Гнилой Лес формально ничей, Ручейный работает через людей Кесса. Дом Рохт хотел бы взять его под контроль, но мешают три слоя: лес делает операцию физически бессмысленной, политическая цена высока, а Кесс держит компромат на поставки Рохта.
ПУШНИНА — лиса, бобёр, куница, промысел организует Дом Кальвер. ТАБАК идёт с юга, монополию Дом Сел держит тихо.
ИМПОРТ. С востока через Монтин — специи, красители, дорогие ткани, крепкое в маленьких бутылях. Редкие металлы оттуда покупают Ложа и Коллегия, и зачем — публично не обсуждается. С юга морем и сушей — вино, специи, табак.
РЫЧАГИ. Перекрыть Монтин — восточная торговля встаёт; Орден делал это трижды, и трёх недель хватало, чтобы Рохт шёл на переговоры. Перекрыть реку у Ошерска — встаёт половина речной торговли, четыре баржи Крайма и есть горло целого региона. Закрыть Порт Теней — встают дальние рейсы Дома Сел. Плохой урожай автоматически делает Кальвера самым влиятельным в Совете.` },

        { id: "blades", title: "Свинцовые клинки", keys: ["Свинцов", "клинк", "Седой", "Седого", "Седому", "пират", "флот", "серый парус", "абордаж"], constant: false, order: 209, scanDepth: 4, recursive: false, maxChars: 2046,
          text: `Официального имени у них нет — прозвище кордимское, по цвету парусов: серые в тумане Свинцового моря почти не видны. Как организация существуют около четырёх лет: Седой вернулся из похода в 1022-м и за три года собрал флот.
БАЗА на Кладбище китов: между рёбрами левиафанов три мелкие бухты, с моря не видны, с берега — туман и кости. Постройки лагеря врублены прямо в скелеты, рёбра работают несущими балками.
ПРАВИЛО НОЧИ. После заката никто не идёт к воде, что бы ни случилось. За четыре года нарушили трое. Все трое не вернулись. Седой не комментировал.
ФЛОТ. Шесть кораблей. Пять рабочих — быстрые, мелкосидящие, плоское дно, одна мачта, вёсла, паруса крашены в серый, старые, но ухоженные до педантизма. Экипаж рабочего судна около двадцати человек, и это уже тесно: гребцы они же абордажная партия, поэтому потеря даже пятерых выводит корабль из строя до нового набора. Шестой — большой, другой постройки, для открытого моря; ходит с сокращённой командой, собранной с остальных, и пока он в море, флот не работает целиком.
ТАКТИКА. Разведчик неделями отслеживает маршруты. Подходят на вёслах в тумане, без парусов. Алхимия вместо пушек: ослепляющие вспышки и едкий дым через Серый картель. Абордаж — крюки, верёвки, короткий бой, всё за несколько минут. Пленных не берут из практичности: команду в шлюпки и к берегу.
КОДЕКС. Рыбаков не трогают никогда. Мелкого торговца предупреждают и дают сдать груз. Суда Торговых домов и синдикатов берут без переговоров. Нарушение кодекса внутри — один разговор, второго не бывает.
СЕДОЙ. Около тридцати пяти, волосы совершенно белые — слишком рано для возраста. Среднего роста, жилистый, две сабли за спиной крест-накрест, левой дерётся чуть лучше и этим сбивает с толку. Пришёл в Порт Теней матросом, через год ушёл на запад в открытое море, вернулся один на чужом корабле и без команды. Что было в том походе, не говорит. Откуда деньги на флот — белое пятно. Знает Свинцовое море, как Кесс знает лес: иногда меняет курс без объяснений, и там оказывается шторм или патруль. На запад не ходит никогда.` },

        { id: "literacy", title: "Письменность и грамотность", keys: ["грамотн", "письм", "архив", "документ", "чтец", "подпис", "печат", "акцент", "диалект"], constant: false, order: 312, scanDepth: 4, recursive: false, maxChars: 1298,
          text: `КТО ЧИТАЕТ. В крупных городах грамотны около двадцати из ста взрослых, в деревне — один-два человека, если повезёт, а чаще никого. Гарантированно читают священники, купцы среднего звена, чиновники Совета, люди конторы Сайдена, опытные вольные бойцы. Частично — мастера Коллегии, трактирщики больших городов, офицеры стражи. Практически никогда — крестьяне, портовые грузчики, солдаты.
СЛЕДСТВИЯ. Устное слово для большинства весит больше письменного: сделки заключают через свидетелей, а не через бумагу, и репутация остаётся единственной гарантией для того, кто не читает.
ПОДПИСЬ — личная печать либо крестик с отпечатком пальца.
ВЛАСТЬ БУМАГИ. Седрик тридцать лет держит чужие дела в личной коллекции — не служба и не архив, один человек, который всё сложил и всё помнит; Марра боится его не потому, что он силён, а потому, что он знает. Церковные архивы фиксируют крещение, венчание и смерть — единственное официальное подтверждение, что человек существовал. Долговые расписки Кальвера крестьяне подписывают крестиком, не умея прочесть, и это не случайность, а система.
ЯЗЫК. По всей стране один язык с областными говорами; столичный считается правильным, и провинциальный выговор выдаёт происхождение мгновенно. Люди глубинных хуторов говорят на варианте, который горожанин понимает с трудом. За Хребтом язык другой. Орден это знает и молчит.` },

        { id: "lindas", title: "Линдас — южный сосед", keys: ["Линдас", "южан", "южный сосед", "южная границ", "Сыны Солнца", "Марс"], constant: false, order: 313, scanDepth: 4, recursive: false, maxChars: 2116,
          text: `Образованные люди — Совет, контора Сайдена, Дом Сел — знают название. Остальные говорят «южане» или «те за границей». Линдас начинается за два дня пути южнее Врат, и граница не линия, а полоса спорных земель шириной около дневного перехода.
ПОЧЕМУ ВОЮЮТ. Официально — за торговые пути: Линдас хочет прямой выход на север без посредников, Кордим хочет сохранить транзит. Неофициально Дом Сел и несколько советников зарабатывают на войне больше, чем заработали бы на мире, — поставки армии, контракты, торговля сведениями с обеих сторон. Мир невыгоден тем, кто принимает решения.
ИЗНУТРИ. Линдас старше, населённее и имеет письменную историю, которой у Кордима нет. На северного соседа смотрят как на варваров с деньгами и всё же торгуют. Теплее, южнее, виноградники и специи, города древнее, грамотность выше.
РЕЛИГИЯ другая, и это решает всё. Смерть в бою за правое дело считается не концом, а переходом. Вернуться живым без приказа — социальная смерть: семья отворачивается, теологи не дадут обряда, имя вычёркивают из списков павших. Солдаты не храбрее — они иначе считают смерть и позор, и отступление для них теологическая проблема.
КАК ВОЮЮТ. Построение — таран: щит к щиту, плотно, медленное давление. Не быстры и не манёвренны, но устойчивы до абсурда; кордимская конница против них вдвое менее эффективна. Слабость не в людях, а в конструкции: таран работает, пока строй единый кусок, а удар с фланга рассекает его, и отрезанные части продолжают давить вперёд, потому что разворот не их задача. Поэтому Линдас избегает генеральных сражений и держится укреплённых форпостов и проходов. На ровном поле почти непробиваемы, на пересечённой местности — другой разговор. Осады ведут методично, провизию организуют лучше кордимцев.
МАРС. Легендарный командир тяжёлой пехоты, ветеран арен: гигант с гигантским копьём и ростовым щитом, бросок пробивает человека насквозь. Прозван «Кровавым Смехом» — кордимцы считают, что он смеётся в бою, но это хриплое дыхание гиганта под нагрузкой в глухом доспехе. Его отряд «Сыны Солнца» — бывшие аренные бойцы, ставшие элитной пехотой. Идвальд его уважает, кордимские командиры боятся.` },

        { id: "plague_quarter", title: "Чумной квартал и Илай Крысолов", keys: ["Чумной квартал", "Чумного квартал", "Илай", "Крысолов", "вены", "подземель"], constant: false, order: 114, scanDepth: 4, recursive: false, maxChars: 1951,
          text: `СТАТУС. Замурован после первой волны Белой Чумы, около 986 года. Официальная позиция Совета — пустая карантинная зона, вход запрещён бессрочно. Фактически внутри живёт несколько сотен человек: потомки тех, кто не успел выйти или не захотел. Второе поколение никогда не видело города снаружи.
БЫТ. Огороды на плоских крышах, дождевая вода, крысы и голуби как основной белок, ремесло из мусора и обломков прошлого. Золото внутри бесполезно, расчёты только натурой — еда, инструменты, лекарства. Ночью в окнах видят огни, и стража натренирована смотреть в другую сторону.
ПОЧЕМУ НЕ СОЖГЛИ. Квартал стоит на старых каналах, и внутри есть прямой выход в подземную водную систему Столицы — единственная неконтролируемая магистраль в городе, минующая заставы Вейра. Слишком многие влиятельные люди кормятся с этой контрабанды.
СДЕРЖИВАНИЕ. Илай дал понять, что у него есть уцелевшие образцы Чумы и что при появлении войск с факелами ампулы разобьются в главных стоках Верхнего города. Есть ли они на самом деле, не знает никто снаружи. Возможно, зараза давно деградировала. Возможно, внутри нашли способ её сохранить. Возможно, Илай блефует двадцать лет. Советники понимают, что проверка стоит дороже, чем отказ от проверки, и этого достаточно.
ВЕНЫ — система лазов и каналов, связывающая квартал со Столицей. Кесс гоняет через них редкие ингредиенты, Серый картель — свои грузы. Здесь же хранят «горячие» грузы и людей, которых официально не существует; если человека надо спрятать надолго или надёжно убрать, его проводят внутрь, и больше его не видят.
ИЛАЙ КРЫСОЛОВ, около сорока пяти. Родился не здесь: ему было пять, когда опустились решётки, и он помнит, как закрывались ворота. Наружу не выходит никогда, но имеет десятки глаз и ушей по Столице среди нищих и чтецов. Убеждён, что Чума была искусственной зачисткой Нижнего города, а выжившие квартала — случайный брак успешной операции. Версия стройна, логична и делает его совершенно бескомпромиссным.` },

        { id: "law", title: "Правовая система", keys: ["закон", "преступлен", "наказан", "долговое рабство", "юрисдикц", "штраф", "суд", "арест", "приговор"], constant: false, order: 314, scanDepth: 4, recursive: false, maxChars: 1827,
          text: `СУТЬ. Единого кодекса в Кордиме нет. Правосудие опирается на прецеденты, хартии отдельных городов и власть денег. Закон — это то, что может позволить себе тот, кто платит городской страже. Понятия «справедливость» не существует, есть понятие «компенсация ущерба».
СТРАЖА — муниципальный инструмент, а не полиция. Своей волей ничего не расследует: следствие идёт, только если потерпевшая сторона за него платит. Крупный налогоплательщик де-факто неуязвим для рядовых претензий, а если Совет решит надавить на конкурента, стража внезапно вспомнит все забытые статуты.
УБИЙСТВО преследуют, только если у жертвы был защитник с деньгами, связями и желанием поднимать шум. Случайная жертва — вопрос финансового веса, а не морали: если шальной болт убивает долгового раба Дома Кальвер, дела об убийстве не заводят, а счетоводы выставляют стрелку счёт за уничтожение ценного имущества.
ДОЛГОВОЕ РАБСТВО полностью законно и оформляется у нотариусов. Должник теряет право собственности на самого себя на срок долга, который из-за процентов обычно становится пожизненным. Раб — инструмент: за его преступление отвечает хозяин, платит штраф городу и забивает виновного сам в назидание остальным.
ЭКСТЕРРИТОРИАЛЬНОСТЬ. Стража не вправе арестовать мастера Ложи или священника — попытка создаёт институциональный конфликт. Ложа и Церковь судят своих сами, в подвалах и без лишних глаз.
МЕСТНОСТЬ. Закон Столицы не действует за её воротами. В Смитгарде последнее слово за главой Коллегии, в Порту Теней законно то, что одобрили Дорры или Нотариус, на перевале судит Орден военным трибуналом. В Топи и Гнилом Лесу законов нет вовсе.
СУДЫ существуют формально при крупных домах и советах, а на практике процесс — инструмент затяжной финансовой войны: бедняк проигрывает не потому, что неправ, а потому, что не может оплачивать месяцы проволочек.` },

        { id: "contracts", title: "Как устроены дела через контору", keys: ["дело", "заказчик", "заказ", "оплата", "посредник", "контора"], constant: false, order: 210, scanDepth: 4, recursive: false, maxChars: 1700,
          text: `ЧТО ТАКОЕ КОНТОРА. Не тайное общество и не профсоюз, а частная семейная контора Брока Сайдена — товар её не работа, а слово: перед заказчиком за исполнителя, перед исполнителем за оплату. Ни власти, ни мандата, ни права на насилие у неё нет, своих людей тоже — есть книга имён.
КАК ПРИХОДИТ ДЕЛО. Заказ нигде не вывешивают: бумага на виду — улика. Человека зовут — мальчишка с запиской, слово через хозяйку таверны, «зайди завтра». Сайден или его писарь слушает и проверяет, чем платят и чего на самом деле хотят; заказчика Сайден знает всегда, исполнителю имя называют, если заказчик не доплатил за молчание.
ОТКАЗ И ПРОВАЛ. Позванный вправе отказаться без всякого наказания, кроме очереди — в следующий раз позовут не первым. Наказуемо только брошенное уже взятое дело.
ОПЛАТА. Жетон — именной знак поручительства, не лицензия и не разрешение убивать. С жетоном заказчик соглашается платить вперёд. Контора берёт своё с заказчика — десятой частью сверх цены; с исполнителя не удерживает ничего.
ЖЕТОН И МЕСТЬ. Если человека под словом конторы убили, Сайден не объявляет никого целью — снимает своё слово со всех дел убийцы и говорит об этом там, где слушают. Жетон срезают публично, во дворе, при тех, кто был: не приговор, а отказ отвечать за тебя вслух.
МИМО КОНТОРЫ, через посредника — быстрее, дешевле, опаснее. Задатка на хранении нет, перерасход не возмещают, защиты не даёт никто.
ОХОТНИКИ работают иначе: только по публичным наградам и мандатам городских советов, закрытых заказов от частных лиц не берут.` },

        { id: "deep_farms", title: "Глубинные хутора", keys: ["Глубинн", "хутор", "Глубина", "сдвиг речи"], constant: false, order: 115, scanDepth: 4, recursive: false, maxChars: 1340,
          text: `Поселения в самых старых и непроходимых частях Гнилого Леса. Жители не ищут контакта, не выходят к трактам и не торгуют. Существование подтверждается косвенно: на приметных старых деревьях в глубине появляются странные подношения — сплетённые корни, инструменты непонятного назначения, однажды вырезанная из кости фигурка, похожая на детскую игрушку. Следов вокруг нет, но вещи всегда свежие. Кесс отлично знает, где начинаются их территории, и не обсуждает это даже с доверенными.
ЕДИНСТВЕННЫЙ ЗАДОКУМЕНТИРОВАННЫЙ СЛУЧАЙ. Охотник заблудился в тумане и вышел на хутор. Вернулся через три недели. Говорил мало — не потому, что скрывал, а потому, что не находил слов. Речь изменилась необратимо: слова обычные кордимские, но грамматика и построение фраз сдвинулись так, что смысл ускользал, оставляя сосущую тревогу. Смотрел чуть мимо собеседника. Заданные вопросы понимал, но отвечал на другие, будто слышал иной слой. Через месяц умер во сне без следов насилия, яда или болезни. Городской лекарь ничего не записал в журнал: молча поставил крест напротив фамилии и перевернул страницу.
ЛОЖА официально отрицает существование хуторов, списывая слухи на болотную лихорадку и бредни браконьеров. В её закрытых архивах есть запертый шкаф, а в нём том с пустыми страницами и рукописной пометкой на обложке: «Глубина». Оглавление вырвано с корнем.` },
        /* --- ЛЮДИ, КОТОРЫХ МОЖНО ВСТРЕТИТЬ --- */
        { id: "torn", title: "Торн", keys: ["Торн", "Эйгон Кальвер", "бастард"], constant: false, order: 500, scanDepth: 4, recursive: false, maxChars: 1238,
          text: `Правая рука Седого, мозг и главный логист Свинцовых клинков. Настоящее имя — Эйгон Кальвер.
ВНЕШНОСТЬ. Тридцать пять. Светлая аккуратная борода, вечно прищуренные глаза. Поношенная, но качественная кираса и дешёвый амулет, который он никогда не снимает.
МАСКА. «Свой в доску парень»: смеётся, пьёт с матросами, хлопает по плечам — и кристально их презирает, не из высокомерия, а от усталости. Блестящий тактик и переговорщик, историю и законы Кордима знает лучше столичных советников.
ЧЕГО ХОЧЕТ. Он бастард лорда Эйнара Кальвера, непризнанный: отец о нём попросту не думает. Мать была долговой рабыней и умерла от истощения на пшеничных полях, пока законные наследники пили вино. Торн рано понял, что система не сломана, — она работает ровно так, как задумана. Его цель не убийство отца, а уничтожение Дома Кальвер целиком: сжечь поля, стереть имя, пустить долговые книги по ветру. Свинцовые клинки для него армия и инструмент.
БОЙ. Мясник с головой тактика, тяжёлый зазубренный палаш. Честно не дерётся никогда: плюнет кровью в глаза, бросит песок, толкнёт под ноги врагу своего же раненого матроса. Черту перешёл давно и оправданий не ищет — важен результат. Один на один выходит, только если уверен на сто процентов или загнан в угол.` },

        { id: "brant", title: "Грегор Брант", keys: ["Брант", "Грегор", "жетоны на ше", "полуторный меч"], constant: false, order: 501, scanDepth: 4, recursive: false, maxChars: 1498,
          text: `Элитный охотник за головами. Садист и коллекционер чужих смертей.
ВНЕШНОСТЬ. Высокий, неестественно худой. Мертвенно-бледное лицо, усы, опускающиеся за уголки губ, пустые рыбьи глаза. Только лёгкий потёртый кожаный колет, ничего лишнего. Движется с пугающей механической плавностью — не крадётся, просто так ходит.
ПРИРОДА. Никакой трагической предыстории: он таким родился. Дисциплинированный садист, никакого хаоса — холодный выбор жертвы и хирургическое исполнение.
ТРОФЕИ. Работает через Далка Сурна, но не подчиняется ему: Сурн для него диспетчер с хорошим меню. Золото не интересует, интересует процесс. Берёт публичные контракты исключительно на тех, с кого контора Сайдена сняла своё слово: находит, ломает физически и психологически, убивает, срезает с шеи номерной жетон — то, что Сайден сделал бы формально и без крови, Брант делает буквально. Связку жетонов носит на цепи, и при ходьбе они тихо звенят. Сайдена и Марру Холт трясёт от ярости, но технически Брант делает их грязную работу, и его терпят. Для того, кто ходил под словом Сайдена, этот тихий звон означает смерть.
БОЙ. Полуторный меч без украшений, идеально сбалансированный. Никакой алхимии и арбалетов. Нечеловеческая скорость, абсолютное чувство дистанции, полное отсутствие страха. Побеждает до первого удара — заставляет противника себя бояться. На десяти шагах и дальше отобьёт клинком одиночный брошенный нож; ближе пяти или при залпе в три-четыре ножа уходит за укрытие, потому что физика не позволяет иного.
ТРЕЩИНА одна: он позволяет разговору длиться дольше, чем следует, если противник достаточно интересен.` },

        { id: "leon", title: "Леон Клятвопреступник", keys: ["Леон", "Клятвопреступник", "гвардеец", "Кеан Вейр"], constant: false, order: 502, scanDepth: 4, recursive: false, maxChars: 1721,
          text: `Странствующий рыцарь, бывший командир Королевской Гвардии. Человек, потерявший смысл обнажать клинок.
ВНЕШНОСТЬ. Лет тридцать восемь. Высокий, когда-то безупречно сложенный; сейчас плечи чуть опущены — не от слабости, а от укоренившейся привычки не занимать места. Лицо красивое и злое разом. Дорогой идеально сбалансированный полуторный меч лежит в дешёвых потёртых ножнах. Герб на нагруднике не замазан, а физически стёрт металлом по металлу — методично, будто он делал это долго и с извращённым удовольствием.
ПАДЕНИЕ. Пять лет назад при подавлении бунта в Столице он убил Верховного Советника Кеана, родственника лорда Вейра, прямо на ступенях Ратуши и на глазах у солдат. Кеан приказал сжечь жилой квартал Нижнего города вместе с людьми, прикрывшись угрозой заразы. Леон воткнул ему меч в горло и сказал только: «Нет». Идвальд под давлением Вейров лишил его титула, земель и имени в реестре Гвардии.
РАНА. На суде женщина, которую он лично вытащил из огня, дала показания против него: заявила, что приказа сжигать людей не было. Не за золото — люди Вейра нашли её раньше, и она отреклась от правды, чтобы её дети остались живы. Леон это понимает и молчит, потому что правда её убьёт.
СЕЙЧАС. Он лучший фехтовальщик Кордима, и это его и убивает: победа перестала что-либо давать. Пьёт не чтобы забыть, а чтобы руки немного дрожали и бой снова требовал усилия. Ищет не реабилитации и не мести, а одну причину, ради которой стоит быть трезвым.
БОЙ. Полуторный меч и эталонная работа ног. Не рубит — перенаправляет: инерция противника, минимум силы, максимум точности. Даже с похмельной дрожью разберёт троих наёмников без царапины, просто из раздражения. Иногда даёт противнику лишнюю секунду — не из жалости, из скуки.` },

        { id: "kael", title: "Каэл, Король сточных крыш", keys: ["Каэл", "Король сточных крыш", "сточн"], constant: false, order: 503, scanDepth: 4, recursive: false, maxChars: 1126,
          text: `Городская легенда Столицы. Говорят, в одиночку вырезал отряд стражи двумя ножами и знанием подворотен. Работал на Дом Сел, ходил под словом Сайдена, теперь ни на кого. Появляется, когда хочет, и исчезает раньше, чем его начинают искать.
ВНЕШНОСТЬ. За пятьдесят. Жилистый и сухой, как верёвка, пролежавшая зиму на улице. Потёртый кожаный плащ, два шрама через левую бровь. Глаза стервятника — не злые и не добрые, оценивающие: смотрит на людей как на задачи с известным решением.
ФИЛОСОФИЯ. Проповедует нигилизм: мир — сточная канава, выживают те, кому нечего терять. Утверждает, что ничем не одержим и просто живёт. На деле одержим доказательством собственной правоты — что привязанность убивает. Каждый раз, когда кто-то выживает благодаря связи с другим человеком, это злит его сильнее, чем должно бы злить равнодушного.
БОЙ. Мастер вертикального боя: кошки, тросы, крюки, движение по балкам и крышам. Два тяжёлых тесака-бритвы и два самодельных кулачных арбалета на предплечьях. Бьёт сверху, из тени; его стиль — террор через среду, противник никогда не знает, где он. Единственная слабость — открытое пространство без вертикали.` },
        { id: "hada", title: "Хада, Золотой Демон", keys: ["Хада", "Хады", "Хаду", "Золотой Демон", "Золотого Демона", "Шёпот", "Шепот", "белая маск"], constant: false, order: 504, scanDepth: 4, recursive: false, maxChars: 1932,
          text: `Независимый наёмник, снайпер-виртуоз, маньяк-эстет.
ВНЕШНОСТЬ. Высокий, пугающе худой — не болезненно, а как натянутая струна. Асимметричный плащ из дорогой ткани, всегда безупречно чистый, что в Кордиме само по себе аномалия. Лицо скрыто белой театральной маской без рта, только прорези для глаз; под ней каша из шрамов. Движется тихо и намеренно, никогда не торопится.
ФИЛОСОФИЯ. Презирает войну, массовые казни и случайные убийства: смерть, в которой жертва не успела осознать происходящее, для него варварство и мусор. Убивает, чтобы составить композицию — послание, которое должен прочитать идеальный зритель.
ЧЕТЫРЕ АКТА. Первый выстрел — повреждение: тело узнаёт, что умирает. Второй — дезориентация: разум перестаёт держать пространство. Третий — загон: жертва понимает, что выхода нет. Четвёртый — единственный, который имеет значение. Пятого выстрела он не делает никогда: если четырёх не хватило, представление провалилось. Такое случалось дважды, и оба раза он исчезал на недели, а возвращался с новым планом, точнее прежнего.
ШЁПОТ. Уникальный тяжёлый арбалет, единственный в Кордиме механизм с боковым пружинным магазином на четыре болта: короткое движение рычага предплечьем взводит тетиву и подаёт болт, три секунды между выстрелами. Сделан мастером, которого больше нет, требует металлургии, недоступной Коллегии, запасных частей не существует.
ДВА РЕЖИМА. Постановочный: магазин снят, зарядка вручную хрупкими алхимическими болтами — автоподача просто раздавила бы их. Боевой: магазин пристёгнут, обычная сталь, высокая скорость, никакой алхимии; переход в этот режим для него унижение, осанка меняется, движения становятся злыми. Смена режима занимает несколько секунд.
СЛАБОЕ МЕСТО. В ближний бой не вступает принципиально — хаос некрасив. Прижатый вплотную уйдёт любой ценой, бросив контракт.
ПРАВИЛО ОХОТНИКОВ. Нашёл композицию Хады и кровь ещё свежая — разворачивайся и беги: значит, ты уже часть новой сцены.` },

        { id: "loki", title: "Локи Птицелов", keys: ["Локи", "Птицелов", "птичк", "топорик"], constant: false, order: 505, scanDepth: 4, recursive: false, maxChars: 1946,
          text: `Главный информатор Порта Теней. Эксцентричный механик, мастер слухов, хаотичный союзник.
