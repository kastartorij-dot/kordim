<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кордим: Хроники</title>
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #5e1818;
            --accent-hover: #7a2222;
            --border: #333;
            --panel-bg: #1e1e1e;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .screen {
            display: none;
            background: var(--panel-bg);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .screen.active {
            display: block;
        }
        h1, h2 {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-top: 0;
        }
        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: var(--text);
            box-sizing: border-box;
            font-family: sans-serif;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0 20px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 2px;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background: var(--accent-hover);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .btn-green { background: #2e4a2e; }
        .btn-green:hover { background: #3a5c3a; }
        .btn-gray { background: #444; }
        .btn-gray:hover { background: #555; }
        
        .saves-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .saves-panel button { flex: 1; }
        
        #story-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        /* --- реплики --- */
        .msg { display: flex; gap: 12px; margin-bottom: 24px; align-items: flex-start; }
        .msg-icon {
            flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif; font-size: 13px; margin-top: 3px; user-select: none;
        }
        .msg-user .msg-icon { background: #3a3a3a; color: #ddd; }
        .msg-ai .msg-icon { background: var(--accent); color: #fff; }
        .msg-body { flex: 1; min-width: 0; white-space: pre-wrap; }
        .msg-user .msg-body {
            color: #b9b9b9; font-style: italic;
            border-left: 2px solid #3a3a3a; padding-left: 12px;
        }
        .msg-actions {
            display: flex; align-items: center; gap: 4px;
            margin-top: 12px; white-space: normal;
        }
        .icon-btn {
            background: transparent; border: 1px solid transparent; color: #6f6f6f;
            padding: 5px 6px; margin: 0; border-radius: 4px; line-height: 0; cursor: pointer;
        }
        .icon-btn:hover { background: #2a2a2a; color: #ddd; }
        .icon-btn:disabled { background: transparent; color: #3a3a3a; cursor: not-allowed; }
        .archive-note {
            font-family: sans-serif;
            font-size: 12px;
            color: #6f6f6f;
            text-align: center;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #333;
        }
        .swipe-count {
            font-family: sans-serif; font-size: 12px; color: #777;
            min-width: 40px; text-align: center;
        }
        .actions-sep { width: 1px; height: 16px; background: #333; margin: 0 4px; }

        /* --- выбор модели --- */
        .model-field { display: flex; gap: 10px; align-items: center; }
        .model-field input { margin: 10px 0; }
        .model-field button { margin: 0; white-space: nowrap; }
        .picker {
            display: none; border: 1px solid var(--border);
            background: #161616; border-radius: 4px; margin-bottom: 10px;
        }
        .picker.on { display: block; }
        .pick-head { padding: 10px; border-bottom: 1px solid var(--border); }
        .pick-search { margin: 0 0 8px !important; }
        .pick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            background: #2a2a2a; border: 1px solid var(--border); color: #bbb;
            font-size: 12px; padding: 4px 10px; margin: 0; font-family: sans-serif;
        }
        .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
        .pick-rows { max-height: 320px; overflow-y: auto; }
        .model-row {
            display: flex; justify-content: space-between; gap: 10px;
            padding: 8px 10px; border-bottom: 1px solid #222; cursor: pointer;
            font-family: sans-serif; font-size: 13px;
        }
        .model-row:hover { background: #222; }
        .model-row b { font-weight: normal; color: #ddd; overflow: hidden; text-overflow: ellipsis; }
        .model-row span { color: #888; white-space: nowrap; }
        .model-row.free b { color: #8fbf8f; }
        .pick-none { padding: 12px; color: #777; font-family: sans-serif; font-size: 13px; }

        /* --- слоты и меню --- */
        .slot-active { outline: 1px solid #7ea87e; }
        .saves-panel .slot-cell { flex: 1; display: flex; gap: 4px; min-width: 0; }
        .saves-panel .slot-cell > button { flex: 0 0 auto; }
        .saves-panel .slot-cell > .btn-green,
        .saves-panel .slot-cell > .btn-gray:first-child { flex: 1 1 auto; min-width: 0; }
        .slot-reset { padding: 10px 12px; font-size: 16px; line-height: 1; }
        .newgame-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .newgame-row label { margin: 0; }
        .newgame-row select { width: auto; margin: 0; }
        .newgame-row button { margin: 0; }
        .back-row { margin-bottom: 15px; }

        /* --- телефон --- */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .screen { padding: 16px 14px; }
            h1, h2 { font-size: 24px; }

            /* колонка текста: было 20 символов в строке, стало ~40 */
            #story-text { font-size: 17px; line-height: 1.55; margin-bottom: 22px; }
            .msg { gap: 8px; margin-bottom: 18px; }
            .msg-icon { flex-basis: 24px; width: 24px; height: 24px; font-size: 11px; }
            .msg-user .msg-body { padding-left: 9px; }

            /* Строка состояния занимала шестую часть экрана до первого слова прозы,
               и она растёт по мере накопления ран и вещей. На телефоне сворачиваем
               до двух строк, разворот по нажатию. */
            #state-panel { font-size: 11.5px; line-height: 1.45; padding: 8px; cursor: pointer; }
            #state-panel.collapsed {
                /* ровно две строки плюс отступы: line-clamp резал третью пополам */
                max-height: calc(2 * 1.45em + 16px);
                overflow: hidden;
                position: relative;
            }
            #state-panel.collapsed::after {
                content: '';
                position: absolute;
                left: 0; right: 0; bottom: 0; height: 14px;
                background: linear-gradient(transparent, #0f0f0f);
            }
            #tokens-bar {
                margin: 14px -14px -16px;
                font-size: 10px;
                justify-content: flex-start;
                gap: 4px 12px;
                padding: 6px 8px;
            }

            /* пальцем в иконку 30px не попасть */
            .msg-actions { gap: 2px; margin-top: 14px; }
            .icon-btn { padding: 11px 12px; }
            .swipe-count { min-width: 44px; }

            .choice-btn { font-size: 15px; padding: 11px; }
            #custom-action-container { gap: 8px; }
            #custom-action-container button { padding: 10px 14px; white-space: nowrap; }

            /* температура и токены не помещались в один ряд */
            .settings-row { flex-direction: column; gap: 0; }
            .newgame-row { flex-wrap: wrap; }
            .saves-panel { gap: 6px; }
            .saves-panel button { font-size: 13px; padding: 10px 6px; }
        }
        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #2a2a2a;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            padding: 12px;
            font-family: inherit;
            font-size: 16px;
        }
        .choice-btn:hover {
            background: #333;
            border-color: var(--accent);
        }
        #custom-action-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        #custom-action-container input {
            margin: 0;
        }
        #state-panel {
            font-family: monospace;
            font-size: 14px;
            background: #0f0f0f;
            padding: 10px;
            margin-bottom: 5px;
            border-left: 3px solid var(--accent);
            color: #aaa;
        }
        #tokens-bar {
            position: sticky;
            bottom: 0;
            z-index: 20;
            font-size: 11px;
            color: #7a7a7a;
            font-family: sans-serif;
            background: rgba(18,18,18,0.94);
            border-top: 1px solid var(--border);
            padding: 7px 10px;
            margin: 14px -30px -30px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        #tokens-bar b { color: #a9a9a9; font-weight: normal; }
        #tokens-bar .warn { color: #b06a6a; }
        .char-field { margin-bottom: 12px; }
        .char-field label { display: block; font-size: 12px; color: #888; margin-bottom: 2px; }
        .char-field input { margin: 0; }
        .ev-row {
            display: flex; gap: 8px; align-items: flex-start;
            border-bottom: 1px solid #262626; padding: 7px 0;
        }
        .ev-row textarea {
            margin: 0; font-size: 13px; min-height: 46px; resize: vertical;
            font-family: sans-serif;
        }
        .ev-meta { font-size: 11px; color: #777; white-space: nowrap; padding-top: 9px; min-width: 74px; }
        .ev-del { background: #3a2020; padding: 6px 10px; margin: 0; align-self: center; }
        .pick-toggles { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 0 2px; font-size: 12px; color: #999; }
        .pick-toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .pick-toggles input { margin: 0; }
        .loader {
            display: none;
            font-style: italic;
            color: #888;
            margin: 20px 0;
        }
        .loader.error {
            font-style: normal;
            color: #d98a8a;
            border-left: 3px solid #7a2222;
            padding-left: 10px;
            white-space: pre-wrap;
        }
        .settings-row {
            display: flex;
            gap: 15px;
        }
        .settings-row > div {
            flex: 1;
        }
        .model-filter { margin-bottom: 5px !important; }
        .game-controls { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
    <!-- Оформление под проект «Кордим» (wiki/app): те же цвета, шрифты и карточки. Логика игры не тронута. -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Geologica:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1716; --panel-bg: #221e1c; --raise: #2c2724; --border: #3a3431;
            --text: #ece5dc; --mute: #9d938a;
            --accent: #d9a441; --accent-hover: #e6b55a;
            --dusk: #8ea7d6; --ember: #d46a4a; --sage: #9bb383;
            --disp: 'Unbounded', system-ui, sans-serif; --body: 'Geologica', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
            --ease: cubic-bezier(.2,.8,.2,1);
        }
        body {
            font: 300 16px/1.6 var(--body);
            padding: 28px 20px 40px;
            background: radial-gradient(1100px 520px at 50% -12%, rgba(217,164,65,.09), transparent 60%), var(--bg);
            min-height: 100vh; box-sizing: border-box;
        }
        .container { max-width: 880px; }
        .screen {
            background: linear-gradient(180deg, #25201e, var(--panel-bg) 180px);
            border: 1px solid var(--border); border-radius: 22px;
            padding: 30px 34px; box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }
        .screen.active { animation: kin .45s var(--ease); }
        @keyframes kin { from { opacity: 0; transform: translateY(10px); } }
        h1 {
            font: 900 clamp(30px, 5vw, 48px)/1 var(--disp); letter-spacing: -.02em;
            border: 0; padding: 0; margin: 0 0 24px;
        }
        h1::before {
            content: "КОРДИМ · ХРОНИКИ"; display: block;
            font: 400 11px var(--mono); letter-spacing: .14em; color: var(--mute); margin-bottom: 10px;
        }
        h2 {
            font: 700 12px var(--disp); letter-spacing: .14em; text-transform: uppercase;
            color: var(--mute); border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }
        label { font-size: 14px; color: #d6cec4; }
        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            background: var(--raise); border: 1px solid var(--border); border-radius: 10px;
            font: 400 15px var(--body); color: var(--text); transition: border-color .2s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        input[type="range"], input[type="checkbox"] { accent-color: var(--accent); }
        button {
            background: var(--accent); color: #1a1510; font: 500 14px var(--body);
            border-radius: 10px; padding: 10px 18px; transition: background .2s, border-color .2s, transform .2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #3a3431; color: #7a716a; }
        .btn-gray { background: var(--raise); color: var(--text); border: 1px solid var(--border); }
        .btn-gray:hover { background: #352f2b; border-color: var(--accent); }
        .btn-green { background: rgba(155,179,131,.12); color: #d6e4c7; border: 1px solid rgba(155,179,131,.38); }
        .btn-green:hover { background: rgba(155,179,131,.22); }
        .slot-active { outline: 2px solid var(--accent); outline-offset: 2px; }
        #story-text { font: 300 19px/1.72 var(--body); }
        .msg-icon { font: 700 12px var(--disp); }
        .msg-ai .msg-icon { background: var(--accent); color: #1a1510; }
        .msg-user .msg-icon { background: var(--raise); color: var(--dusk); }
        .msg-user .msg-body { color: var(--dusk); border-left-color: var(--dusk); font-style: normal; }
        .icon-btn { background: transparent; color: var(--mute); }
        .icon-btn:hover { background: var(--raise); color: var(--text); }
        .actions-sep { background: var(--border); }
        .archive-note, .swipe-count { font-family: var(--mono); color: var(--mute); border-color: var(--border); }
        .choice-btn {
            background: var(--raise); border: 1px solid var(--border); border-radius: 14px;
            color: var(--text); font: 400 16px/1.45 var(--body); padding: 13px 16px;
        }
        .choice-btn:hover { background: #342e2a; border-color: var(--accent); transform: translateX(4px); }
        #custom-action-container input { border-radius: 10px; }
        #state-panel {
            font: 400 13px/1.6 var(--mono); background: var(--raise); color: #d6cec4;
            border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; padding: 10px 14px;
        }
        #tokens-bar {
            font: 400 11px var(--mono); color: var(--mute);
            background: rgba(26,23,22,.95); border-top: 1px solid var(--border);
            border-radius: 0 0 22px 22px; margin: 16px -34px -30px; padding: 8px 16px;
        }
        #tokens-bar b { color: #cfc7bd; }
        .loader { color: var(--mute); }
        .loader.error { color: #eeac98; border-left-color: var(--ember); }
        .picker { background: #1e1a18; border-color: var(--border); border-radius: 12px; overflow: hidden; }
        .pick-head { border-color: var(--border); }
        .chip { background: var(--raise); border-color: var(--border); border-radius: 99px; color: #cfc7bd; font: 400 12px var(--body); }
        .chip.on { background: var(--accent); color: #1a1510; border-color: var(--accent); }
        .model-row { font: 400 13px var(--body); border-color: #2c2724; }
        .model-row:hover { background: var(--raise); }
        .model-row.free b { color: var(--sage); }
        .char-field label, .ev-meta { font-family: var(--mono); color: var(--mute); }
        .ev-row { border-color: var(--border); }
        .ev-del { background: rgba(212,106,74,.16); color: #eeac98; border: 1px solid rgba(212,106,74,.4); }
        .ev-del:hover { background: rgba(212,106,74,.28); }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .screen { padding: 18px 16px; border-radius: 16px; }
            #tokens-bar { margin: 14px -16px -18px; border-radius: 0 0 16px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-setup" class="screen active">
        <h1>Меню</h1>
        
        <button class="btn-gray" id="btn-resume" style="display:none; margin-bottom:15px;" onclick="switchScreen('screen-game')">&larr; Вернуться к игре</button>

        <div class="saves-panel" id="saves-panel">
            <div class="slot-cell">
                <button class="btn-green" id="slot-btn-1" onclick="slotClick(1)">Слот 1</button>
                <button class="btn-gray slot-reset" id="slot-reset-1" onclick="startNewGameProcess(1)" title="Начать в этом слоте заново">&#8635;</button>
            </div>
            <div class="slot-cell">
                <button class="btn-green" id="slot-btn-2" onclick="slotClick(2)">Слот 2</button>
                <button class="btn-gray slot-reset" id="slot-reset-2" onclick="startNewGameProcess(2)" title="Начать в этом слоте заново">&#8635;</button>
            </div>
            <div class="slot-cell">
                <button class="btn-green" id="slot-btn-3" onclick="slotClick(3)">Слот 3</button>
                <button class="btn-gray slot-reset" id="slot-reset-3" onclick="startNewGameProcess(3)" title="Начать в этом слоте заново">&#8635;</button>
            </div>
        </div>
        <div class="saves-panel">
            <button class="btn-gray" onclick="exportSave()">Экспорт в файл</button>
            <button class="btn-gray" onclick="document.getElementById('import-file').click()">Импорт из файла</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importSave(event)">
        </div>
        <label style="display:block; margin: -10px 0 20px; font-size: 14px; color: #999;">
            <input type="checkbox" id="export-with-key"> Класть в файл ключ и настройки — для переноса на другое устройство
        </label>

        <label>API Ключ (OpenRouter):</label>
        <input type="password" id="api-key" placeholder="sk-or-v1-...">
        
        <label>Основная модель:</label>
        <div class="model-field">
            <input type="text" id="model-main" placeholder="напр. anthropic/claude-sonnet-4.5">
            <button type="button" class="btn-gray" onclick="openPicker('main')">Выбрать</button>
        </div>
        <div class="picker" id="picker-main"></div>

        <label>Модель для хроники (сжатие):</label>
        <div class="model-field">
            <input type="text" id="model-summary" placeholder="напр. google/gemini-flash-1.5-8b">
            <button type="button" class="btn-gray" onclick="openPicker('summary')">Выбрать</button>
        </div>
        <div class="picker" id="picker-summary"></div>
        
        <div class="settings-row">
            <div>
                <label>Температура (<span id="temp-val">0.7</span>):</label>
                <input type="range" id="setting-temp" min="0" max="2" step="0.1" value="0.7">
            </div>
            <div>
                <label>Макс. токенов:</label>
                <input type="number" id="setting-tokens" value="2000">
            </div>
        </div>
        
        <label style="display: block; margin-bottom: 20px;">
            <input type="checkbox" id="setting-cache"> Кэшировать кор (только модели anthropic/*)
            <span style="display:block;font-size:11px;color:#777;margin-left:26px;">Запись в кэш стоит 1.25x, чтение 0.1x: первый ход дороже, дальше кор почти бесплатный. У остальных провайдеров кэш работает сам, галка им не нужна и может вызвать ошибку.</span>
        </label>
        
    </div>

    <div id="screen-char-gen" class="screen">
        <div class="back-row">
            <button class="btn-gray" onclick="switchScreen('screen-setup')">&larr; В меню</button>
        </div>
        <h1>Создание персонажа</h1>
        <label>Пол персонажа:</label>
        <select id="char-gender">
            <option value="мужской">мужской</option>
            <option value="женский">женский</option>
        </select>
        
        <label>Возраст:</label>
        <input type="number" id="char-age" placeholder="25" min="15" max="70">

        <label>Где начинаем:</label>
        <select id="char-location">
            <option value="">Случайно</option>
        </select>
        
        <button id="btn-generate">Сгенерировать варианты</button>
        <div id="char-loader" class="loader">Судьба плетёт нити...</div>
        
        <div id="char-options" style="margin-top: 20px;"></div>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-controls">
            <button class="btn-gray" onclick="switchScreen('screen-setup')">&larr; В меню</button>
            <button class="btn-gray" onclick="openCharacterScreen()">Персонаж</button>
        </div>
        <div id="state-panel"></div>
        
        <div id="story-text"></div>
        <div id="choices-container"></div>

В прозе называй деньги так, как их назвал бы персонаж: «три медяка», «полторы марки», «семьдесят кордов». Не пиши «монеты» и «золото» абстрактно.

Мир материален. Запах мокрой шерсти, кислого пота и ржавчины. Тактильный вес грязи, холодной стали, дождя. Сырость, которая оседает на коже за час. Скрип мокрой кожи. Каждая сцена должна иметь минимум одну конкретную физическую деталь, которую можно понюхать, потрогать или услышать.

# ФИЗИКА БОЯ

Гиперреализм. Никаких уворотов от арбалетного болта после выстрела. Сталь не прорубает сталь: мечом латы не разрубить. Броня держит порез, но пропускает кинетику — тупой удар ломает кости и вызывает сотрясение. Болт нельзя отбить клинком и нельзя выдернуть из раны в бою: зазубрины рвут ткань и открывают кровотечение. Перезарядка тяжёлого арбалета — десять-пятнадцать секунд, и это вечность. Яды и паралитики не действуют мгновенно, им нужно двадцать-тридцать секунд, и цель теряет координацию постепенно. Усталость копится быстро: после минуты полного напряжения руки тяжелеют, дыхание рвётся.

Бой — это биомеханика и анатомия, а не героика. Драка длится секунды, а не минуты. Побеждает тот, кто напал первым, из выгодной позиции и с подготовкой. Численное преимущество почти всегда решает. Герой, выходящий один против пятерых, умирает.

Заражение приходит на вторую ночь: жар и розовая полоса от раны к ближайшему суставу. Лечится временем, а не лечением; на четвёртое утро либо полоса встала, либо всё.
