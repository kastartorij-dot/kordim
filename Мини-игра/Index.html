        if (savedCache !== null) document.getElementById('setting-cache').checked = (savedCache === 'true');

        document.getElementById('model-main').value = ls('or_model') || DEFAULT_MODEL;
        document.getElementById('model-summary').value = ls('or_model_sum') || DEFAULT_MODEL;
        
        document.getElementById('setting-temp').addEventListener('input', (e) => {
            document.getElementById('temp-val').textContent = e.target.value;
        });

        const locSelect = document.getElementById('char-location');
        START_LOCATIONS.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.textContent = loc;
            locSelect.appendChild(opt);
        });

        const statePanel = document.getElementById('state-panel');
        statePanel.classList.add('collapsed');
        statePanel.title = 'Нажмите, чтобы свернуть или развернуть';
        statePanel.addEventListener('click', () => statePanel.classList.toggle('collapsed'));

        loadModels();
        checkSavesUI();
        
        document.getElementById('btn-generate').addEventListener('click', generateCharacters);
        document.getElementById('btn-custom-action').addEventListener('click', () => submitCustomAction());
        document.getElementById('custom-action').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitCustomAction();
        });
    });

    /* === УТИЛИТЫ === */
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    let lastTurn = { prompt: 0, completion: 0, cached: 0 };
    let sessionCost = 0;
    let cacheEverReported = false;

    function kfmt(n) {
        return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(n);
    }

    /* Диагностика кэша: у части провайдеров cached_tokens не приходит вовсе,
       и ноль в полосе означает не промах, а молчание. Сырой usage кладём
       в консоль, чтобы можно было отличить одно от другого. */
    function updateTokenDisplay(usage, modelId) {
        if (usage) {
            console.log('[usage]', modelId || currentModel, JSON.stringify(usage));
            const pt = usage.prompt_tokens || 0;
            const ct = usage.completion_tokens || 0;
            const cached = (usage.prompt_tokens_details && usage.prompt_tokens_details.cached_tokens) || 0;
            if (usage.prompt_tokens_details && usage.prompt_tokens_details.cached_tokens !== undefined) {
                cacheEverReported = true;
            }
            sessionTokens.prompt += pt;
            sessionTokens.completion += ct;
            sessionTokens.cached += cached;
            lastTurn = { prompt: pt, completion: ct, cached: cached };

            const m = allModelsData.find(x => x.id === (modelId || currentModel));
            if (m && !m.vary) {
                sessionCost += (pt / 1e6) * m.inp + (ct / 1e6) * m.out;
            }
        }
        const el = (id) => document.getElementById(id);
        if (!el('tok-turn')) return;
        el('tok-turn').innerHTML = `ход: <b>${kfmt(lastTurn.prompt)}</b> / ${kfmt(lastTurn.completion)}`;
        el('tok-total').innerHTML = `сессия: <b>${kfmt(sessionTokens.prompt)}</b> / ${kfmt(sessionTokens.completion)}`;
        el('tok-cost').innerHTML = sessionCost > 0 ? `~<b>$${sessionCost.toFixed(4)}</b>` : '~$0.0000';
        const c = el('tok-cache');
        if (!cacheEverReported) {
            c.textContent = 'кэш: не сообщает';
            c.className = '';
        } else {
            c.textContent = 'кэш: ' + kfmt(sessionTokens.cached);
            c.className = sessionTokens.cached === 0 ? 'warn' : '';
        }
    }

    /* === НАСТРОЙКИ И СОХРАНЕНИЯ === */
    function applySettings() {
        apiKey = document.getElementById('api-key').value.trim();
        temperature = parseFloat(document.getElementById('setting-temp').value);
        maxTokens = parseInt(document.getElementById('setting-tokens').value);
        currentModel = document.getElementById('model-main').value.trim() || DEFAULT_MODEL;
        summaryModel = document.getElementById('model-summary').value.trim() || currentModel;
        useCache = document.getElementById('setting-cache').checked;

        if (apiKey) {
            /* Через lsSet: в приватном режиме обращение к localStorage бросает
               исключение, и раньше оно валило и импорт, и запуск новой игры. */
            lsSet('or_key', apiKey);
            lsSet('or_temp', temperature);
            lsSet('or_tokens', maxTokens);
            lsSet('or_model', currentModel);
            lsSet('or_model_sum', summaryModel);
            lsSet('or_cache', useCache);
        }
    }

    /* Вес решает, что доживёт до конца партии, а ставит его модель — и слабая
       модель поле пропускает. Раньше событие без веса не проходило ни в ветку
       weight >= 4, ни в weight <= 3 и исчезало из массива навсегда. */
    function eventWeight(e) {
        const raw = e ? e.weight : undefined;
        // Пропущенный вес — это «неизвестно», то есть середина, а не «удалить первым».
        if (raw === null || raw === undefined || raw === '') return 3;
        const w = Number(raw);
        return Number.isFinite(w) ? Math.min(5, Math.max(1, w)) : 3;
    }

    function cleanEvents() {
        if (events.length <= 200) return;
        const currentDay = gameState.day || 1;

        // 1. Очистка по возрасту и низкому весу
        events = events.filter(e => !(eventWeight(e) <= 2 && Number(e.day) < currentDay - 30));

        // 2. Если всё ещё больше 200 — режем самые старые из тех, что не жалко
        if (events.length > 200) {
            const byDay = (a, b) => (Number(a.day) || 0) - (Number(b.day) || 0);
            const safeEvents = events.filter(e => eventWeight(e) >= 4);
            const removableEvents = events.filter(e => eventWeight(e) < 4).sort(byDay);

            const neededRemovals = Math.min(removableEvents.length, events.length - 200);
            removableEvents.splice(0, neededRemovals);

            events = [...safeEvents, ...removableEvents].sort(byDay);
        }
    }

    function saveGame() {
        cleanEvents();
        const saveObj = { sessionId, character, gameState, chatHistory, events, archivedTurns, currentModel, summaryModel };
        let serialized = JSON.stringify(saveObj);

        try {
            localStorage.setItem(`kordim_save_${activeSlot}`, serialized);
            checkSavesUI();
        } catch (e) {
            // Если упали по квоте - чистим историю свайпов до выбранных вариантов
            console.warn("Ошибка сохранения (квота?), очистка свайпов...", e);
            chatHistory.forEach(msg => {
                if (msg.swipes && msg.swipes.length > 1) {
                    msg.swipes = [msg.content];
                    msg.swipeIndex = 0;
                }
            });
            saveObj.chatHistory = chatHistory;
            serialized = JSON.stringify(saveObj);

            try {
                localStorage.setItem(`kordim_save_${activeSlot}`, serialized);
                checkSavesUI();
            } catch (e2) {
                console.error("Повторная ошибка сохранения", e2);
                alert("Сейв превышает квоту хранилища браузера. Пожалуйста, экспортируйте данные в файл (Кнопка 'Экспорт в файл' в меню).");
            }
        }
    }

    function loadGame(slot) {
        const savedData = lsGet(`kordim_save_${slot}`);
        if (!savedData) return alert("Слот пуст");
        
        try {
            const parsed = JSON.parse(savedData);
            activeSlot = slot;
            
            sessionId = parsed.sessionId || generateUUID();
            character = parsed.character || character;
            gameState = parsed.gameState || gameState;
            chatHistory = parsed.chatHistory || [];
            events = parsed.events || [];
            archivedTurns = parsed.archivedTurns || 0;
            
            if (parsed.currentModel) document.getElementById('model-main').value = parsed.currentModel;
            if (parsed.summaryModel) document.getElementById('model-summary').value = parsed.summaryModel;
            
            applySettings();
            
            stateSnapshots = [];
            if (!apiKey) return alert('Введите ключ API перед загрузкой');
            
            gameStarted = true;
            checkSavesUI();
            renderGameUI();
        } catch (e) {
            console.error("Ошибка загрузки:", e);
            alert("Файл сохранения поврежден");
        }
    }

    /* Пустой слот начинает новую игру прямо здесь, занятый — загружает.
       Перезапись занятого слота живёт на отдельной кнопке со стрелкой. */
    function slotClick(slot) {
        if (lsGet(`kordim_save_${slot}`)) loadGame(slot);
        else startNewGameProcess(slot);
    }

    function startNewGameProcess(slot) {
        slot = parseInt(slot, 10) || 1;
        if (lsGet(`kordim_save_${slot}`) &&
            !confirm(`В слоте ${slot} уже есть сохранение. Оно будет затёрто первым же ходом. Продолжить?`)) return;

        activeSlot = slot;
        applySettings();
        if (!apiKey) { alert('Нужен ключ API'); return; }
        
        gameStarted = false;
        checkSavesUI();
        sessionId = generateUUID();
        character = { name: "", gender: "", age: "", origin: "", trade: "", flaw: "" };
        gameState = { location: "", money: 0, wounds: [], inventory: [], date: "1 День Месяца Пепла, 1026 год", day: 1 };
        chatHistory = [];
        events = [];
        archivedTurns = 0;
        stateSnapshots = [];
        sessionTokens = { prompt: 0, completion: 0, cached: 0 };
        
        switchScreen('screen-char-gen');
    }

    function checkSavesUI() {
        for (let i = 1; i <= 3; i++) {
            const hasSave = !!lsGet(`kordim_save_${i}`);
            const btn = document.getElementById(`slot-btn-${i}`);
            if (!btn) continue;
            const isActive = gameStarted && i === activeSlot;

            btn.textContent = isActive ? `Слот ${i} · идёт игра`
                            : hasSave  ? `Слот ${i} · Загрузить`
                                       : `Слот ${i} · Новая игра`;
            btn.classList.toggle('slot-active', isActive);
            btn.classList.toggle('btn-green', hasSave || isActive);
            btn.classList.toggle('btn-gray', !hasSave && !isActive);
            btn.disabled = false;   // пустой слот — тоже действие, а не тупик

            const reset = document.getElementById(`slot-reset-${i}`);
            if (reset) reset.style.display = hasSave ? '' : 'none';
        }
        const resume = document.getElementById('btn-resume');
        if (resume) resume.style.display = gameStarted ? 'block' : 'none';
    }

    /* Формат файла переноса:
       { kordim: 1, settings: {...}, save: {...} }
       Старые файлы — это сразу объект сохранения без обёртки, импорт их понимает.
       Ключ попадает в файл только по явной галочке и лежит там открытым текстом:
       если файл куда-то денется, ключ надо удалить в панели OpenRouter. */
    function exportSave() {
        const withKey = document.getElementById('export-with-key').checked;
        const savedData = lsGet(`kordim_save_${activeSlot}`);

        if (!savedData && !withKey) return alert("Нет данных для экспорта");

        const bundle = { kordim: 1 };

        if (savedData) {
            try { bundle.save = JSON.parse(savedData); }
            catch (e) { return alert("Сохранение в этом слоте повреждено"); }
        }

        if (withKey) {
            applySettings();
            if (!apiKey) return alert("Ключ не введён — переносить нечего");
            bundle.settings = {
                apiKey: apiKey,
                model: currentModel,
                summaryModel: summaryModel,
                temperature: temperature,
                maxTokens: maxTokens,
                useCache: useCache
            };
        }

        const blob = new Blob([JSON.stringify(bundle)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = withKey ? "kordim_transfer.json" : `kordim_save_slot${activeSlot}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importSave(event) {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = '';   // иначе повторный выбор того же файла не сработает

        const reader = new FileReader();
        reader.onload = (e) => {
            let data;
            try { data = JSON.parse(e.target.result); }
            catch (err) { return alert("Файл повреждён или это не файл игры"); }

            const isBundle = data && data.kordim;
            const settings = isBundle ? data.settings : null;
            const save = isBundle ? data.save : data;

            if (settings) {
                if (settings.apiKey) document.getElementById('api-key').value = settings.apiKey;
                if (settings.model) document.getElementById('model-main').value = settings.model;
                if (settings.summaryModel) document.getElementById('model-summary').value = settings.summaryModel;
                if (settings.temperature !== undefined) {
                    document.getElementById('setting-temp').value = settings.temperature;
                    document.getElementById('temp-val').textContent = settings.temperature;
                }
                if (settings.maxTokens) document.getElementById('setting-tokens').value = settings.maxTokens;
                if (settings.useCache !== undefined) document.getElementById('setting-cache').checked = !!settings.useCache;
                applySettings();   // осядет в localStorage этого устройства
            }

            if (save && save.chatHistory) {
                try {
                    localStorage.setItem(`kordim_save_${activeSlot}`, JSON.stringify(save));
                } catch (err) {
                    return alert("Не хватило места в хранилище браузера для этого сохранения");
                }
                loadGame(activeSlot);
                return;
            }

            checkSavesUI();
            alert(settings
                ? "Ключ и настройки перенесены. Сохранения в файле не было."
                : "В файле нет ни настроек, ни сохранения");
        };
        reader.readAsText(file);
    }

    /* === МОДЕЛИ === */
    const MODEL_FAMS = [
        ["Все", null],
        ["Бесплатные", "#free"],
        ["Google", "google/"],
        ["OpenAI", "openai/"],
        ["Anthropic", "anthropic/"],
        ["DeepSeek", "deepseek/"],
        ["xAI", "x-ai/"],
        ["Qwen", "qwen/"],
        ["Meta", "meta"],
        ["Mistral", "mistralai/"],
        ["Z.AI", "z-ai/"],
        ["Moonshot", "moonshotai/"]
    ];

    async function loadModels() {
        try {
            const res = await fetch('https://openrouter.ai/api/v1/models');
            const data = await res.json();
            allModelsData = (data.data || []).map(m => {
                const pr = m.pricing || {};
                const inp = Number(pr.prompt) * 1e6;
                const out = Number(pr.completion) * 1e6;
                const bad = !isFinite(inp) || !isFinite(out) || inp < 0 || out < 0;
                const sp = m.supported_parameters || [];
                return {
                    id: m.id, name: m.name || m.id, inp, out, vary: bad,
                    free: !bad && inp === 0 && out === 0,
                    /* is_moderated — единственный машиночитаемый признак внешнего
                       модерационного слоя в API OpenRouter. Отсутствие поля
                       трактуем как «неизвестно», а не как «нет модерации». */
                    moderated: !!(m.top_provider && m.top_provider.is_moderated),
                    modKnown: !!(m.top_provider && m.top_provider.is_moderated !== undefined),
                    stream: sp.length ? sp.indexOf('stream') !== -1 : null,
                    ctx: m.context_length || 0
                };
            }).sort((a, b) => a.id.localeCompare(b.id));
            ensureLiveModels();
        } catch (e) {
            console.error("Ошибка загрузки моделей:", e);
        }
    }

    function pickLiveModel() {
        for (const pref of MODEL_FALLBACKS) {
            const hit = allModelsData.find(m => pref.endsWith('/') ? m.id.startsWith(pref) : m.id === pref);
            if (hit) return hit.id;
        }
        return allModelsData.length ? allModelsData[0].id : DEFAULT_MODEL;
    }

    /* Модель, записанная в настройках или в сейве, могла быть снята с
       обслуживания. Молча подменяем на живую, иначе первый же запрос падает. */
    function ensureLiveModels() {
        if (!allModelsData.length) return;
        const alive = (id) => allModelsData.some(m => m.id === id);
        ['model-main', 'model-summary'].forEach(fieldId => {
            const el = document.getElementById(fieldId);
            if (!el) return;
            const val = el.value.trim();
            if (val && !alive(val)) {
                const good = pickLiveModel();
                console.warn(`Модель ${val} недоступна, подменяю на ${good}`);
                el.value = good;
            }
        });
    }

    function priceLabel(m) {
        if (m.vary) return "цена плавающая";
        if (m.free) return "бесплатно";
        return "$" + m.inp.toFixed(2) + " / $" + m.out.toFixed(2);
    }

    function openPicker(type) {
        const box = document.getElementById(`picker-${type}`);
        const input = document.getElementById(`model-${type}`);

        if (box.classList.contains('on')) { box.classList.remove('on'); return; }
        if (!allModelsData.length) { alert("Список моделей ещё не загрузился. Попробуйте через пару секунд."); return; }

        box.innerHTML = '';
        const head = document.createElement('div'); head.className = 'pick-head';
        const search = document.createElement('input');
        search.type = 'text'; search.className = 'pick-search';
        search.placeholder = 'Поиск: имя модели или производитель';
        const chips = document.createElement('div'); chips.className = 'pick-chips';
        const toggles = document.createElement('div'); toggles.className = 'pick-toggles';
        const rows = document.createElement('div'); rows.className = 'pick-rows';

        const mkToggle = (labelText, lsKey, title) => {
            const lab = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = lsGet(lsKey) === 'true';
            lab.title = title;
            lab.appendChild(cb);
            lab.appendChild(document.createTextNode(labelText));
            toggles.appendChild(lab);
            cb.addEventListener('change', () => { lsSet(lsKey, cb.checked); draw(); rows.scrollTop = 0; });
            return cb;
        };
        const cbUnmod = mkToggle('без фильтра запроса', 'pick_unmod',
            'Скрывает модели, перед которыми стоит отдельный классификатор, заворачивающий запрос с ошибкой 403 до отправки в модель (top_provider.is_moderated). Это НЕ про то, что модель согласится писать что угодно: собственные правила модели остаются при ней.');
        const cbStream = mkToggle('со стримингом', 'pick_stream',
            'Только модели, у которых в supported_parameters заявлен stream.');
        const cbCtx = mkToggle('контекст от 32k', 'pick_ctx',
            'Отсекает короткие окна, в которые кор с лорбуком не влезут.');

        head.appendChild(search); head.appendChild(chips); head.appendChild(toggles);
        box.appendChild(head); box.appendChild(rows);

        const fams = MODEL_FAMS.filter(([, key]) =>
            key === null || key === "#free" ? true : allModelsData.some(m => m.id.startsWith(key)));
        let fam = null;

        function draw() {
            const q = search.value.trim().toLowerCase();
            const shown = allModelsData.filter(m => {
                if (fam === "#free" && !m.free) return false;
                if (fam && fam !== "#free" && !m.id.startsWith(fam)) return false;
                if (cbUnmod.checked && m.moderated) return false;
                if (cbStream.checked && m.stream === false) return false;
                if (cbCtx.checked && m.ctx && m.ctx < 32000) return false;
                if (!q) return true;
                return m.id.toLowerCase().includes(q) || m.name.toLowerCase().includes(q);
            });
            rows.innerHTML = '';
            if (!shown.length) {
                const none = document.createElement('div');
                none.className = 'pick-none';
                none.textContent = 'Ничего не нашлось';
                rows.appendChild(none);
                return;
            }
            shown.slice(0, 300).forEach(m => {
                const row = document.createElement('div');
                row.className = 'model-row' + (m.free ? ' free' : '');
                const b = document.createElement('b'); b.textContent = m.id;
                const pr = document.createElement('span'); pr.textContent = priceLabel(m);
                row.appendChild(b); row.appendChild(pr);
                row.addEventListener('click', () => {
                    input.value = m.id;
                    box.classList.remove('on');
                });
                rows.appendChild(row);
            });
            if (shown.length > 300) {
                const more = document.createElement('div');
                more.className = 'pick-none';
                more.textContent = `…и ещё ${shown.length - 300}. Уточните поиск.`;
                rows.appendChild(more);
            }
        }

        fams.forEach(([name, key]) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'chip' + (key === null ? ' on' : '');
            b.textContent = name;
            b.addEventListener('click', () => {
                fam = key;
                Array.from(chips.children).forEach(x => x.classList.toggle('on', x === b));
                draw(); rows.scrollTop = 0;
            });
            chips.appendChild(b);
        });

        search.addEventListener('input', () => { draw(); rows.scrollTop = 0; });
        search.value = '';
        draw();
        box.classList.add('on');
        setTimeout(() => search.focus({ preventScroll: true }), 30);
    }

    /* === КОНТЕКСТ === */
    function buildSystemBlock(text, cacheable, model) {
        if (cacheable && useCache && model.startsWith('anthropic/')) {
            return { role: "system", content: [{ type: "text", text: text, cache_control: { type: "ephemeral" } }] };
        }
        return { role: "system", content: text };
    }

    /* Отбор записей лорбука.

       Порядок важен: сначала то, что реально прозвучало в игре, и только потом
       то, что подтянулось рекурсией по текстам уже сработавших записей. Иначе
       одна большая справочная запись, перечисляющая названия городов, выбирает
       весь бюджет и вытесняет локацию, в которой игрок сейчас стоит. */
    function getLorebookContext(history) {
        const trigger = new Map();   // id -> 'direct' | 'recursive'
        let combinedScanText = "";

        const matches = (entry, text) => entry.keys.some(key =>
            new RegExp(`(^|[^\\p{L}])${escapeRegExp(key)}`, 'iu').test(text));

        const take = (entry, kind) => {
            trigger.set(entry.id, kind);
            if (entry.recursive) combinedScanText += " " + entry.text;
        };

        LOREBOOK.forEach(entry => { if (entry.constant) take(entry, 'direct'); });

        // Круг первый — по тому, что игрок и рассказчик действительно сказали.
        LOREBOOK.forEach(entry => {
            if (trigger.has(entry.id)) return;
            const scanTarget = history.slice(-entry.scanDepth).map(m => m.content).join(" ");
            if (matches(entry, scanTarget)) take(entry, 'direct');
        });

        // Дальше — рекурсия по текстам сработавших записей, до двух кругов.
        let addedThisPass = true;
        let depth = 1;
        while (addedThisPass && depth < 3) {
            addedThisPass = false;
            depth++;
            LOREBOOK.forEach(entry => {
                if (trigger.has(entry.id)) return;
                if (matches(entry, combinedScanText)) { take(entry, 'recursive'); addedThisPass = true; }
            });
        }

        const clip = (e) => e.text.substring(0, e.maxChars || e.text.length);
        const byOrder = (a, b) => a.order - b.order;
        const pick = (kind) => LOREBOOK.filter(e => trigger.get(e.id) === kind).sort(byOrder);

        // Бюджет распределяется по приоритету, а выводится в порядке order.
        const chosen = [];
        let totalChars = 0;
        let recursiveChars = 0;
        const recursiveCap = LOREBOOK_BUDGET * RECURSIVE_SHARE;
        for (const entry of pick('direct').concat(pick('recursive'))) {
            const text = clip(entry);
            const isRecursive = trigger.get(entry.id) === 'recursive';
            if (totalChars + text.length > LOREBOOK_BUDGET) continue;   // не break: мелкая запись ещё влезет
            if (isRecursive && recursiveChars + text.length > recursiveCap) continue;
            chosen.push(entry);
            totalChars += text.length;
            if (isRecursive) recursiveChars += text.length;
        }
        chosen.sort(byOrder);

        const injected = chosen.map(e => `[${e.title}]: ${clip(e)}`);
        return injected.length > 0 ? `СПРАВКА ПО МИРУ:\n${injected.join('\n')}` : "";
    }

    function getMemoryContext(recentHistory) {
        if (events.length === 0) return "";
        
        const scanText = recentHistory.slice(-4).map(m => m.content).join(" ");
        let candidateEvents = new Set();
        
        events.filter(e => e.weight >= 4).forEach(e => candidateEvents.add(e));
        events.slice(-10).forEach(e => candidateEvents.add(e));
        events.forEach(e => {
            if (Array.isArray(e.keys) && e.keys.some(key => new RegExp(`(^|[^\\p{L}])${escapeRegExp(key)}`, 'iu').test(scanText))) {
                candidateEvents.add(e);
            }
        });

        let arr = Array.from(candidateEvents).sort((a, b) => {
            if (b.weight !== a.weight) return b.weight - a.weight;
            return b.day - a.day; 
        });
        
        let pickedEvents = [];
        let currentLength = 0;
        
        for (let e of arr) {
            let line = `[День ${e.day}, ${e.where || '?'}] ${e.what} (${(e.who || []).join(', ')})`;
            if (currentLength + line.length > 3000) break;
            pickedEvents.push(e);
            currentLength += line.length + 1;
        }
        
        pickedEvents.sort((a, b) => a.day - b.day);
        let memoryText = pickedEvents.map(e => `[День ${e.day}, ${e.where || '?'}] ${e.what} (${(e.who || []).join(', ')})`).join("\n");
        return memoryText ? `ПАМЯТЬ СОБЫТИЙ:\n${memoryText}` : "";
    }

    function parseResponse(text) {
        const extract = (tag) => {
            const regex = new RegExp(`<${tag}>([\\s\\S]*?)<\/${tag}>`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : null;
        };
        
        let stateDelta = {};
        let stateStr = extract('состояние');
        if (stateStr) {
            try {
                let temp = JSON.parse(stateStr);
                if (temp.money !== undefined) stateDelta.money = Number(temp.money) || 0;
                if (Array.isArray(temp.wounds)) stateDelta.wounds = temp.wounds.map(String);
                if (Array.isArray(temp.inventory)) stateDelta.inventory = temp.inventory.map(String);
                if (temp.location !== undefined) stateDelta.location = String(temp.location);
                if (temp.date !== undefined) stateDelta.date = String(temp.date);
                if (temp.day !== undefined) stateDelta.day = Number(temp.day) || gameState.day;
            } catch (e) {
                console.warn("Ошибка парсинга состояния:", e);
            }
        }

        /* Ответ, обрезанный по max_tokens, теряет закрывающие теги: раньше
           это давало сырой текст с видимым "<выборы>" и без кнопок. */
        let choicesStr = extract('выборы');
        if (choicesStr === null) {
            const open = text.search(/<выборы>/i);
            if (open !== -1) {
                choicesStr = text.slice(open + 8).split(/<состояние>/i)[0].trim();
            }
        }
        const choicesArr = choicesStr ? choicesStr.split('\n').filter(l => l.trim()).map(c => c.replace(/^\d+\.\s*/, '')) : [];

        return {
            text: (function () {
                let t = extract('текст');
                if (t === null) {
                    const open = text.search(/<текст>/i);
                    t = open !== -1 ? text.slice(open + 7) : text;
                    t = t.split(/<выборы>/i)[0].split(/<состояние>/i)[0];
                    t = t.replace(/<\/?(текст|выборы|состояние)>/gi, '').trim();
                }
                return t;
            })(),
            choicesArr: choicesArr,
            stateDelta: stateDelta
        };
    }

    /* === API ЗАПРОСЫ === */
    const REQUEST_TIMEOUT_MS = 90000;

    /* HTTP-Referer OpenRouter использует для статистики приложений. Когда игра
       открыта как локальный файл, туда уходит "file:///C:/..." — значение,
       которое сервер вправе не принять. На file:// заголовок просто не шлём. */
    function apiHeaders() {
        const headers = {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'X-Title': 'Kordim RPG'
        };
        if (/^https?:/i.test(window.location.href)) {
            headers['HTTP-Referer'] = window.location.href;
        }
        return headers;
    }

    /* Без таймаута зависший запрос вешал экран навсегда: кнопка заблокирована,
       лоадер крутится, сообщения нет. Теперь любой исход заканчивается текстом. */
    async function fetchWithTimeout(url, options, ms = REQUEST_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        const localFile = !/^https?:/i.test(window.location.href);
        try {
            return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
        } catch (e) {
            if (e.name === 'AbortError') {
                throw new Error(`Ответа нет ${Math.round(ms / 1000)} секунд. Проверьте связь.`
                    + (localFile ? ' Игра открыта как локальный файл — мобильные браузеры часто блокируют такие запросы к API.' : ''));
            }
            throw new Error(`Запрос не ушёл: ${e.message}.`
                + (localFile ? ' Игра открыта как локальный файл — скорее всего, браузер заблокировал обращение к API с адреса file://.' : ''));
        } finally {
            clearTimeout(timer);
        }
    }

    /* 403 у OpenRouter означает, что запрос завернул внешний классификатор
       и до модели он не доехал. Раньше это выглядело как невнятная ошибка
       без объяснения, что именно не понравилось. */
    function describeApiError(data, status, reqModel) {
        const err = (data && data.error) || null;
        const meta = err && err.metadata;
        if (status === 403 || (err && err.code === 403)) {
            let out = 'Запрос заблокирован фильтром до отправки в модель.';
            if (meta && Array.isArray(meta.reasons) && meta.reasons.length) {
                out += ' Причина: ' + meta.reasons.join(', ') + '.';
            }
            if (meta && meta.flagged_input) {
                out += ' Помечен фрагмент: «' + meta.flagged_input + '».';
            }
            out += ' Помогает переформулировать этот кусок или взять модель без предварительного фильтра.';
            return out + ` [модель: ${reqModel}]`;
        }
        if (status === 402) return `Кончились кредиты на OpenRouter. [модель: ${reqModel}]`;
        if (status === 429) return `Слишком часто, провайдер притормаживает. Подождите и повторите. [модель: ${reqModel}]`;
        if (status === 502) return `Провайдер модели сейчас недоступен. Попробуйте другую. [модель: ${reqModel}]`;
        if (status === 503) return `Нет провайдера, подходящего под запрос. Смените модель. [модель: ${reqModel}]`;
        const msg = err ? (err.message || JSON.stringify(err)) : `код ${status}`;
        return `${msg} [модель: ${reqModel}]`;
    }

    async function callOpenRouter(messages, modelOverride = null, tempOverride = null, tokensOverride = null) {
        const reqModel = modelOverride || currentModel;
        const reqTemp = tempOverride !== null ? tempOverride : temperature;
        const reqTokens = tokensOverride !== null ? tokensOverride : maxTokens;

        const response = await fetchWithTimeout('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: apiHeaders(),
            body: JSON.stringify({
                model: reqModel,
                messages: messages,
                temperature: reqTemp,
                max_tokens: reqTokens,
                session_id: sessionId
            })
        });

        let data;
        try { data = await response.json(); }
        catch (e) { throw new Error(`Сервер ответил не по формату (код ${response.status})`); }

        if (!response.ok || data.error) {
            throw new Error(describeApiError(data, response.status, reqModel));
        }
        const fr = data.choices && data.choices[0] && data.choices[0].finish_reason;
        if (fr === 'content_filter') {
            throw new Error(`Ответ обрезан фильтром содержимого на стороне провайдера. [модель: ${reqModel}]`);
        }
        return data;
    }

    async function callOpenRouterStream(messages, onChunk) {
        const response = await fetchWithTimeout('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: apiHeaders(),
            body: JSON.stringify({
                model: currentModel,
                messages: messages,
                temperature: temperature,
                max_tokens: maxTokens,
                session_id: sessionId,
                stream: true
            })
        });

        if (!response.ok) {
            let j = null;
            try { j = await response.json(); } catch (e) {}
            throw new Error(describeApiError(j, response.status, currentModel));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullText = "";
        let finalUsage = null;
        let streamFiltered = false;
        let streamError = null;
        let buffer = ""; 

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop(); 
            
            for (let line of lines) {
                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                    try {
                        const data = JSON.parse(line.slice(6));
                        if (data.choices && data.choices.length > 0 && data.choices[0].delta && data.choices[0].delta.content) {
                            fullText += data.choices[0].delta.content;
                            onChunk(fullText);
                        }
                        if (data.usage) finalUsage = data.usage;
                        /* Провайдер может оборвать генерацию на середине —
                           ошибка приходит отдельным SSE-событием. */
                        if (data.error) streamError = data.error;
                        const fr = data.choices && data.choices[0] && data.choices[0].finish_reason;
                        if (fr === 'content_filter') streamFiltered = true;
                    } catch (e) {}
                }
            }
        }
        if (streamError) {
            throw new Error(describeApiError({ error: streamError }, streamError.code || 0, currentModel));
        }
        if (streamFiltered && !fullText.trim()) {
            throw new Error(`Ответ полностью заблокирован фильтром содержимого. [модель: ${currentModel}]`);
        }
        return { content: fullText, usage: finalUsage, filtered: streamFiltered };
    }

        const prompt = `Сгенерируй 4 варианта персонажа для старта. Пол: ${gender}. Возраст: ${age}. Стартовая локация: ${gameState.location}.
Пол всех четверых должен совпадать с запрошенным. Если персонаж выдаёт себя за другой пол, это допустимо только как содержание поля «уязвимость», и в поле «имя» тогда стоит имя, под которым он живёт.
Не заключай поля в квадратные скобки — только текст, разделённый вертикальной чертой.
Формат СТРОГО:
<текст>Атмосферное вступление.</текст>
<выборы>
1. [Имя] | [Происхождение] | [Ремесло] | [Уязвимость или тайна]
Персонажи — обычные люди Кордима, не герои и не избранные. Ремесло бытовое или криминальное, под стать месту.
Поле money в состоянии — целое число ГРОШЕЙ (корд = 200 грошей, марка = 10). Стартовый капитал бедняка: от 10 до 120 грошей.
...
</выборы>
<состояние>{"money": 40}</состояние>`;

        /* Раньше сюда уходил только кор, и четвёрка сочинялась без справки
           о стартовом городе: Монтин описывался наугад. Подсовываем лорбуку
           название локации как будто это реплика, чтобы поднялись её записи. */
        const tempMessages = [buildSystemBlock(CORE_PROMPT, true, currentModel)];
        const startLore = getLorebookContext([{ role: 'user', content: gameState.location }]);
        if (startLore) tempMessages.push({ role: "system", content: startLore });
        tempMessages.push({ role: "user", content: prompt });

        try {
            const data = await callOpenRouter(tempMessages);
            updateTokenDisplay(data.usage);
            
            const parsed = parseResponse(data.choices[0].message.content);
            const optionsContainer = document.getElementById('char-options');
            optionsContainer.innerHTML = '';
            
            const p = document.createElement('p');

                choiceBtn.textContent = cleanText;

                    const parts = cleanText.split('|').map(s => s.trim());

    async function summarizeHistory() {
        if (isSummarizing || chatHistory.length <= 16) return;
        const countToSummarize = chatHistory.length - 8;
        const messagesToSummarize = chatHistory.slice(0, countToSummarize);
        
        isSummarizing = true;
        const prompt = `Верни только JSON-массив, без пояснений и markdown-обёртки. Факты, не художественный текст. Формат: [{"day": 3, "type": "встреча|сделка|конфликт|потеря|обещание|рана|перемещение", "who": ["имя"], "where": "локация", "what": "одна фраза, факт без прозы", "keys": ["слова для поиска"], "weight": 1-5}]`;
        
        let sumMessages = [
            { role: "system", content: "Ты архивариус. Выдавай строго валидный JSON." },
            ...messagesToSummarize.map(m => ({ role: m.role, content: m.content })),
            { role: "user", content: prompt }
        ];

        try {
            const data = await callOpenRouter(sumMessages, summaryModel, 0.3, 600);
            updateTokenDisplay(data.usage, summaryModel);
            
            let textReply = data.choices[0].message.content.trim();
            textReply = textReply.replace(/^```(json)?/, '').replace(/```$/, '').trim();
            
            const newEvents = JSON.parse(textReply);
            if (Array.isArray(newEvents)) {
                /* Чиним данные на входе, а не потом: слабая модель пропускает вес,
                   пишет день строкой и забывает keys — а на этих полях держится
                   и отбор в память, и очистка. */
                const clean = newEvents.filter(e => e && typeof e === 'object').map(e => ({
                    day: Number(e.day) || (gameState.day || 1),
                    type: String(e.type || ''),
                    who: Array.isArray(e.who) ? e.who.map(String) : [],
                    where: String(e.where || ''),
                    what: String(e.what || '').trim(),
                    keys: Array.isArray(e.keys) ? e.keys.map(String) : [],
                    weight: eventWeight(e)
                })).filter(e => e.what);

                events = events.concat(clean);
                chatHistory.splice(0, countToSummarize);
                archivedTurns += countToSummarize;
                saveGame();
                /* Без перерисовки сообщения просто исчезали бы со следующим ходом
                   без всякого объяснения. Но не посреди хода: сжатие идёт в фоне
                   и может закончиться во время стриминга — перерисовка стёрла бы
                   текст, который в этот момент печатается на экран. */
                const turnRunning = document.getElementById('game-loader').style.display === 'block';
                if (!turnRunning && document.getElementById('screen-game').classList.contains('active')) {
                    renderGameUI();
                }
            }
        } catch (e) {
            console.error("Ошибка парсинга событийной памяти:", e);
        } finally {
            isSummarizing = false;
        }
    }

    /* === ОСНОВНОЙ ЦИКЛ === */
    async function executeTurn(isInit, isRewrite = false) {
        const loader = document.getElementById('game-loader');
        const customBtn = document.getElementById('btn-custom-action');
        
        loader.classList.remove('error');
        loader.textContent = 'Рассказчик думает...';
        loader.style.display = 'block';
        document.getElementById('choices-container').innerHTML = '';
        customBtn.disabled = true;
        let failed = false;
        
        let stateBeforeTurn = JSON.parse(JSON.stringify(gameState));
        if (isRewrite) {
            const lastMsg = chatHistory[chatHistory.length - 1];
            if (lastMsg.stateBefore) stateBeforeTurn = JSON.parse(JSON.stringify(lastMsg.stateBefore));
        }

        updateStatePanel();
        renderGameUI(isRewrite); 

        /* Порядок под кэш провайдера: неизменный префикс (кор + карточка персонажа +
           append-only история) идёт первым, всё меняющееся уезжает в хвост.
           Хвост оформлен ролью user, а не system: доки OpenRouter требуют выносить
           динамику в позднее user-сообщение, а не дописывать её системными блоками
           после кэшируемого. */
        let messages = [];
        messages.push(buildSystemBlock(CORE_PROMPT, true, currentModel));
        messages.push({ role: "system", content: `ПЕРСОНАЖ: Имя: ${character.name}, Пол: ${character.gender}, Возраст: ${character.age}, Происхождение: ${character.origin}, Ремесло: ${character.trade}, Уязвимость: ${character.flaw}` });

        const historyForContext = isRewrite ? chatHistory.slice(0, -1) : chatHistory;
        messages = messages.concat(historyForContext.map(m => ({ role: m.role, content: m.content })));

        const tail = [];
        const lore = getLorebookContext(historyForContext);
        if (lore) tail.push(lore);

        const memory = getMemoryContext(historyForContext);
        if (memory) tail.push(memory);

        tail.push(`ТЕКУЩЕЕ СОСТОЯНИЕ: ${JSON.stringify(gameState)}
Деньги в состоянии — целое число ГРОШЕЙ. Сейчас при себе: ${formatMoney(gameState.money)}. Корд = 200 грошей, марка = 10 грошей.
ПРАВИЛО ОТВЕТА: всегда возвращай <текст>, <выборы> (4 штуки списком) и обновлённый JSON в <состояние>. Обязательно двигай date и day вперёд при смене сцены, ночлеге и дороге.`);

        messages.push({ role: "user", content: tail.join("\n\n") });

        const streamP = appendMessageBlock('assistant');

        try {
            let data = await callOpenRouterStream(messages, (partialText) => {
                const textMatch = partialText.match(/<текст>([\s\S]*?)(?:<\/(?:текст)?>|$)/i);
                streamP.textContent = textMatch ? textMatch[1].trim() : partialText.replace(/<[^>]*>?/g, '');
                window.scrollTo(0, document.body.scrollHeight);
            });
            
            updateTokenDisplay(data.usage);
            let reply = data.content;
            let parsed = parseResponse(reply);

            if (parsed.choicesArr.length === 0) {
                messages.push({ role: "assistant", content: reply });
                messages.push({ role: "system", content: "НАПОМИНАНИЕ: Обязательно выведи 4 варианта действий внутри тега <выборы>." });
                const retryData = await callOpenRouter(messages);
                updateTokenDisplay(retryData.usage); 
                reply = retryData.choices[0].message.content;
                parsed = parseResponse(reply);
            }

            applyState(parsed.stateDelta);
            
            if (isRewrite) {
                let lastMsg = chatHistory[chatHistory.length - 1];
                lastMsg.swipes.push(reply);
                lastMsg.swipeIndex = lastMsg.swipes.length - 1;
                lastMsg.content = reply;
            } else {
                chatHistory.push({ role: "assistant", content: reply, swipes: [reply], swipeIndex: 0, stateBefore: stateBeforeTurn });
            }
            
            if (chatHistory.length > 16) summarizeHistory();
            
            gameStarted = true;
            saveGame();
            renderGameUI();
        } catch (e) {
            failed = true;
            if (!isRewrite) {
                chatHistory.pop();
                gameState = stateBeforeTurn;
            }
            renderGameUI();
            loader.classList.add('error');
            loader.textContent = `Ход не прошёл. ${e.message}`;
            loader.style.display = 'block';
        } finally {
            if (!failed) loader.style.display = 'none';
            customBtn.disabled = false;
            /* На телефоне автофокус выдёргивал клавиатуру после каждого хода. */
            if (window.matchMedia('(min-width: 601px)').matches) {
                document.getElementById('custom-action').focus();
            }
        }
    }

    function rewriteTurn() {
        if (chatHistory.length < 2) return;
        const lastMsg = chatHistory[chatHistory.length - 1];
        if (lastMsg.role !== 'assistant') return;
        if (!lastMsg.swipes) { lastMsg.swipes = [lastMsg.content]; lastMsg.swipeIndex = 0; }

        if (lastMsg.stateBefore) gameState = JSON.parse(JSON.stringify(lastMsg.stateBefore));
        executeTurn(false, true);
    }

    function undoTurn() {
        /* Откат самого первого хода оставлял пустой экран без кнопок и без
           выхода: истории нет, выборов нет, играть нечем. */
        if (chatHistory.length <= 2) {
            alert('Это первый ход — откатывать некуда. Чтобы начать заново, вернитесь в меню и выберите слот.');
            return;
        }
        const lastMsg = chatHistory[chatHistory.length - 1];
        if (lastMsg.role !== 'assistant' || !lastMsg.stateBefore) return;
        
        gameState = JSON.parse(JSON.stringify(lastMsg.stateBefore));
        chatHistory.pop(); 
        if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
            chatHistory.pop(); 
        }
        
        saveGame();
        renderGameUI();
    }

    /* === ЭКРАН ПЕРСОНАЖА ===
       Ручная правка нужна потому, что состояние ведёт модель, а она врёт:
       теряет монеты, забывает раны, дублирует предметы. Без вентиля партия
       чинится только откатом хода. */
    const CHAR_FIELDS = [
        ['name',   'Имя'],
        ['gender', 'Пол'],
        ['age',    'Возраст'],
        ['origin', 'Происхождение'],
        ['trade',  'Ремесло'],
        ['flaw',   'Уязвимость']
    ];

    function openCharacterScreen() {
        const cardBox = document.getElementById('char-card-fields');
        cardBox.innerHTML = '';
        CHAR_FIELDS.forEach(([key, label]) => {
            const wrap = document.createElement('div');
            wrap.className = 'char-field';
            const l = document.createElement('label');
            l.textContent = label;
            const i = document.createElement('input');
            i.type = 'text';
            i.id = 'cf-' + key;
            i.value = character[key] != null ? String(character[key]) : '';
            wrap.appendChild(l); wrap.appendChild(i);
            cardBox.appendChild(wrap);
        });

        const stateBox = document.getElementById('char-state-fields');
        stateBox.innerHTML = '';
        const stateFields = [
            ['location', 'Локация', gameState.location],
            ['date',     'Дата (как её видит рассказчик)', gameState.date],
            ['day',      'День (число)', gameState.day],
            ['money',    'Деньги в грошах — сейчас ' + formatMoney(gameState.money), gameState.money],
            ['wounds',   'Раны через запятую', (gameState.wounds || []).join(', ')],
            ['inventory','Инвентарь через запятую', (gameState.inventory || []).join(', ')]
        ];
        stateFields.forEach(([key, label, val]) => {
            const wrap = document.createElement('div');
            wrap.className = 'char-field';
            const l = document.createElement('label');
            l.textContent = label;
            const i = document.createElement('input');
            i.type = 'text';
            i.id = 'sf-' + key;
            i.value = val != null ? String(val) : '';
            wrap.appendChild(l); wrap.appendChild(i);
            stateBox.appendChild(wrap);
        });

        renderEventsEditor();
        switchScreen('screen-character');
        window.scrollTo(0, 0);
    }

    function renderEventsEditor() {
        const box = document.getElementById('char-events');
        box.innerHTML = '';
        document.getElementById('ev-count').textContent = events.length;
        if (!events.length) {
            const none = document.createElement('p');
            none.style.cssText = 'color:#666;font-size:13px;';
            none.textContent = 'Пока пусто. События появятся, когда история дорастёт до сжатия.';
            box.appendChild(none);
            return;
        }
        events.slice().sort((a, b) => (a.day || 0) - (b.day || 0)).forEach(ev => {
            const row = document.createElement('div');
            row.className = 'ev-row';

            const meta = document.createElement('div');
            meta.className = 'ev-meta';
            meta.textContent = `д.${ev.day ?? '?'} · в${ev.weight ?? '?'}`;
            meta.title = `${ev.type || 'без типа'} · ${ev.where || 'место не указано'} · ${(ev.who || []).join(', ')}`;

            const ta = document.createElement('textarea');
            ta.value = ev.what || '';
            ta.addEventListener('input', () => { ev.what = ta.value; });

            const del = document.createElement('button');
            del.className = 'ev-del';
            del.textContent = '✕';
            del.title = 'Забыть это событие';
            del.addEventListener('click', () => {
                const i = events.indexOf(ev);
                if (i !== -1) events.splice(i, 1);
                renderEventsEditor();
            });

            row.appendChild(meta); row.appendChild(ta); row.appendChild(del);
            box.appendChild(row);
        });
    }

    function saveCharacterScreen() {
        CHAR_FIELDS.forEach(([key]) => {
            const el = document.getElementById('cf-' + key);
            if (el) character[key] = el.value.trim();
        });

        const g = (k) => {
            const el = document.getElementById('sf-' + k);
            return el ? el.value.trim() : '';
        };
        const splitList = (v) => v.split(',').map(x => x.trim()).filter(Boolean);

        gameState.location  = g('location');
        gameState.date      = g('date');
        const day = parseInt(g('day'), 10);
        if (!isNaN(day)) gameState.day = day;
        const money = parseInt(g('money'), 10);
        if (!isNaN(money)) gameState.money = Math.max(0, money);
        gameState.wounds    = splitList(g('wounds'));
        gameState.inventory = splitList(g('inventory'));

        events = events.filter(e => (e.what || '').trim().length > 0);

        saveGame();
        updateStatePanel();
        switchScreen('screen-game');
        renderGameUI();
    }

    function changeSwipe(direction) {
        const lastMsg = chatHistory[chatHistory.length - 1];
        if (lastMsg.role !== 'assistant' || !lastMsg.swipes || lastMsg.swipes.length <= 1) return;
        
        lastMsg.swipeIndex += direction;
        if (lastMsg.swipeIndex < 0) lastMsg.swipeIndex = lastMsg.swipes.length - 1;
        if (lastMsg.swipeIndex >= lastMsg.swipes.length) lastMsg.swipeIndex = 0;
        
        lastMsg.content = lastMsg.swipes[lastMsg.swipeIndex];
        /* Дельту накладываем только на снимок состояния до хода. Без снимка
           (старые сейвы) она легла бы поверх дельты предыдущего варианта, и
           деньги с ранами поплыли бы при каждом перещёлкивании. */
        if (lastMsg.stateBefore) {
            gameState = JSON.parse(JSON.stringify(lastMsg.stateBefore));
            applyState(parseResponse(lastMsg.content).stateDelta);
        }
        
        saveGame();
        renderGameUI();
    }
</script>
