name: Сборка Порта Теней для Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Игры/Порт/Приложение_Для_ПК/**"
      - ".github/workflows/port-desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Игры/Порт/Приложение_Для_ПК/package-lock.json

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Игры/Порт/Приложение_Для_ПК/src-tauri -> target

      - name: Установить зависимости Tauri
        working-directory: Игры/Порт/Приложение_Для_ПК
        run: npm ci

      - name: Проверить навигацию оболочки
        working-directory: Игры/Порт/Приложение_Для_ПК/src-tauri
        run: cargo test --lib

      - name: Собрать установщик
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: Игры/Порт/Приложение_Для_ПК
          args: --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: port-teney-windows-[arch]
