<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Порт Теней</title>
<!-- Стадия 2 «Жизнь» (ГДД Игры/Генератор_Историй/Порт_ГДД.md, §22): выбор начала, карта
     пяти районов, день из четырёх отрезков, ночь, переходы, конец дня. Без картинок — подложки
     подключаются позже, экран рисуется и без них (см. Движок/экраны.js). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&family=Cormorant:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./Движок/интерфейс.css">
</head>
<body>
<div id="задник" aria-hidden="true"><div class="з-кадры"></div><div class="з-время"></div><div class="з-тинт"></div><div class="з-туман"></div><div class="з-дождь"></div><div class="з-виньетка"></div></div>
<div id="зерно" aria-hidden="true"></div>
<header id="hud">
  <div class="hud-бренд">Порт Теней<small>Ранняя осень · 1026</small></div>
  <div class="hud-время"><span id="hud-день"></span><div id="hud-отрезок"></div></div>
  <div id="hud-тело" aria-label="Состояние героя"></div>
  <div class="hud-контекст"><span id="hud-где"></span><small id="hud-погода"></small></div>
  <span id="hud-кошель"></span>
  <span id="hud-кнопки"><button class="b" id="hud-помощь">Как играть</button><button class="b" id="hud-меню">Меню <small>Esc</small></button></span>
</header>
<div id="тело-макета">
  <div id="экран"></div>
</div>
<div id="вести" aria-live="polite"></div>
<nav id="панель"></nav>

<script type="module">
import { новоеСостояние, сохранить, загрузить, ошибкаЗагрузки, сброситьАвтосейв } from './Движок/состояние.js';
import { рендерHUD, рендерКарту, рендерСмены, рендерКонецДня, рендерСтарт } from './Движок/экраны.js';
import { рендерМесто } from './Движок/экраны-места.js';
import { рендерПанель, ПАН } from './Движок/экраны-панель.js';
import { рендерМеню, рендерГлавноеМеню, рендерПомощь, рендерПрибытие, рендерВступление, послеВступления, подтверждено18, рендерВзрослым } from './Движок/меню.js';

import { применитьНастройки } from './Движок/настройки-интерфейса.js';
import { ИНТ, показатьВести } from './Движок/экраны.js';
import { музыка, музыкаДля } from './Движок/звук.js';
применитьНастройки();

document.getElementById('hud-помощь').onclick = () => рендерПомощь();
function загрузитьСлот(n) {
  const З = загрузить(n); if (!З) return;
  S = З; ПАН.вкладка = 'город'; ИНТ.район = true; ИНТ.карточка = null;
  document.getElementById('hud').hidden = false;
  document.getElementById('панель').style.display = '';
  сохранить(S, 'авто'); перерисовать();
}
let прибытиеПоказано = false;
function новаяИгра() {
  сброситьАвтосейв();
  S = null; прибытиеПоказано = false; ПАН.вкладка = 'город'; ИНТ.район = true; ИНТ.карточка = null;
  document.getElementById('панель').style.display = '';
  перерисовать();
}
document.getElementById('hud-меню').onclick = () => рендерМеню(!!S, {
  сохранитьВ: n => сохранить(S,n), загрузить: загрузитьСлот, заново: новаяИгра,
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || document.querySelector('.ов') || document.getElementById('hud').hidden) return;
  e.preventDefault(); document.getElementById('hud-меню').click();
});
let S = загрузить('авто');
function главноеМеню() {
  музыка('главная');
  рендерГлавноеМеню(!!S, { продолжить: перерисовать, новая: новаяИгра, заново: новаяИгра, загрузить: загрузитьСлот });
}

function перерисовать() {
  if (!S) {
    // на старте шапка скрыта, но меню нужно (загрузить слот), поэтому прячем только показатели
    document.getElementById('hud').hidden = false;
    ['hud-день', 'hud-отрезок', 'hud-тело', 'hud-кошель', 'hud-где', 'hud-погода'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('панель').innerHTML = ''; // до начала игры панели нет
    document.querySelectorAll('.ов.пан').forEach(o => o.remove());
    музыка('главная');
    // Сцена прибытия идёт до выбора начала (шаг 1) и один раз на новую игру: повторная перерисовка
    // стартового экрана её не повторяет.
    if (!прибытиеПоказано) {
      рендерПрибытие(() => { прибытиеПоказано = true; перерисовать(); });
      return;
    }
    рендерСтарт(началоId => {
      S = новоеСостояние(началоId);
      сохранить(S, 'авто');
      // город за кадром уже готов, но экран (карта) до заключительного абзаца и подсказки не перерисовываем —
      // а шапку и нижнюю панель на время обоих окон прячет сам Движок/меню.js (рендерВступление/рендерПомощь)
      // справка — один раз: кто уже нажал в ней «Понятно», идёт сразу в город
      рендерВступление(началоId, () => послеВступления(перерисовать));
    }, ошибкаЗагрузки());
    return;
  }
  рендерHUD(S);
  рендерПанель(S, продолжить);
  музыка(музыкаДля(S));
  document.querySelectorAll('.ов.мест').forEach(o => o.remove());
  document.getElementById('экран').classList.toggle('в-месте', !!S.сцена && !S.мир.конецДня);
  if (S.мир.конецДня) {
    рендерКонецДня(S, продолжить);
  } else if (S.сцена) {
    рендерМесто(S, продолжить); // визит в место живёт, пока не нажато «Выйти в город»
  } else if (S.мир.смена) {
    рендерСмены(S, продолжить); // работа остаётся отдельной карточкой, пока игрок её не закроет
  } else {
    рендерКарту(S, продолжить);
  }
  показатьВести(S);
}

// Автосейв — на каждом шаге, где день закончился (ГДД §18: «в конце каждого
// дня»); итог дня лежит в состоянии, поэтому после перезагрузки экран конца
// дня покажется снова, а не потеряется.
function продолжить(состояние, сохранитьПослеСмены = false) {
  S = состояние;
  // Каждое завершённое действие записывается целиком: покупка, передача, смена,
  // разговор и выход из них переживают перезагрузку без повторного списания.
  сохранить(S, 'авто');
  перерисовать();
}

if (подтверждено18()) главноеМеню(); else рендерВзрослым(главноеМеню);
</script>
</body>
</html>
