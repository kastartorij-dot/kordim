      <p>Последняя выжившая из уничтоженного благородного дома. В пятнадцать лет её родовой замок пал после двухлетней осады. Циничный старый капитан стражи взял девочку под свою защиту и вложил ей в руки тяжёлый арбалет: «Не смотри им в глаза. Они не люди. Они мишени. Поправка на ветер, натяжение, спуск».</p>
      <p>Ей чудом удалось сбежать перед тем, как замок взяли. Первый осознанный выстрел — убийство из милосердия: раненый учитель попросил избавить его от плена и пыток.</p>
      <p>«Грейс» — выбранное имя, не то, что дали при рождении. Настоящее умерло вместе с домом. Никто из живых его не знает.</p>
      <h4>Психология</h4>
      <p>Прагматична до неприятного. Убийство давно перестало быть для неё чем-то особенным — просто работа. Удовольствия от этого не получает, но и не изводит себя после каждого контракта. Говорит тихо, скупо, по делу. Изредка — сухой чёрный юмор.</p>
      <p>Терпеть не может дешёвое кислое вино — сама не знает почему. Хранит стёртую медную пуговицу неясного происхождения; выбросить так и не смогла.</p>
      <div class="callout rule"><p class="callout-label">Внутренний мир — только через микрореакции</p>
        <p>Состояние Грейс проявляется через тело, а не слова:</p>
        <ul>
          <li>Стреляя в цель, которую внутренне считает невиновной — задерживает дыхание чуть дольше обычного, костяшки пальцев в перчатках белеют на ложе арбалета.</li>
          <li>Когда близкому человеку грозит смерть — на мгновение замирает. Совсем ненадолго. Потом какое-то время сама себя за это ненавидит.</li>
          <li>Когда плана нет (случается редко) — руки замирают посреди действия, взгляд уходит в одну точку на пару секунд, потом она как ни в чём не бывало продолжает работу.</li>
        </ul>
      </div>
      <p><strong>Сенсорные триггеры:</strong> запах горящей древесины, холодная каменная пыль, вес арбалетной ложи, прижатой к щеке пятнадцатилетнего подростка.</p>
      <p><strong>Морские узлы</strong> — пальцы помнят моторику, которой её в детстве научил брат. Когда она заплетает волосы или закрепляет снаряжение, руки сами вяжут идеальные морские узлы. Она этого не замечает.</p>
      <p><strong>Тайное удовольствие:</strong> поёт — тихо, себе под нос, только когда уверена, что одна. Что-то старое, полузабытое, из замка. Замолкает в ту же секунду, как слышит шаги.</p>

      <p>Мастер дистанции, засад, угловой позиции. В драку старается не лезть. Основное оружие — большой композитный арбалет, тёмное дерево и воронёная сталь, натяжение около двухсот фунтов, взводится рычагом «козья ножка» за десять-пятнадцать секунд. Болты — бронебойные и с широким наконечником. Перед выстрелом успевает прикинуть ветер, дистанцию, биомеханику цели.</p>
      <p>Ближний бой — гранёный мизерикорд, только в упор: сочленения доспехов, горло, основание черепа, подмышки. Один точный выстрел или один точный удар. <strong>10–15 секунд на перезарядку — короткое, но реальное окно, и в свалке оно решает.</strong> Никто отчасти для того и рядом, чтобы его закрывать.</p>
      <h4>Тактическое перемещение</h4>

      <div class="callout gm"><p class="callout-label">Зеркало Никто</p><p>Арн — это Никто до лаборатории. Та же потеря в начале, то же одиночество, та же привычка рассчитывать только на себя. Разница в том, что Арн попал в более мягкие руки и не был сломан намеренно. Он мог бы вырасти в кого угодно. Пока не ясно, в кого именно.</p></div>

    {id:"npc-thorn", title:"Торн (Эйгон Кальвер)", tags:"торн эйгон кальвер бастард свинцовые клинки логист палаш", summary:"Правая рука Седого и мозг Свинцовых клинков. Бастард лорда Кальвера, который хочет не убить отца, а стереть его Дом с лица земли.", html:`
      <p class="lede">Мозг и главный логист <a href="#" data-link="fac-leadblades">Свинцовых клинков</a>. Блестящий тактик и переговорщик, знающий историю и законы Кордима лучше столичных советников.</p>
      <dl class="stats"><div><dt>Возраст</dt><dd>~35 лет</dd></div><div><dt>Оружие</dt><dd>Тяжёлый зазубренный палаш</dd></div><div><dt>Настоящее имя</dt><dd>Эйгон Кальвер</dd></div><div><dt>В 1011-м</dt><dd>двадцать лет, при описи</dd></div></dl>
      <h4>Внешность и маска</h4>
      <p>Светлая аккуратная борода, вечно прищуренные глаза. Носит поношенную, но качественную кирасу и дешёвый амулет, который никогда не снимает. Социальная маска — «свой в доску парень»: смеётся, пьёт с матросами, хлопает их по плечам, — а внутри кристально их презирает.</p>
      <h3>Истинная мотивация</h3>
      <p>Он — бастард <a href="#" data-link="fac-house-kalver">лорда Эйнара Кальвера</a>. Его мать была долговой рабыней и умерла от истощения на пшеничных полях, пока законные наследники пили вино. Торн рано понял, что система не сломана — она работает ровно так, как задумана.</p>
      <p>Его цель — не просто убийство отца, а <strong>полное уничтожение Дома Кальвер</strong>: сжечь поля, стереть имя, пустить долговые книги по ветру. Свинцовые клинки для него — армия и инструмент. Седой — идеальный полководец, которого Торн нашёл с клинком у своего горла и тут же отдал ему своих людей.</p>
      <h3>Связи</h3>
      <p><strong>Седой</strong> — единственная точка, где Торн снимает маску. Он видит в нём аристократа без якоря, человека, которому абсолютно нечего терять, и не пытается им манипулировать. Это не дружба, но что-то близкое к глубокому уважению без расчёта — аномалия для Торна, привыкшего считать всё наперёд.</p>
      <p><strong>Никто</strong> откровенно раздражает Торна: тот привык читать чужие маски насквозь, но абсурдная маска идиота не поддаётся логическому анализу.</p>
      <div class="callout gm"><p class="callout-label">Тайна Астернов (не для игроков)</p><p>Пятнадцать лет назад двадцатилетний Торн был во дворе <a href="#" data-link="loc-astern">замка Астернов</a> — не в штурме: парнем с сундуком, в охране партии, приехавшей описывать имущество, и не знал, чьё требование исполняет. Он видел большой зал и выживших детей во дворе. Ровесник Корна в ту ночь, по разные стороны стены. Годы спустя он узнал этот взгляд в Седом — и вычислил, что «Стальная Грейс» это Кейра Астерн. Пришёл с предложением использовать её как политический рычаг и получил ответ: «Скормлю морю по кускам». Торн отступил, информацию сохранил, а уважение к Седому только выросло.</p></div>
      <h3>Стиль боя</h3>
      <p>Мясник с головой тактика. Никогда не дерётся честно: плюнет кровью в глаза, бросит песок, толкнёт своего же раненого матроса под ноги врагу. Черту он пересёк давно и оправданий не ищет — важен только результат. Гибель своих людей его не мучает, хотя иногда заставляет сделать короткую, почти незаметную паузу. Один на один выходит, только если уверен в победе на сто процентов или загнан в угол.</p>
    `},
    {id:"npc-brant", title:"Грегор Брант", tags:"грегор брант охотник за головами садист жетоны полуторный меч", summary:"Дисциплинированный садист, срезающий жетоны с шей убитых наёмников. Тихий звон связки на его груди означает неминуемую смерть.", html:`
      <p class="lede">Элитный охотник за головами. Коллекционер чужих смертей. У него нет трагичной предыстории или детской травмы — он просто родился таким.</p>
      <h4>Внешность</h4>
      <p>Высокий, неестественно худой. Мертвенно-бледное лицо, усы, опускающиеся за уголки губ, пустые невыразительные «рыбьи» глаза. Носит только лёгкий потёртый кожаный колет, ничего лишнего. Движется с пугающей механической плавностью — не крадётся, а просто так ходит.</p>
      <p>Брант — <strong>дисциплинированный садист</strong>: никакого хаоса, только холодный выбор жертвы и хирургическое исполнение.</p>
      <h3>Трофеи и Гильдия</h3>
      <p>Работает через <a href="#" data-link="fac-bounty">Далка Сурна</a>, но не подчиняется ему — Сурн для него просто диспетчер с хорошим «меню». Золото Бранта не интересует, его интересует процесс.</p>
      <p>Он берёт публичные контракты исключительно на наёмников, объявленных Гильдией вне закона: находит их, ломает физически и психологически, убивает, а затем срезает с шей номерные жетоны. Носит связку этих жетонов на цепи на шее — при ходьбе они тихо звенят. Брока Сайдена и Марру Холт трясёт от ярости из-за этого осквернения, но технически Брант делает их грязную работу по зачистке отступников, поэтому его терпят.</p>
      <div class="callout rumor"><p class="callout-label">Что знают наёмники</p><p>Для наёмников Кордима тихий звон металла за спиной означает неминуемую смерть.</p></div>
      <h3>Стиль боя и уровень угрозы</h3>
      <p><strong>Оружие:</strong> полуторный меч без украшений, идеально сбалансированный. Никакой алхимии, никаких арбалетов.</p>
      <p><strong>Метод:</strong> нечеловеческая скорость, абсолютное чувство дистанции, полное отсутствие страха. Брант побеждает до первого удара — он заставляет противника бояться себя.</p>
      <div class="table-wrap"><table>
        <tr><th>Ситуация</th><th>Исход</th></tr>
        <tr><td>Один на один с Грейс или Никто</td><td>Предрешён. Грейс не успеет взвести арбалет дважды; в ближнем бою Брант превосходит её за счёт длины клинка</td></tr>
        <tr><td>Одиночный нож с 10+ шагов</td><td>Отбивает клинком — скорость меньше, дуга читается</td></tr>
        <tr><td>Залп в 3–4 ножа или ближе 5 шагов</td><td>Уклоняется, уходит за укрытие, не отбивает. Физика не позволяет</td></tr>
        <tr><td>Оба вместе, подготовленный рельеф, алхимические ловушки</td><td>Исход открыт</td></tr>
      </table></div>
      <p>Читает бросок до того, как нож срывается с пальцев — и этого хватает, чтобы не оказаться там, куда летит сталь.</p>
      <div class="callout rule"><p class="callout-label">Единственная слепая зона</p><p>Он позволяет разговору длиться дольше, чем должен, если противник достаточно интересен. Это не слабость характера — это единственная трещина в машине, и держится она на высокомерной самоуверенности. Чтобы взять Бранта, нужен абсолютный симбиоз героев, грязные трюки, рельеф, алхимические ловушки и эксплуатация именно этой трещины.</p></div>

      <h3>Динамика с героями</h3>
      <p>При первой встрече Грейс и Никто не пытались его купить золотом или запугать — они заплатили чем-то настоящим и не притворялись святыми. Локи это оценил.</p>
      <p><strong>Грейс</strong> раздражает, что она не может прочитать его до конца. Локи это знает и находит восхитительным — он единственный, кто иногда говорит ей правду просто чтобы посмотреть на её микрореакции.</p>
      <p>С <strong>Никто</strong> они понимают друг друга на косом интуитивном уровне. Оба носят маски — идиота и сумасшедшего, — оба знают об этом и никогда не пытаются сорвать их друг с друга. Негласное взаимное уважение двух сломанных людей.</p>
      <h3>Стиль боя</h3>
      <p>Дерётся редко и без удовольствия. Но если дошло до крови, бьёт неожиданно резко: высокий рост и длинные руки дают огромный рычаг, топорики летят дальше и точнее, чем ожидаешь. В ближнем бою максимально неудобный противник из-за нестандартной «журавлиной» геометрии движений. Не одолеет мастера вроде <a href="#" data-link="npc-kael">Каэла</a>, но гарантированно выживет и уйдёт там, где другой умрёт.</p>

    {id:"npc-heretic", title:"Отступник Д.", tags:"отступник дэй зверобой тлеющий присутствие чума левиафан ложа", summary:"Изгнанник Ложи, изучающий тварей Кордима как единую экосистему. Под застёгнутым на все пуговицы плащом по его шее ползут белые пятна.", html:`
      <p class="lede">Настоящее имя вымарано из реестров Алхимической Ложи — в досье осталась только буква «Д.». Информаторы вроде Локи зовут его «Д.», обыватели — «Зверобоем» или «Тлеющим». Некоторые зовут просто Дэй.</p>
      <h4>Образ</h4>
      <p>Силуэт читается раньше лица: длинный потёртый кожаный плащ с тёмно-красной подкладкой — вспышка цвета в сером мире — и низко надвинутая широкополая шляпа. Черты лица правильные, но микромимика и пропорции едва уловимо сдвинуты; люди инстинктивно чувствуют тревогу рядом с ним. Запах: горькие травы, алхимическая сера и застарелый, высохший страх.</p>
      <h3>Изгнание и архивы</h3>
      <p>Выгнан <a href="#" data-link="fac-lodge">мастером Оррой</a> за академическую ересь. Ложа хотела создавать яды и инструменты против тварей из Гнилого Леса и <a href="#" data-link="loc-whalegraveyard">Кладбища китов</a> — он хотел понять их как <strong>единую экосистему</strong>. Изучает анатомию левиафанов и лесных мутаций. Полевые записи, зарисовки аномалий и анатомические атласы монстров шифрует собственным, невзламываемым кодом.</p>
      <h3>Одержимость и Чума</h3>
      <p>Он единственный в Кордиме, кто убеждён — и утверждает, что имеет доказательства, — что <a href="#" data-link="lore-plague">Белая Чума</a> не <a href="#" data-link="sys-disease">болезнь</a>, а экологическая реакция среды: симптом присутствия чего-то массивного и хтонического, спящего под Кордимом или Гнилым Лесом.</p>
      <p>Однажды ночью в глубине леса он столкнулся с этим Присутствием. Записал увиденное, вырвал страницу и сжёг.</p>
      <div class="callout gm"><p class="callout-label">У него тикает таймер</p><p>С той ночи он застёгнут на все пуговицы до самого подбородка, даже в жестокую жару. Под плащом по его шее и ключицам медленно ползут белые пятна дремлющей Чумы или грибкового симбиоза. Он жив лишь потому, что глушит инфекцию тяжёлой химией собственного производства. Его «нечеловеческое» лицо — следствие медленного отказа органов.</p></div>
      <div class="callout rule"><p class="callout-label">Статус его утверждений</p><p>Это личная, эмоционально заряженная интерпретация одного человека — мир Кордима её не подтверждает. Официальная позиция Ложи сдержаннее, а связь разлома под лесом с эпидемией <em>никем не верифицирована</em>. Веру Отступника стоит явно отделять от установленных фактов мира.</p></div>
      <h3>Функция в мире</h3>
      <p>Он не боец: нож носит для самообороны, дерётся грязно и без техники, только чтобы выиграть секунду для отступления. Его истинная ценность — <strong>абсолютное знание уязвимостей любой твари Кордима</strong>. Если обычное оружие не берёт монстра, Отступник знает, где у того слепое пятно или какой химический реагент растворит его панцирь. Он появляется там, где граница между природой и кошмаром истончается.</p>
      <h3>Динамика с героями</h3>
      <p><strong>Грейс</strong> мгновенно считывает его как угрозу — человек без имени, которому нечего терять, всегда опасен. Отступник отвечает на её ледяной прицел абсолютным равнодушием: ему не нужно её доверие, ему нужно лишь, чтобы её арбалет убил то, что мешает ему собирать образцы.</p>
      <p>На <strong>Никто</strong> он задержит взгляд дольше обычного — узнает химические ожоги, кислотные паттерны на пальцах и дёрганую моторику. Как бывший член Ложи, он прекрасно знает об экспериментах над Образцом №4 по воссозданию Чумы. Вслух не скажет ни слова, но вечером в его зашифрованном блокноте появится новая подробная страница, посвящённая Никто.</p>

    {id:"npc-elowen", title:"Элоуэн «Игла»", tags:"элоуэн игла эли хирург ложа ошерск приречье утопленник лекарь орра каволь долг плеть желчь дубильня", summary:"Полевой хирург, изгнанная из Ложи за то, что начала лечить бедняков. Последний шанс для раны, которую не берёт стандартная алхимия.", html:`
      <p class="lede">Полевой хирург, изгнанница Алхимической Ложи. Осела в <a href="#" data-link="loc-oshersk">Ошерске</a>, в районе Приречье. Якорь нормальности для наёмников.</p>
      <dl class="stats"><div><dt>Возраст</dt><dd>29 лет</dd></div><div><dt>Место</dt><dd>Подвал «Утопленника»</dd></div><div><dt>Крыша</dt><dd>Альдерман Крайм</dd></div><div><dt>Знает Никто</dt><dd>пять лет</dd></div></dl>
      <h4>Внешность</h4>
      <p>Молодая, но взгляд как у ветерана после трёх тяжёлых кампаний. Волосы туго стянуты на затылке. Практичный мужской колет, поверх — фартук с въевшимися бурыми пятнами, которые уже не отстирать. Пальцы длинные, феноменально ловкие, всегда в мелких порезах от спешки. Запах: чистый спирт, кровь, сушёный болотный мак и усталость. На левом запястье скрывает глубокий химический ожог — метку изгнанницы Ложи.</p>
      <h3>Конфликт с Ложей</h3>
      <p>Была одной из лучших учениц <a href="#" data-link="fac-lodge">мастера Орры</a>. Нарушила фундаментальное правило Ложи: <em>«Мы не спасаем жизни. Мы продаём время»</em>. Элоуэн синтезировала дешёвые аналоги элитных микстур — болотный мак как анальгетик, чёрный мох как антисептик — и начала лечить бедняков в Нижнем городе.</p>
      <p>Ложа пришла за ней в ~1021 году. Ожог на запястье ей поставили, сломать руки не успели. Дальше — три недели в подполе у пивовара, в том же городе, в двух кварталах от тех, кто её искал, и только потом баржей вниз, в Ошерск. Весь её мир в те недели помещался в сундук и в собственные руки. Ложа терпит её существование ровно до тех пор, пока она не суётся обратно в Столицу.</p>
      <p>Осела в подвале постоялого двора «Утопленник». Альдерман контрабандистов <strong>Крайм</strong> взял её под защиту — взамен она штопает его людей без вопросов.</p>
      <h3>Характер</h3>
      <p>Она не циник, она абсолютный прагматик. Остра на язык. Когда на её столе истекает кровью наёмник, ей плевать, скольких он убил — для неё это просто рваный мешок с трубками, который нужно зашить. Жестоко материт пациентов, пока шьёт их без наркоза, и они слушаются.</p>
      <p>Элоуэн не бескорыстна: она сознательно держит связи с теневым миром, потому что они её защищают и снабжают редкими компонентами. Она этими связями пользуется — и именно эта не совсем «чистая» прагматичность делает её живой женщиной Кордима, а не картонной святой.</p>
      <h3>В бою</h3>
      <p>Не боец. Но у неё есть скальпель и знание анатомии — в тёмном переулке вскроет нападающему сонную артерию чисто на рефлексах. Её истинная сила в другом: она вытаскивает с того света тех, кто уже должен был умереть. Если герои получат рану, которую не берёт стандартная <a href="#" data-link="alchemy-system">алхимия</a>, их последний шанс находится в её подвале.</p>
      <h3>Две встречи с Никто</h3>
      <p>С <a href="#" data-link="char-nemo">Никто</a> она знакома <strong>пять лет</strong> и знает его дольше, чем Грейс.</p>
      <p><strong>Столица, ~1021.</strong> Каэл послал его в Нижний город за свёртком, не сказав, что внутри: вопрос был проверкой. Ожидая, Никто считал несоответствия во дворе бывшей дубильни — она мыла руки спиртом перед каждым пациентом, кипятила нити, рычала на чужие руки у стола, инструмент был столичного качества. В трущобах такого быть не должно. Отдельно отметил, как она грела ладони о кружку, прежде чем тронуть старика с распоротым предплечьем, — и поймал себя на том, что смотрит дольше, чем нужно.</p>
      <p>Уходя, поймал её взгляд: она разбирала его шрам как работу. Затащил за печь, нож под рёбра — тогда любой из Ложи был для него потенциально связан с лабораторией. Она признала, что из Ложи, и про шрам сказала точно: ложевая кислота, лили на лежащего. Он её отпустил — тот, кто резал ему череп, ладони о кружку не грел. Она не отскочила, а предложила посмотреть его плохо сросшуюся левую руку. Бесплатно, в среду. Он назвал ей своё имя сам — первое, что он сделал по своей воле. В среду двор был пуст: в те самые дни за ней пришла Ложа.</p>
      <p><strong>Ошерск, 1023.</strong> Он нёс на спине через полгорода Ремма Каволя, приказчика Крайма, — тащил человека Крайма к врачу Крайма, мысль верная, но не та. Кто откроет дверь, он понял только на пороге. Она посмотрела сначала на стол, а не на него, и стала работать; узнала вслух через несколько секунд: «Ты». Рану затянула, кровь вернуть не могла. Нужна была микстура за тридцать кордов, у него было девять с половиной. Флакон она взяла в долг — одолжением, которое держала три года, — и не за Каволя, а за него.</p>
      <p>Взамен назначила цену: серая плеть и волчья желчь, срок до весны, и честно предупредила про волков, про Кесса и про отсутствие жетона. Он согласился сразу и потом не мог заполнить графу «зачем». Она попросила оставить вещь, потому что люди, которые ушли и не вернулись, вещей не оставляют. Он оставил метательный нож. Уходя, назвал её <strong>Эли</strong> — так её не звал никто.</p>
      <p>Днём люди Крайма нашли кровь в конторке и пришли к ней в третьем часу. Она соврала им — впервые за четыре года: принёс мужик, лица не разглядела. С 1019 года она никогда не врала о том, кто был у неё на столе; держала четыре года и сломала ради него. Нож лежит на полке между дурманом и живицей, она рассматривает его как расписку и говорит вслух: «Дура». Иногда трогает рукоять — проверить, тёплая ли.</p>
      <div class="callout gm"><p class="callout-label">Что она знает и чего не знает</p><p>Знает: шрам сделан кислотой Ложи и лили её на лежащего человека. Знает глухой коридорный слух, что кто-то из Ложи работал без реестра. Об <strong>Образце №4 не знает ничего</strong> и никогда о нём не слышала. Имени алхимика не знает, места лаборатории не знает, связать шрам с чумными исследованиями не может. Это ровно тот же уровень осведомлённости, что и у <a href="#" data-link="npc-heretic">Отступника Д.</a></p></div>
      <h3>Грейс — ещё не встречались</h3>
      <p>С Грейс она действительно не пересекалась ни разу: тут всё ещё потенциал. Сложится это так — абсолютное профессиональное уважение без лишних слов. Грейс единственная, у кого Элоуэн не спросит, откуда <a href="#" data-link="sys-wounds">раны</a>; Элоуэн единственный медик, у которого Грейс сможет уснуть, не пряча под подушкой стилет. Грейс быстро вычислит, что Игла — якорь Никто, не дающий ему окончательно сорваться.</p>
      <h3>Где жила</h3>
      <p>1021 — Столица, двор бывшей дубильни в Нижнем городе. 1023 — Ошерск, Синий двор за красильней. К 1026 — Приречье, подвал «Утопленника».</p>
    `},

      <p class="lede">Шестеро на повороте лесного тракта южнее <a href="#" data-link="loc-shadowport">Порта Теней</a>, трое с луками в ельнике. Не люди Кесса — залётные, зимовали неудачно, оголодали.</p>

      <h3>Мотив</h3>

      <h3>Хват</h3>
      <p>Главарь: спокойный, широкий в плечах, седая борода справа, <strong>серая войлочная шляпа не по размеру</strong>, которую он поправляет каждый раз, когда поворачивает голову. Шляпа отцовская — снята с убитого охотника.</p>

      <p>Целили в Грейс, попали в лошадь; вторая стрела вошла ей в левое предплечье выше кисти навылет. Никто убил одного — <strong>Гниду</strong>, три ножа в горло и рядом, — подхватил свёрток с арбалетом, посадил её на уцелевшего коня и увёл поперёк склона в ельник. Разбойникам достались раненая лошадь с обоими вьюками — еда, кремень, снаряжение — и три ножа Никто, которые до сих пор у Хвата. Погони не было: пятеро голодных не полезут в темнеющий лес за двумя вооружёнными, взяв уже добычу.</p>
      <div class="callout rumor"><p class="callout-label">Заряжено</p><p>После Гниды их пятеро вместе с Хватом. На осень 1026-го сидят за просекой у Ручейного. <strong>Грейс сказала вслух, что придёт за ними сама.</strong> Отсюда же и <a href="#" data-link="loc-burrow">Нора</a>: выбитые с тракта, дальше они шли пешком четыре часа.</p></div>

    {id:"flora-rotwood-swamp", title:"Флора: Гнилой Лес и Топь", tags:"флора растение дерево мох гриб папоротник топь болото плющ ель дуб осина тростник рогоз", summary:"Чёрные ели, живые деревья-тюрьмы для плюща-душителя и ряска, скрывающая, где кончается земля.", html:`
      <h3>Гнилой Лес</h3>
      <p>Лес не враждебен — он безразличен, как время или холодная вода. Долгое пребывание меняет человека постепенно и незаметно для него самого: месяц — становишься тише и настороженнее; год — начинаешь слышать лес раньше, чем видеть; несколько лет — что-то в восприятии перестраивается необратимо. Это не магия, а изоляция, особый воздух и постоянный полусумрак.</p>
      <h4>Деревья</h4>
      <ul>
        <li><strong>Чёрная ель</strong> — доминирующая порода, до тридцати метров, кора угольного цвета от сырости и грибка. Чёрная смола — основа горючей смеси, горит даже в сырости.</li>
        <li><strong>Серый дуб</strong> — живёт дольше ели, стволы искривлённые, желуди мелкие и несъедобные. Кесс выбирает старые дубы для меток — стоят веками.</li>
        <li><strong>Осина-утопленница</strong> — только вдоль болотных границ, листья дрожат без ветра; гниёт за два года.</li>
        <li><strong>Мёртвый вяз</strong> — не порода, а явление: вязы умирают стоя и остаются так десятилетиями, удерживаемые грибком. Опираться на них нельзя.</li>
      </ul>
      <h4>Подлесок и опасные растения</h4>
      <p>Земля покрыта сплошным ковром мха, папоротника и гниющей листвы слоем до колена в низинах — ходить бесшумно почти невозможно (Кесс умеет). <strong>Плющ-душитель</strong> вьётся по стволам, оставляя мёртвое дерево внутри живой зелёной колонны. <strong>Красная шляпка</strong> — гриб, похожий на съедобный, смертелен для детей и стариков. <strong>Белый плющ</strong> в глубине леса — сок вызывает волдыри за шесть часов и временную слепоту при попадании в глаза.</p>

      <p>Высокогорье убивает методично; растительность здесь — борьба, а не украшение. Горы старше любого государства и не помнят людей не потому, что враждебны, а потому что человек здесь просто не в приоритете у физики.</p>

      <h3>Побережье и Свинцовое море</h3>
      <p>Место, где ничто не держится: почва солёная и тонкая, растения приземистые и жёсткие. Сто лет рыбаки ходят по морю и всё равно не знают, что там внизу.</p>

        <li><strong>Штормовой мох</strong> — покрывает прибрежные камни, скользкий до опасности.</li>

      <p>В крупных городах грамотны около 20% взрослых, в деревнях — один-два человека, если повезёт. Гарантированно читают священники, купцы среднего уровня, чиновники, члены Гильдии и большинство наёмников высокого уровня, включая Грейс. Крестьяне, портовые грузчики и большинство солдат — практически нет.</p>

    {id:"lore-lindas", title:"Линдас", tags:"линдас южане южный сосед граница южная война юг марс сыны солнца", summary:"Южный сосед Кордима. Религия, для которой смерть в бою — переход, а не конец. Ветеран арен по имени Марс ведёт их пехоту как живое знамя.", html:`
      <p class="lede">Образованные кордимцы знают название страны — Линдас; остальные говорят просто «южане». Граница начинается в двух-трёх днях пути южнее Врат и представляет собой не линию, а полосу <a href="#" data-link="canon-notes">спорных</a> земель шириной около дня пути.</p>
      <h3>Почему воюют</h3>
      <p>Официально — спор о торговых путях: Линдас хочет прямой выход на север без посредников, Кордим — сохранить контроль над транзитом. Неофициально — Дом Сел и несколько советников зарабатывают на войне больше, чем заработали бы на мире: поставки армии, контракты, информационная торговля с обеих сторон разом. Идвальд воюет, потому что граница — единственное место, где он делает то, для чего создан; Вейр эту войну поддерживает, поскольку король на границе — король далеко от Столицы.</p>
      <h3>Линдас изнутри</h3>
      <p>Линдас старше, населённее и имеет письменную историю, которой у Кордима нет. На северного соседа смотрят как на варваров с деньгами — но торгуют с ним тем не менее. Климат теплее: виноградники, специи. Города старше кордимских, грамотность выше.</p>
      <p>Религия иная: центральный принцип гласит, что смерть в бою за правое дело — не конец, а переход. Это конкретная теология с чёткими правилами о том, что считается правым делом.</p>
      <div class="callout rule"><p class="callout-label">Почему они не отступают</p><p>Вернуться живым без приказа — социальная смерть: семья отворачивается, теологи не дадут обряда, имя вычёркивают из списков павших. Это давит сильнее инстинкта самосохранения и любого воинского устава. Линдасские солдаты не храбрее кордимских — они просто иначе считают смерть и позор.</p></div>
      <h3>Как воюют</h3>
      <p>Построение Линдаса — это <strong>таран</strong>: плотный, тяжёлый, заточенный вперёд. Щит к щиту, медленное давление. Не быстрые и не манёвренные, но устойчивые до абсурда; кордимская конница против такой пехоты вдвое менее эффективна.</p>
      <div class="callout rule"><p class="callout-label">Слабость не в людях, а в конструкции</p><p>Таран работает, пока строй остаётся единым куском. Удар с фланга рассекает его — и отрезанные части продолжают давить вперёд, потому что разворот не их задача. Строй не гибкий инструмент.</p></div>
      <p>Именно поэтому Линдас избегает генеральных сражений и ведёт войну через укреплённые форпосты и контролируемые проходы — там, где строй не рассыпается, а давит. На открытое поле выходят редко.</p>

const byId = {};

/* Поисковый индекс. Тело записи хранится размеченным, поэтому один раз
   на загрузке снимаем с него разметку — иначе поиск по слову «стиль»
   находил бы совпадения в атрибутах class. Разбито по полям: попадание
   в название весит больше, чем попадание в глубине текста. */
(function buildIndex(){
  const sink = document.createElement('div');
  ORDER.forEach(a => {
    /* Теги заменяем пробелом, а не срезаем: textContent склеивает
       соседние ячейки, и «бой» + «композитный» превращались
       в несуществующее «бойкомпозитный». Сущности после этого
       раскрывает сам innerHTML. */
    sink.innerHTML = a.html.replace(/<[^>]+>/g, ' ');
    a.ix = {
      title: a.title.toLowerCase(),
      tags: (a.tags || '').toLowerCase(),
      summary: (a.summary || '').toLowerCase(),
      body: (sink.textContent || '').replace(/\s+/g, ' ').toLowerCase(),
      group: a.group.toLowerCase()
    };
  });
  sink.innerHTML = '';
})();

/* Слова запроса. Служебные отбрасываем по тому же списку, что и ключи
   записи (STOP объявлен ниже, но к первому запросу уже инициализирован).
   Длины мало: «на» — два знака, а находится внутри «начала» и «названия»
   и тянет за собой все 69 листов. Короткие значимые слова вроде «яд»
   список пропускает. */
function queryWords(q){
  return (q || '').toLowerCase().split(/[\s,;]+/)
    .filter(w => w.length > 1 && !STOP.has(w));
}

/* Вес попадания. Слово ищется как подстрока, поэтому «чум» находит
   и «чума», и «чумы», и «чумной» — падежи русского языка иначе
   пришлось бы перечислять руками. */
function scoreOf(a, words){
  let total = 0;
  for (const w of words){
    let s = 0;
    if (a.ix.title.includes(w))   s += 100;
    if (a.ix.tags.includes(w))    s += 40;
    if (a.ix.summary.includes(w)) s += 20;
    if (a.ix.group.includes(w))   s += 15;
    if (a.ix.body.includes(w))    s += 5;
    if (!s) return 0;              /* каждое слово обязано найтись */
    /* Совпадение с начала слова весит больше, чем внутри слова: подстрока
       нужна ради падежей («чум» → «чума», «чумы»), но без этой поправки
       «яд» вытаскивал наверх «отряд» и «наряд». */
    if (atWordStart(a.ix.title + ' ' + a.ix.tags + ' ' + a.ix.summary, w)) s += 60;
    else if (atWordStart(a.ix.body, w)) s += 25;
    total += s;
  }
  return total;
}

/* Слово начинается с искомого — после пробела, кавычки, дефиса или в начале */
function atWordStart(field, w){
  if (field.startsWith(w)) return true;
  for (const c of [' ', '«', '"', '(', '-', '—', '/', ',', '.', ':', ';']){
    if (field.includes(c + w)) return true;
  }
  return false;
}

/* Нашлось только в глубине текста — это стоит сказать вслух:
   иначе непонятно, почему лист в выдаче. */
function onlyInBody(a, words){
  return words.length > 0 && words.every(w =>
    a.ix.body.includes(w) &&
    !a.ix.title.includes(w) && !a.ix.tags.includes(w) &&
    !a.ix.summary.includes(w) && !a.ix.group.includes(w));
}

/* Ключи записи — реальные слова, по которым она срабатывает в лорбуке.
   Служебные слова отсеиваются: ключи хранятся одной строкой, и разбиение
   по пробелам иначе вытаскивает предлоги из фраз вроде «замок на мысе». */
const STOP = new Set(['на','в','и','с','о','к','у','из','по','за','до','от','для','при',
  'над','под','же','а','но','что','как','это','все','не','ни','их','его','её','или','the']);
const keysOf = a => {
  const seen = new Set(), out = [];
  a.tags.split(/\s+/).forEach(w => {
    const k = w.toLowerCase();
    if (!k || k.length < 3 || STOP.has(k) || seen.has(k)) return;
    seen.add(k); out.push(w);
  });
  return out.slice(0, 7).join(' · ');
};

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

   перерисовать целиком из любой точки. */
const S = {
  screen:'title',
  entry:'world-overview',   // последняя открытая запись — к ней ведёт вкладка «Лист»
  ixQuery:'',
  ixGroup:null,
  ixStatus:null,
  ixSel:null,
  mapOn:null,
  tl:EVENTS.length - 1
};

const ICON_LAMP = '<path d="M10 2.5a5 5 0 0 0-3 9v2.5h6V11.5a5 5 0 0 0-3-9Z" stroke="currentColor" stroke-width="1.4"/><path d="M8 16.5h4M8.5 18.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
const ICON_SUN  = '<circle cx="10" cy="10" r="3.6" stroke="currentColor" stroke-width="1.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';

function applyLight(mode){
  const root = document.documentElement;
  root.classList.add('switching');
  root.setAttribute('data-light', mode);
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('switching')));
  const lamp = mode === 'lamp';
  document.getElementById('lampIcon').innerHTML = lamp ? ICON_SUN : ICON_LAMP;
  document.getElementById('lampLabel').textContent = lamp ? 'День' : 'Лампа';
}
function initLight(){
  let saved = null;
  try { saved = localStorage.getItem('kordim-light'); } catch (e) {}
  if (saved !== 'day' && saved !== 'lamp')
    saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'lamp' : 'day';
  applyLight(saved);
}
document.getElementById('lampToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-light') === 'lamp' ? 'day' : 'lamp';
  applyLight(next);
  try { localStorage.setItem('kordim-light', next); } catch (e) {}
});
initLight();

/* ══════════════════════════════════════════════════════════════════
   ПОИСК В ШАПКЕ
   Тот же движок, что и в «Указателе»: слова ищутся по названию, ключам,
   изложению и по всему тексту листа. Здесь он доступен с любого листа
   и показывает, каким куском текста лист совпал.
   ══════════════════════════════════════════════════════════════════ */
const findBox = document.getElementById('navFind');
const findInput = document.getElementById('findInput');
const findDrop = document.getElementById('findDrop');
let findHits = [], findAt = -1;

/* Кусок текста вокруг первого совпадения — иначе непонятно, за что
   лист попал в выдачу, когда слово сидит в глубине записи. */
function snippetOf(a, words){
  const body = a.ix.body;
  let at = -1, w = '';
  for (const x of words){
    const k = body.indexOf(x);
    if (k >= 0 && (at < 0 || k < at)){ at = k; w = x; }
  }
  if (at < 0) return a.summary;
  const from = Math.max(0, at - 55);
  const to = Math.min(body.length, at + w.length + 85);
  return (from > 0 ? '…' : '') + body.slice(from, to).trim() + (to < body.length ? '…' : '');
}

function findRun(){
  const words = queryWords(findInput.value);
  if (!words.length){ findClose(); return; }
  findHits = ORDER.map(a => ({ a, s: scoreOf(a, words) }))
                  .filter(x => x.s > 0)
                  .sort((x, y) => y.s - x.s || x.a.idx - y.a.idx)
                  .slice(0, 12).map(x => x.a);
  findAt = findHits.length ? 0 : -1;

  if (!findHits.length){
    findDrop.innerHTML = '<div class="find-empty">В реестре нет листа по этому запросу. '
      + 'Попробуйте короче — реестр ищет и по части слова.</div>';
  } else {
    let h = '<div class="find-head">Найдено листов: ' + findHits.length
          + (findHits.length === 12 ? ' и более' : '') + '</div>';
    findHits.forEach((a, k) => {
      h += '<button data-find="' + k + '"' + (k === findAt ? ' class="on"' : '') + '>'
        +  '<span class="ft"><b>' + hl(a.title, findInput.value) + '</b>'
        +  '<span>' + esc(a.group) + ' · лист ' + a.no + '</span></span>'
        +  '<span class="fs">' + hl(snippetOf(a, words), findInput.value) + '</span>'
        +  '</button>';
    });
    findDrop.innerHTML = h;
  }
  findDrop.hidden = false;
  findInput.setAttribute('aria-expanded', 'true');
}

function findClose(){
  findDrop.hidden = true;
  findDrop.innerHTML = '';
  findHits = []; findAt = -1;
  findInput.setAttribute('aria-expanded', 'false');
}

function findMove(d){
  if (!findHits.length) return;
  findAt = Math.max(0, Math.min(findHits.length - 1, findAt + d));
  findDrop.querySelectorAll('[data-find]').forEach(b =>
    b.classList.toggle('on', +b.dataset.find === findAt));
  const el = findDrop.querySelector('.on');
  if (el) el.scrollIntoView({ block:'nearest' });
}

function findOpen(k){
  const a = findHits[k];
  if (!a) return;
  findInput.value = '';
  findClose();
  findInput.blur();
  openEntry(a.id);
}

findInput.addEventListener('input', findRun);
findInput.addEventListener('focus', () => { if (findInput.value.trim()) findRun(); });
findInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); findMove(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); findMove(-1); }
  else if (e.key === 'Enter'){ e.preventDefault(); if (findAt >= 0) findOpen(findAt); }
  else if (e.key === 'Escape'){ e.preventDefault(); if (!findDrop.hidden) findClose(); else { findInput.value = ''; findInput.blur(); } }
});
findDrop.addEventListener('click', e => {
  const b = e.target.closest('[data-find]');
  if (b) findOpen(+b.dataset.find);
});
/* Клик мимо закрывает выдачу */
document.addEventListener('click', e => {
  if (!findDrop.hidden && !findBox.contains(e.target)) findClose();
});

/* ─── Появление блоков ──────────────────────────────────────────── */
function stagger(nodes){
  if (reduceMotion()) return;
  nodes.slice(0, 10).forEach((el, i) => {
    if (!el) return;
    el.classList.add('rise');
    el.style.animationDelay = (i * 26) + 'ms';
  });
}

/* Моноширинный несёт числа, текстовая гарнитура — слова. Значение сводки
   может быть и «~27 000», и «Мегаполис»; разбираем по содержимому. */
function markNumbers(root){
  root.querySelectorAll('.stats dd').forEach(dd => {
    if (/^[~<>≈]?\s*[\d]/.test(dd.textContent.trim())) dd.classList.add('num');
  });
}

/* ══════════════════════════════════════════════════════════════════
   ЛИСТ IV · УКАЗАТЕЛЬ
   ══════════════════════════════════════════════════════════════════ */
function ixResults(){
  const words = queryWords(S.ixQuery);
  const base = ORDER.filter(a =>
    (!S.ixGroup || a.group === S.ixGroup) &&
    (!S.ixStatus || statusOf(a.id) === S.ixStatus));
  if (!words.length) return base;
  /* Сортировка устойчивая: при равном весе листы идут в порядке описи */
  return base
    .map(a => ({ a, s: scoreOf(a, words) }))
    .filter(x => x.s > 0)
    .sort((x, y) => y.s - x.s || x.a.idx - y.a.idx)
    .map(x => x.a);
}

/* Подсветка найденного. Экранируем сначала, ищем потом — иначе разметка
   подсветки уехала бы под экранирование вместе с текстом. Запрос со
   спецсимволами разметки не подсвечиваем: он попал бы внутрь сущности. */
function hl(text, q){
  const t = esc(text);
  const words = queryWords(q).filter(w => !/[&<>"]/.test(w));
  if (!words.length) return t;
  /* Собираем отрезки для подсветки по всем словам сразу и склеиваем
     непересекающиеся — иначе подсветка второго слова резала бы разметку,
     уже вставленную первым. */
  const low = t.toLowerCase();
  let spans = [];
  for (const w of words){
    let i = 0, k;
    while ((k = low.indexOf(w, i)) >= 0){ spans.push([k, k + w.length]); i = k + w.length; }
  }
  if (!spans.length) return t;
  spans.sort((x, y) => x[0] - y[0]);
  const merged = [spans[0]];
  for (const sp of spans.slice(1)){
    const last = merged[merged.length - 1];
    if (sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]); else merged.push(sp);
  }
  let out = '', i = 0;
  for (const [a, b] of merged){ out += t.slice(i, a) + '<mark>' + t.slice(a, b) + '</mark>'; i = b; }
  return out + t.slice(i);
}

/* Отобранный лист: явно выбранный или первый в выдаче */
function ixSelected(){
  const res = ixResults();
  return res.find(r => r.id === S.ixSel) || res[0] || null;
}
/* Ход по выдаче стрелками */
function ixMove(d){
  const res = ixResults();
  if (!res.length) return;
  /* Считаем от того, что подсвечено сейчас, а не от S.ixSel: пока выбор
     не сделан явно, подсвечена первая строка, и первый ↓ иначе просто
     «подтверждал» бы её вместо перехода ко второй. */
  const sel = ixSelected();
  const cur = sel ? res.findIndex(r => r.id === sel.id) : -1;
  const next = Math.max(0, Math.min(res.length - 1, (cur < 0 ? 0 : cur) + d));
  S.ixSel = res[next].id;
  paintIndex();
  const el = stage.querySelector('.ix-row.active');
  if (el) el.scrollIntoView({ block:'nearest' });
}

function renderIndex(){
  document.title = 'Указатель — Реестр Кордима';

  let h = '<div class="screen pad"><div class="board">';
  h += '<div class="runhead"><span>Реестр Кордима · Указатель</span><span class="folio">'
    +  ORDER.length + ' листов</span></div>';

  h += '<div class="ix-grid"><div>';
  h += '<h2 style="font-size:clamp(2rem,4vw,2.9rem);line-height:1.06;margin:0">Указатель</h2>';
  h += '<p style="margin:12px 0 0;max-width:44rem;color:var(--ink-soft);font-size:1.04rem;text-wrap:pretty">'
    +  'Поиск идёт по названиям, ключам, изложению и по всему тексту листов. '
    +  'Слов можно вводить несколько — реестр оставит листы, где нашлись все.</p>';

  h += '<div class="ix-search"><span class="arrow" aria-hidden="true">↳</span>'
    +  '<input id="ixInput" type="text" value="' + esc(S.ixQuery) + '" placeholder="чума столица · арбалет вороток · ложа яд" '
    +  'autocomplete="off" aria-label="Искать по реестру">'
    +  '<button class="ix-reset" id="ixReset" hidden>Сброс</button></div>';

  h += '<div class="chips" id="ixChips">';
  h += '<button class="chip" data-chip="">Все</button>';
  DATA.forEach(g => { h += '<button class="chip" data-chip="' + esc(g.group) + '">' + esc(g.group) + '</button>'; });
  h += '</div>';

  h += '<div class="chips chips--status" id="ixStatusChips">';
  h += '<button class="chip" data-status="">Любой штамп</button>';
  ['verified','disputed','sealed'].forEach(k => {
    h += '<button class="chip chip--' + k + '" data-status="' + k + '">'
      +  STATUS_LABEL[k] + ' · ' + TALLY[k] + '</button>';
  });
  h += '</div>';

  h += '<div class="ix-hint"><kbd>↑</kbd><kbd>↓</kbd> ведут по выдаче · '
    +  '<kbd>Enter</kbd> открывает лист · <kbd>/</kbd> возвращает в поиск</div>';

  h += '<div class="ix-count" id="ixCount"></div>';
  h += '<div id="ixList"></div>';
  h += '</div><aside class="ix-pane" id="ixPane"></aside></div>';
  h += '</div></div>';

  stage.innerHTML = h;

  const input = document.getElementById('ixInput');
  input.addEventListener('input', () => { S.ixQuery = input.value; S.ixSel = null; paintIndex(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); ixMove(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter'){ e.preventDefault(); const sel = ixSelected(); if (sel) openEntry(sel.id); }
  });
  document.getElementById('ixReset').addEventListener('click', () => {
    S.ixQuery = ''; S.ixGroup = null; S.ixStatus = null; S.ixSel = null;
    input.value = ''; input.focus();
    if (location.hash !== '#/index') history.replaceState(null, '', '#/index');
    paintIndex(); markNav();
  });
  document.getElementById('ixChips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    S.ixGroup = b.dataset.chip || null;
    S.ixSel = null;
    const hash = S.ixGroup ? '#/index/' + encodeURIComponent(S.ixGroup) : '#/index';
    history.replaceState(null, '', hash);
    paintIndex(); markNav();
  });
  document.getElementById('ixStatusChips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    S.ixStatus = b.dataset.status || null;
    S.ixSel = null;
    paintIndex();
  });
  paintIndex();
}

function paintIndex(){
  const res = ixResults();
  const sel = res.find(r => r.id === S.ixSel) || res[0] || null;

  /* Две гряды чипов разведены по контейнерам: общий селектор .chip
     подсвечивал бы и те, и другие — у чипа статуса нет data-chip,
     и он ложно совпадал с «раздел не выбран». */
  stage.querySelectorAll('#ixChips .chip').forEach(b =>
    b.classList.toggle('active', (b.dataset.chip || null) === S.ixGroup));
  stage.querySelectorAll('#ixStatusChips .chip').forEach(b =>
    b.classList.toggle('active', (b.dataset.status || null) === S.ixStatus));
  const reset = document.getElementById('ixReset');
  if (reset) reset.hidden = !(S.ixQuery.trim() || S.ixGroup || S.ixStatus);

  const count = document.getElementById('ixCount');
  if (count) count.textContent = res.length ? 'Найдено листов: ' + res.length : 'Пусто';

  const list = document.getElementById('ixList');
  if (list){
    if (!res.length){
      list.innerHTML = '<div class="ix-empty">'
        + '<p class="callout-label">Ничего не найдено</p>'
        + '<p style="margin:0;color:var(--ink-soft)">В реестре нет листа по этому ключу. '
        + 'Попробуйте короче — «чума», «порт», «ложа».</p></div>';
    } else {
      const words = queryWords(S.ixQuery);
      list.innerHTML = res.map(a => {
        const st = statusOf(a.id);
        return '<button class="ix-row' + (sel && sel.id === a.id ? ' active' : '') + '" data-id="' + a.id + '">'
          + '<span class="top"><span class="t">' + hl(a.title, S.ixQuery) + '</span>'
          + '<span class="g">' + esc(a.group)
          + (st === 'verified' ? '' : ' · <em>' + STATUS_LABEL[st] + '</em>') + '</span></span>'
          + '<span class="s">' + hl(a.summary, S.ixQuery) + '</span>'
          + (onlyInBody(a, words) ? '<span class="deep">найдено в тексте листа</span>' : '')
          + '</button>';
      }).join('');
      list.querySelectorAll('.ix-row').forEach(b => {
        b.addEventListener('click', () => { S.ixSel = b.dataset.id; paintIndex(); });
        b.addEventListener('dblclick', () => openEntry(b.dataset.id));
      });
    }
  }

  const pane = document.getElementById('ixPane');
  if (!pane) return;
  if (!sel){
    pane.innerHTML = '<div class="kicker">Указатель</div>'
      + '<h3>Ничего не отобрано</h3>'
      + '<p>Уточните ключ или снимите отбор по разделу и штампу.</p>';
    return;
  }
  const st = statusOf(sel.id);
  pane.innerHTML =
      '<div class="kicker">Запись ' + sel.no + ' · ' + esc(sel.group) + '</div>'
    + '<h3>' + esc(sel.title) + '</h3>'
    + '<p>' + esc(sel.summary) + '</p>'
    + '<div class="keys"><b>Ключи</b>' + esc(keysOf(sel)) + '</div>'
    + '<div class="stamp stamp--' + st + '">' + STATUS_LABEL[st] + '</div>'
    + '<button class="btn btn--seal" data-link="' + sel.id + '">Открыть лист</button>';
}

/* ══════════════════════════════════════════════════════════════════
   ЛИСТ V · ЗАПИСЬ
   ══════════════════════════════════════════════════════════════════ */
function renderEntry(id){
  const a = byId[id];
  if (!a){ go('#/index'); return; }
  S.entry = id;
  document.title = a.title + ' — Реестр Кордима';

  const st = statusOf(id);
  const plate = PLATE[id];

  let h = '<div class="screen pad"><article class="sheet">';
  h += '<div class="runhead"><span>Реестр Кордима</span><span class="folio">' + esc(a.group) + '</span></div>';
  h += '<header class="entry">';
  h += '<div class="foliomark" aria-hidden="true">' + a.no + '<small>лист</small></div>';
  h += '<div class="entry-meta"><span class="no">Запись ' + a.no + '</span><span>·</span><span>'
    +  esc(a.group) + '</span></div>';
  h += '<h2>' + esc(a.title) + '</h2>';
  h += '<div class="entry-keys"><b>Ключи</b>' + esc(keysOf(a)) + '</div>';
  h += '<div class="stamp stamp--' + st + '">' + STATUS_LABEL[st] + '</div>';
  h += '</header>';
  h += '<div class="article">';
  if (plate) h += plateHTML(plate, 'plate--float');
  h += a.html;
  if (APPENDIX[id]) h += plateHTML(APPENDIX[id], 'plate--wide');
  h += '</div>';

  const rel = (DATA.find(g => g.group === a.group).items || []).filter(r => r.id !== a.id).slice(0, 6);
  if (rel.length){
    h += '<div class="related"><h4>Смежные записи</h4><div class="related-links">';
    rel.forEach(r => { h += '<button data-link="' + r.id + '">' + r.no + ' · ' + esc(r.title) + '</button>'; });
    h += '</div></div>';
  }

  /* Подвал: перелистывание по всей описи, как в переплетённой книге */
  const prev = ORDER[(a.idx - 1 + ORDER.length) % ORDER.length];
  const next = ORDER[(a.idx + 1) % ORDER.length];
  h += '<div class="sheet-foot">'
    +  '<button class="btn" data-link="' + prev.id + '" title="' + esc(prev.title) + '">← Предыдущий</button>'
    +  '<span>Лист ' + a.no + ' из ' + ORDER.length + '</span>'
    +  '<button class="btn" data-link="' + next.id + '" title="' + esc(next.title) + '">Следующий →</button>'
    +  '</div>';

  h += '</article></div>';

  stage.innerHTML = h;
  markNumbers(stage);
  leafNav(a);

  /* Буквица открывает запись, а не абзац посреди неё: ставится только на
     первую прозу до первого раздела и только если она достаточно длинная.
     Если запись открывается сводкой цифр, открывать нечего — буквицы нет. */
  const body = stage.querySelector('.article');
  let opening = null;
  for (const el of body.children){
    if (el.tagName === 'H3') break;
    if (el.tagName === 'P' && !el.classList.contains('lede')
        && el.textContent.trim().length > 140){ opening = el; break; }
  }
  if (opening) opening.classList.add('opening');

  stagger([stage.querySelector('.runhead'), stage.querySelector('.entry'),
           ...body.children].filter(Boolean));
  stage.focus({ preventScroll: true });
}

/* Опись листа. Не ссылки с якорем, а кнопки: якорь в адресе перебил бы
   маршрут — весь реестр адресуется через хеш. */
function leafNav(a){
  const body = stage.querySelector('.article');
  if (!body) return;
  const heads = [...body.querySelectorAll('h3')];
  if (heads.length < 3) return;

  heads.forEach((el, k) => { el.id = 'sec-' + k; });

  const nav = document.createElement('nav');
  nav.className = 'leafnav';
  nav.setAttribute('aria-label', 'Разделы листа');
  let h = '<div class="leafnav-head">На этом листе</div>';
  heads.forEach((el, k) => {
    h += '<button data-sec="' + k + '">'
      +  '<span class="no">' + String(k + 1).padStart(2, '0') + '</span>'
      +  '<span class="name">' + esc(el.textContent) + '</span></button>';
  });
  nav.innerHTML = h;

  /* Под вклейкой, если она есть: обе плавают в поле и встают друг под друга */
  const plate = body.querySelector('.plate--float');
  if (plate) plate.after(nav); else body.prepend(nav);

  nav.addEventListener('click', e => {
    const b = e.target.closest('[data-sec]');
    if (!b) return;
    const el = heads[+b.dataset.sec];
    if (!el) return;
    /* Шапка реестра прибита сверху — иначе заголовок уезжает под неё */
    const y = el.getBoundingClientRect().top + scrollY - 62;
    const from = scrollY;
    window.scrollTo({ top: y, behavior: reduceMotion() ? 'auto' : 'smooth' });
    /* Плавную прокрутку поддерживают не все окружения, и там, где её нет,
       вызов молча не делает ничего. Проверяем, что она стартовала, и
       доводим мгновенно — кнопка обязана сработать в любом случае. */
    setTimeout(() => {
      if (Math.abs(scrollY - from) < 2 && Math.abs(y - from) > 2) window.scrollTo(0, y);
    }, 120);
    heads.forEach(x => x.classList.remove('jumped'));
    el.classList.add('jumped');
  });
}

/* ══════════════════════════════════════════════════════════════════
   МАРШРУТИЗАЦИЯ
   Адрес листа — #/title, #/map, #/time, #/index[/раздел], #/entry/<id>.
   Старые ссылки вида #loc-capital по-прежнему открывают свою запись.
   ══════════════════════════════════════════════════════════════════ */
function parseHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw) return { s:'title' };
  if (raw[0] === '/'){
    const p = raw.slice(1).split('/');
    const s = p[0] || 'title';
    if (s === 'entry') return { s:'entry', id:decodeURIComponent(p[1] || '') };
    if (s === 'index') return { s:'index', group:p[1] ? decodeURIComponent(p[1]) : null };
    if (s === 'map' || s === 'time' || s === 'title') return { s };
    return { s:'title' };
  }
  if (byId[raw]) return { s:'entry', id:raw };   // ссылка старого образца
  return { s:'title' };
}

function go(hash){
  if (location.hash === hash) { route(true); return; }
  location.hash = hash;
}
function openEntry(id){ go('#/entry/' + id); }

let lastKey = null;
function route(force){
  const r = parseHash();
  const key = r.s + '|' + (r.id || r.group || '');
  if (!force && key === lastKey) return;
  lastKey = key;
  S.screen = r.s;

  if (r.s === 'entry'){
    renderEntry(r.id && byId[r.id] ? r.id : S.entry);
  } else if (r.s === 'map'){
    S.mapOn = null; renderMap();
  } else if (r.s === 'time'){
    renderTime();
  } else if (r.s === 'index'){
    const g = r.group && DATA.some(x => x.group === r.group) ? r.group : null;
    S.ixGroup = g;
    renderIndex();
  } else {
    renderTitle();
  }
  markNav();
  window.scrollTo(0, 0);
}

/* Ссылки внутри содержимого и на кнопках описи — одна делегация на весь лист */
stage.addEventListener('click', e => {
  const el = e.target.closest('[data-link]');
  if (!el || !stage.contains(el)) return;
  e.preventDefault();
  openEntry(el.getAttribute('data-link'));
});

window.addEventListener('hashchange', () => route(false));

/* ─── Клавиатура ────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if (e.key === '/' && !typing){
    e.preventDefault();
    findInput.focus();
    findInput.select();
    return;
  }
  if (e.key === 'Escape' && typing){ document.activeElement.blur(); return; }
  if (typing) return;
  /* Указатель ведётся стрелками и с несфокусированным полем */
  if (S.screen === 'index'){
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); ixMove(e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter'){ const sel = ixSelected(); if (sel){ e.preventDefault(); openEntry(sel.id); } return; }
  }
  /* Листание записи стрелками — как перелистывание страницы */
  if (S.screen === 'entry' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    const a = byId[S.entry];
    if (!a) return;
    const d = e.key === 'ArrowLeft' ? -1 : 1;
    openEntry(ORDER[(a.idx + d + ORDER.length) % ORDER.length].id);
  }
  /* Ведение по хронике */
  if (S.screen === 'time' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    S.tl = e.key === 'ArrowLeft' ? Math.max(0, S.tl - 1) : Math.min(EVENTS.length - 1, S.tl + 1);
    paintTime();
  }
});

renderNav();
route(true);
</script>
