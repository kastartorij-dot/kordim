<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Засада на тракте — схема</title>
<!-- Схема засады из «Ошерской истории»: вид сверху, все участники, шаги боя от
     подхода повозки до отъезда в город. Источник — Проза/Схемы/, копию в читалку
     кладёт Канон/_Сборка/reader.mjs. Строки «стр. N» — по Проза/Ошерская_история.md. -->
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5efe3; --paper: #fbf7ef; --ink: #2a241d; --muted: #8a7f70; --rule: #e4dac8; --accent: #8c3b2a;
  --ui-bg: #fffaf2; --shadow: 0 6px 24px rgba(60, 40, 20, .14);
  --grass: #dfe3c6; --hill: #cfd4ae; --hill2: #c2c89c; --road: #cdb894; --mud: #b9a17a; --water: #9cc1d6;
  --wagon: #8a6a48; --tarp: #b7a98a; --iron: #5f5a52;
  --hero-g: #6b4fa0; --hero-n: #c46a1e; --foe: #8e3b33; --foe2: #6e6a63; --dead: #9a938a;
}
:root[data-theme="dark"] {
  --bg: #161411; --paper: #1d1a16; --ink: #ddd4c6; --muted: #8f8577; --rule: #2f2a24; --accent: #d98b6c;
  --ui-bg: #26221d; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  --grass: #2a2d22; --hill: #33372a; --hill2: #3b4030; --road: #4a4033; --mud: #5a4c3a; --water: #2f4c5c;
  --wagon: #7a5d40; --tarp: #6f6655; --iron: #9a948a;
  --hero-g: #a58ae0; --hero-n: #f0a050; --foe: #e07a6e; --foe2: #a8a39a; --dead: #6c665e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "PT Sans", Arial, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 40px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.bar a, .bar button { border: 1px solid var(--rule); background: var(--ui-bg); color: inherit; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; box-shadow: var(--shadow); }
.bar .grow { flex: 1; }
h1 { font: 600 1.6em/1.2 "Literata", Georgia, serif; margin: 6px 0 2px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.mapbox { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
svg { display: block; width: 100%; height: auto; max-height: 74vh; touch-action: manipulation; }
.ctrl { display: flex; gap: 6px; align-items: center; padding: 10px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.ctrl button { border: 1px solid var(--rule); background: var(--ui-bg); color: inherit; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 15px; cursor: pointer; min-width: 42px; }
.ctrl button.on { border-color: var(--ink); font-weight: 700; }
.ctrl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.ctrl .num { font-size: 13px; color: var(--muted); min-width: 4.5em; text-align: right; }
.cap { padding: 12px 14px 14px; border-top: 1px solid var(--rule); }
.cap h2 { margin: 0 0 4px; font: 600 1.15em/1.3 "Literata", Georgia, serif; }
.cap p { margin: 0; }
.cap a { color: var(--accent); }
.shots { font-size: 13px; color: var(--muted); margin-top: 6px; }
.shots b { color: var(--ink); }
aside { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); }
aside h3 { margin: 0; padding: 12px 14px 6px; font-size: 15px; }
.legend { padding: 0 14px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.legend s { color: var(--muted); }
ol.steps { list-style: none; margin: 0; padding: 4px 6px 10px; max-height: 60vh; overflow: auto; border-top: 1px solid var(--rule); }
ol.steps li { padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.35; display: flex; gap: 8px; }
ol.steps li:hover { background: var(--bg); }
ol.steps li.cur { background: var(--bg); font-weight: 700; }
ol.steps li small { color: var(--muted); font-weight: 400; margin-left: auto; white-space: nowrap; }
ol.steps li em { font-style: normal; color: var(--muted); min-width: 1.6em; }
.note { color: var(--muted); font-size: 13px; padding: 10px 14px 14px; border-top: 1px solid var(--rule); }
.lbl { font: 700 11px "PT Sans", Arial, sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.lbl.small { font-weight: 400; font-size: 9.5px; fill: var(--muted); }
.place { font: italic calc(10px * var(--z, 1)) "PT Sans", Arial, sans-serif; fill: var(--muted); }
.wl { font: 400 calc(9.5px * var(--z, 1)) "PT Sans", Arial, sans-serif; fill: var(--paper); opacity: .85; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  ol.steps { max-height: none; }
  h1 { font-size: 1.3em; }
}
</style>
</head>
<body>
<main>
  <div class="bar">
    <a href="../Ошерская_история.html">← К рассказу</a>
    <a href="../../Приложение/" title="На главную сайта">⌂</a>
    <span class="grow"></span>
    <button id="theme" title="Тема">☾</button>
  </div>
  <h1>Засада на тракте</h1>
  <div class="sub">Ошерская история, начало · вид сверху · масштаб примерный, люди нарисованы крупнее, чтобы их было видно</div>

  <div class="layout">
    <div>
      <div class="mapbox">
        <svg id="map" viewBox="290 0 460 530" role="img" aria-label="Схема засады"></svg>
        <div class="ctrl">
          <button id="prev" title="Назад">◀</button>
          <button id="play" title="Пуск/пауза">▶</button>
          <button id="next" title="Вперёд">▶▶</button>
          <input id="slider" type="range" min="0" max="20" step="1" value="0" aria-label="Шаг">
          <span class="num" id="num"></span>
          <button id="speed" title="Скорость">1×</button>
        </div>
        <div class="cap">
          <h2 id="capT"></h2>
          <p id="capX"></p>
          <div class="shots" id="shots"></div>
        </div>
      </div>
    </div>
    <aside>
      <h3>Кто есть кто</h3>
      <div class="legend" id="legend"></div>
      <ol class="steps" id="steps"></ol>
      <div class="note">Пунктир — полёт болта, ножа или копья. ✕ — убит, полупрозрачный — убежал. Тап по шагу — перейти, «стр. N» — открыть это место в рассказе.</div>
    </aside>
  </div>
</main>

<script>

  };
  var ORDER = ['mare', 'gelding', 'merchant', 'driver', 'arb', 'ryaboy', 'boy', 'axe', 'sword', 'nikto', 'grace'];

  // Шаги. pos — куда приходит участник (точка или путь из точек), st — состояние,
  // fx — полёты (from/to), wagon — сдвиг повозки, smoke — дым, shots — выстрелов Грейс к концу шага
  var S = [
    { a: 10, b: 34, t: 'Исходные позиции',
      x: 'Третий день дождя, тракт раскис. Грейс лежит на гребне за поваленным дубом, в тридцати шагах от дороги, арбалет взведён. Никто сидит в ежевике у обочины. Лошади ждут в овраге за холмом с обмотанными мордами.',
      wagon: 430,
      pos: { grace: [520, 92], nikto: [468, 346], mare: [680, 30], gelding: [702, 38],
             ryaboy: [835, 400], arb: [896, 393], driver: [896, 407], sword: [930, 377], axe: [960, 423], boy: [1015, 400], merchant: [921, 400] },
      st: { nikto: 'hidden' } },
    { a: 36, b: 42, t: 'Повозка встаёт у ручья',
      x: 'Спереди каретный кузов с дверцами по обе стороны, сзади груз под брезентом. На передке возница и арбалетчик, Рябой чуть впереди, двое у колёс, парень со щитом последним. Торговец сидит в карете. У ручья возница натягивает вожжи.',
      wagon: 0,
      pos: { ryaboy: [405, 400], arb: [466, 393], driver: [466, 407], sword: [500, 377], axe: [530, 423], boy: [585, 400], merchant: [491, 400] } },
    { a: 44, b: 54, t: 'Никто выходит на дорогу',
      x: 'Никто вываливается из кустов на середину дороги и заговаривает охрану, все смотрят на него. Рябой выходит навстречу с полуторным мечом.',
      pos: { nikto: { path: [[468, 346], [430, 372], [372, 396]] }, ryaboy: [392, 400] },
      st: { nikto: '' } },
    { a: 56, b: 58, t: 'Рябой',
      x: 'Рябой бьёт плашмя, проучить. Никто приседает под клинок и бросает два ножа из нагрудной бандальеры. Рябой падает на колени.',
      fx: [{ k: 'knife', from: 'nikto', to: 'ryaboy' }, { k: 'knife', from: 'nikto', to: 'ryaboy', d: .15 }],
      st: { ryaboy: 'dead' } },
    { a: 60, b: 62, t: 'Выстрел 1: арбалетчик',
      x: 'Арбалетчик вскидывает оружие на Никто, и Грейс снимает его первой. Болт сбрасывает его с передка на дальнюю сторону, в грязь. Возница бросает вожжи и убегает по воде вниз по ручью. Упряжные бьются, но повозку из колеи не стронуть.',
      fx: [{ k: 'bolt', from: 'grace', to: 'arb' }],
      pos: { arb: [470, 430], driver: { path: [[466, 407], [440, 440], [352, 452], [338, 540]] } },
      st: { arb: 'dead', driver: 'gone' }, shots: 1 },
    { a: 64, b: 70, t: 'Охрана прячется за повозку',
      x: 'Никто ныряет за ближний к холму борт. Двое старших сразу понимают, откуда стреляют, и уходят за кузов на дальнюю сторону, утаскивая парня за ворот. Грейс взводит и целится под ось: оттуда видны ноги.',
      pos: { nikto: { path: [[372, 396], [430, 371], [470, 372]] },
             sword: { path: [[500, 377], [572, 382], [560, 428], [522, 428]] },
             axe: [545, 426], boy: { path: [[585, 400], [578, 428], [536, 432]] } } },
    { a: 72, b: 74, t: 'Ножи в обшивку',
      x: 'Никто бежит вдоль борта и бросает два ножа в обшивку, за которой сидят их головы. Толку никакого, зато шум: пусть смотрят на него, а не на холм.',
      pos: { nikto: [530, 372] },
      fx: [{ k: 'knife', from: 'nikto', to: [512, 386] }, { k: 'knife', from: 'nikto', to: [538, 386], d: .2 }] },
    { a: 76, b: 82, t: 'Копьё и выстрел 2 мимо',
      x: 'Один из старших высовывается из-за задка с коротким копьём. Болт Грейс взвизгивает о железную оковку заднего колеса в пальце от его локтя. Копьё срывается, но Никто успевает крутануться.',
      pos: { axe: [568, 416], nikto: [522, 366] },
      fx: [{ k: 'bolt', from: 'grace', to: [552, 388] }, { k: 'spear', from: 'axe', to: [496, 352], d: .1 }],
      shots: 2 },
    { a: 86, b: 86, t: 'Дым',
      x: 'Никто разбивает под колёсами глиняный шарик. Ветер тянет едкий дым вдоль повозки, у сидящих за кузовом текут слёзы. Никто под дымом обходит задок и выходит на их сторону.',
      smoke: 1,
      pos: { axe: [548, 428], nikto: { path: [[522, 366], [578, 378], [584, 420], [556, 442]] } } },
    { a: 88, b: 94, t: 'Выстрел 3: в щит',
      x: 'Из дыма разом выходят двое, мечник и топорник, и расходятся в стороны, чтобы Никто не закрылся одним от другого. Грейс целит мечнику в грудь, но между ними выскакивает парень и ловит болт щитом.',
      smoke: 1,
      pos: { sword: [522, 450], axe: [582, 446], boy: [526, 438], nikto: [552, 452] },
      fx: [{ k: 'bolt', from: 'grace', to: [526, 434] }],
      shots: 3 },
    { a: 96, b: 102, t: 'Схватка у канавы',
      x: 'Двое работают парой и молча. Топор цепляет Берту, меч вспарывает Никто рукав, плечо обжигает. Нож в лицо мечнику уходит в кусты за канавой. Никто пятится к канаве на дальней обочине, и упереться ему не во что.',
      smoke: .5,
      pos: { nikto: [548, 464], sword: [532, 454], axe: [558, 450] },
      fx: [{ k: 'knife', from: 'nikto', to: [512, 500] }] },
    { a: 104, b: 106, t: 'Выстрел 4: топорник',
      x: 'Топорник заносит руку сверху, подаётся вперёд, и шлем отходит от затылка: к холму он стоит спиной. Грейс бьёт в затылок. Никто всаживает Дырокол мечнику в бедро, и тот пятится к задку повозки, где со щитом стоит парень.',
      fx: [{ k: 'bolt', from: 'grace', to: 'axe' }],
      pos: { axe: [558, 458], sword: [568, 440], boy: [580, 432], nikto: [548, 456] },
      st: { axe: 'dead' }, shots: 4 },
    { a: 110, b: 118, t: 'Выстрел торговца',
      x: 'Никто идёт за мечником, карета остаётся у него за спиной. С дальней от холма стороны приоткрывается дверца, и торговец стреляет из охотничьего самострела. Болт входит под правую лопатку, Никто бросает на два шага вперёд, на заднее колесо.',
      pos: { nikto: { path: [[548, 456], [562, 446], [552, 426]] }, merchant: [492, 410] },
      fx: [{ k: 'bolt', from: [492, 416], to: [562, 446], c: 'var(--foe)' }] },
    { a: 120, b: 124, t: 'Выстрел 5: в дверцу',
      x: 'Дальней дверцы Грейс не видит, зато видит окно ближней: за отошедшей занавеской торговец снова натягивает тетиву. Она стреляет не в окно, а в тонкую филёнку под ним. Щепа распарывает торговцу руку.',
      pos: { merchant: [492, 402] },
      fx: [{ k: 'bolt', from: 'grace', to: [492, 386] }],
      shots: 5 },
    { a: 126, b: 136, t: 'Грейс бежит вниз',
      x: 'Грейс бросает арбалет и бежит вниз, вокруг задка повозки. Раненый в бедро мечник встаёт над Никто, чтобы кончить одним ударом. Никто бьёт его каблуком под колено, и клинок уходит в глину. Грейс прижимает мечника к колесу и бьёт мизерикордом под челюсть.',
      pos: { grace: { path: [[520, 92], [585, 330], [596, 400], [572, 434]] }, sword: [552, 416], nikto: [542, 434] },
      st: { sword: 'dead' } },
    { a: 138, b: 146, t: 'Парень бежит, торговец',
      x: 'Парень смотрит на мёртвых и бежит по дороге, бросив щит в канаву. Грейс заходит в карету через открытую дальнюю дверцу. Что там было, в тексте за кадром; Варгу она потом скажет: «Торговца нет».',
      pos: { boy: { path: [[580, 432], [640, 410], [760, 402]] }, grace: { path: [[572, 434], [500, 424], [540, 438]] } },
      st: { boy: 'gone', merchant: 'unknown' } },
    { a: 146, b: 172, t: 'Болт из спины',
      x: 'Грейс разрезает куртку и вытягивает болт тем же косым ходом, каким он вошёл. Наконечник выходит целым. Она кладёт Никто на спину, прямо на полотно, чтобы он давил на рану своим весом.',
      pos: { grace: [550, 440], nikto: [540, 436] } },
    { a: 176, b: 184, t: 'Арбалет и лошади',
      x: 'Грейс поднимается на гребень за брошенным арбалетом и уходит в овраг за лошадьми. Обеих ведёт вниз на коротком поводу.',
      pos: { grace: { path: [[550, 440], [598, 400], [590, 330], [520, 92], [690, 46], [610, 300], [604, 436], [570, 452]] },
             mare: { path: [[680, 30], [610, 300], [604, 440], [575, 458]] }, gelding: { path: [[702, 38], [618, 300], [612, 444], [590, 462]] } } },
    { a: 186, b: 196, t: 'В седло, сундук',
      x: 'Никто встаёт со второго раза. Грейс подсаживает его в седло и привязывает ремнём к высокой луке, чтобы не свалился. Сундук из-под брезента она приторачивает к крупу своей кобылы.',
      pos: { nikto: [590, 462], grace: { path: [[570, 452], [566, 412], [575, 452]] } } },
    { a: 198, b: 206, t: 'Пять ножей',
      x: 'Два из горла Рябого, два из обшивки, пятый в мокрой траве за канавой. Никто пересчитывает пальцами, не глядя: девять.',
      pos: { grace: { path: [[575, 452], [520, 470], [512, 498], [530, 370], [510, 372], [396, 402], [560, 455]] } } },
    { a: 208, b: 216, t: 'В город',
      x: 'Грейс садится в седло и берёт повод коня Никто к своему стремени. Едут шагом, обочиной, где грязь мельче: через ручей, к Ошерску.',
      pos: { grace: { path: [[560, 455], [470, 448], [355, 448], [250, 444]] }, mare: { path: [[575, 458], [480, 452], [360, 452], [255, 448]] },
             nikto: { path: [[590, 462], [495, 456], [375, 456], [270, 452]] }, gelding: { path: [[590, 462], [495, 458], [375, 458], [270, 454]] } },
      st: { grace: 'ride', nikto: 'ride' } }
  ];

  // камера: общий вид, дорога, бой (одинаковые пропорции, чтобы карта не прыгала)
  var CAM = { full: [290, 0, 460, 530], road: [330, 200, 330, 380], fight: [445, 292, 230, 265] };
  var CAMS = ['full', 'full', 'road', 'road', 'road', 'road', 'fight', 'fight', 'fight', 'fight', 'fight', 'fight', 'fight', 'fight', 'full', 'fight', 'fight', 'full', 'fight', 'road', 'road'];

  // накопленные позиции и состояния на каждом шаге
  var P = [], ST = [], PATH = [], SHOTS = [];
  S.forEach(function (s, i) {
    var p = {}, st = {}, path = {};
    Object.keys(A).forEach(function (k) {
      var prev = i ? P[i - 1][k] : [0, 0];
      var v = s.pos && s.pos[k];
      if (!v) { p[k] = prev; path[k] = null; }
      else if (v.path) { p[k] = v.path[v.path.length - 1]; path[k] = v.path; }
      else { p[k] = v; path[k] = i ? [prev, v] : null; }
      st[k] = s.st && k in s.st ? s.st[k] : (i ? ST[i - 1][k] : '');
    });
    P.push(p); ST.push(st); PATH.push(path);
    SHOTS.push(s.shots != null ? s.shots : (i ? SHOTS[i - 1] : 0));
  });
  // повозка: сдвиг вправо до подхода
  var WAG = S.map(function (s, i) { return s.wagon != null ? s.wagon : 0; });

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var svg = document.getElementById('map');

  // местность
  var bg = el('g', {}, svg);
  el('rect', { x: 0, y: 0, width: 1200, height: 700, fill: 'var(--grass)' }, bg);
  el('path', { d: 'M0 0 H1200 V250 C1000 290 820 210 650 250 C520 280 420 240 290 270 L0 300 Z', fill: 'var(--hill)' }, bg);
  el('path', { d: 'M0 0 H1200 V150 C1000 180 820 120 650 150 C560 170 470 140 290 165 L0 175 Z', fill: 'var(--hill2)' }, bg);
  el('path', { d: 'M600 10 C640 40 700 50 760 30 L760 0 L600 0 Z', fill: 'var(--hill)', opacity: .9 }, bg); // овраг
  el('text', { x: 650, y: 18, class: 'place' }, bg).textContent = 'овраг за холмом';
  el('text', { x: 432, y: 132, class: 'place' }, bg).textContent = 'гребень холма';
  el('path', { d: 'M0 640 H1200 V500 C1000 480 820 520 650 490 C520 470 420 505 290 492 L0 500 Z', fill: 'var(--hill)' }, bg);
  el('text', { x: 600, y: 520, class: 'place' }, bg).textContent = 'второй холм, ниже';
  // ручей
  el('path', { d: 'M318 0 C330 120 312 250 338 330 C352 380 340 430 356 470 C366 500 350 560 345 640', fill: 'none', stroke: 'var(--water)', 'stroke-width': 14, 'stroke-linecap': 'round' }, bg);
  el('text', { x: 300, y: 300, class: 'place' }, bg).textContent = 'ручей';
  // дорога и канавы
  el('rect', { x: 0, y: 365, width: 1200, height: 70, fill: 'var(--road)' }, bg);
  el('path', { d: 'M0 395 C200 392 400 404 1200 398', fill: 'none', stroke: 'var(--mud)', 'stroke-width': 18, opacity: .6 }, bg);
  el('line', { x1: 0, y1: 360, x2: 1200, y2: 360, stroke: 'var(--mud)', 'stroke-width': 4, 'stroke-dasharray': '2 5' }, bg);
  el('line', { x1: 0, y1: 458, x2: 1200, y2: 458, stroke: 'var(--mud)', 'stroke-width': 4, 'stroke-dasharray': '2 5' }, bg);
  el('text', { x: 600, y: 468, class: 'place' }, bg).textContent = 'канава у дальней обочины';
  el('text', { x: 600, y: 356, class: 'place' }, bg).textContent = '← тракт на Ошерск';
  // ежевика, кусты за канавой
  [[452, 340], [466, 336], [480, 342], [458, 352], [474, 352]].forEach(function (c) { el('circle', { cx: c[0], cy: c[1], r: 7, fill: '#7f8f55', opacity: .55 }, bg); });
  el('text', { x: 440, y: 330, class: 'place' }, bg).textContent = 'ежевика';
  [[496, 486], [512, 494], [528, 488], [506, 504], [470, 490]].forEach(function (c) { el('circle', { cx: c[0], cy: c[1], r: 8, fill: '#7f8f55', opacity: .5 }, bg); });
  el('text', { x: 465, y: 520, class: 'place' }, bg).textContent = 'кусты';
  // поваленный дуб
  el('line', { x1: 492, y1: 100, x2: 552, y2: 104, stroke: '#7a5a3a', 'stroke-width': 7, 'stroke-linecap': 'round' }, bg);
  el('text', { x: 556, y: 96, class: 'place' }, bg).textContent = 'дуб';

  // повозка
  var wag = el('g', {}, svg);
  el('rect', { x: 412, y: 389, width: 44, height: 9, rx: 4, fill: '#8b6e4e' }, wag);   // упряжные
  el('rect', { x: 412, y: 402, width: 44, height: 9, rx: 4, fill: '#8b6e4e' }, wag);
  el('line', { x1: 456, y1: 400, x2: 470, y2: 400, stroke: 'var(--wagon)', 'stroke-width': 3 }, wag);
  el('rect', { x: 460, y: 386, width: 12, height: 28, fill: 'var(--wagon)', opacity: .8 }, wag); // передок
  el('rect', { x: 470, y: 384, width: 44, height: 32, rx: 3, fill: 'var(--wagon)', stroke: 'var(--iron)', 'stroke-width': 2 }, wag); // карета
  el('rect', { x: 514, y: 385, width: 48, height: 30, rx: 3, fill: 'var(--tarp)', stroke: 'var(--iron)', 'stroke-width': 1 }, wag); // груз
  [[480, 382], [480, 418], [550, 382], [550, 418]].forEach(function (c) { el('rect', { x: c[0] - 7, y: c[1] - 2, width: 14, height: 4, fill: 'var(--iron)' }, wag); });
  // дверцы
  var doorN = el('rect', { x: 484, y: 381, width: 14, height: 4, fill: 'var(--paper)', stroke: 'var(--iron)' }, wag);
  var doorS = el('rect', { x: 484, y: 415, width: 14, height: 4, fill: 'var(--paper)', stroke: 'var(--iron)' }, wag);
  var wl = el('text', { x: 473, y: 392, class: 'wl' }, wag); wl.textContent = 'карета';
  var wl2 = el('text', { x: 518, y: 392, class: 'wl' }, wag); wl2.textContent = 'груз';
  var chest = el('rect', { x: 548, y: 395, width: 9, height: 7, fill: '#5a3d22', stroke: 'var(--iron)' }, wag);

  // дым
  var smoke = el('g', { opacity: 0 }, svg);
  [[500, 420, 34, 16], [470, 412, 28, 14], [540, 424, 30, 14], [445, 404, 22, 12], [520, 436, 26, 12]].forEach(function (e) {
    el('ellipse', { cx: e[0], cy: e[1], rx: e[2], ry: e[3], fill: '#9a9a9a', opacity: .45 }, smoke);
  });
  el('text', { x: 468, y: 452, class: 'place' }, smoke).textContent = '← дым сносит ветром';

  // траектории и снаряды
  var fxLayer = el('g', {}, svg);
  var offG = el('g', { opacity: 0 }, svg);
  var offT = el('text', { class: 'lbl', 'text-anchor': 'middle' }, offG); offT.textContent = '▲ Грейс на гребне';
  // участники
  var nodes = {};
  ORDER.forEach(function (k) {
    var a = A[k], g = el('g', {}, svg);
    if (a.horse) el('ellipse', { rx: 9, ry: 5, fill: a.c, opacity: .75 }, g);
    else {
      el('circle', { r: a.hero ? 8 : 7, fill: a.c, stroke: 'var(--paper)', 'stroke-width': 2 }, g);
      if (a.shield) el('path', { d: 'M-9 -7 A11 11 0 0 1 9 -7', fill: 'none', stroke: 'var(--iron)', 'stroke-width': 3 }, g);
    }
    var x = el('path', { d: 'M-5 -5 L5 5 M5 -5 L-5 5', stroke: 'var(--paper)', 'stroke-width': 2.5, opacity: 0 }, g);
    var q = el('text', { x: -3, y: 4, class: 'lbl', opacity: 0 }, g); q.textContent = '?';
    var t = el('text', { x: a.horse ? 11 : 10, y: a.horse ? 3 : -8, class: a.horse ? 'lbl small' : 'lbl' }, g);
    t.textContent = a.name;
    nodes[k] = { g: g, x: x, q: q, t: t, w: a.name.length * (a.horse ? 5.2 : 6.2) };
  });

  // легенда
  var leg = document.getElementById('legend');
  function renderLegend(i) {
    leg.innerHTML = '';
    ['grace', 'nikto', 'ryaboy', 'arb', 'sword', 'axe', 'boy', 'merchant', 'driver'].forEach(function (k) {
      var s = ST[i][k], label = A[k].name;
      var note = s === 'dead' ? ' ✕' : s === 'gone' ? ' — убежал' : s === 'unknown' ? ' — за кадром' : '';
      var span = document.createElement('span');
      span.innerHTML = '<i style="background:' + A[k].c + '"></i>' + (s === 'dead' ? '<s>' + label + '</s>' : label) + '<small style="color:var(--muted)">' + note + '</small>';
      leg.appendChild(span);
    });
  }

  // шаги списком
  var list = document.getElementById('steps');
  S.forEach(function (s, i) {
    var li = document.createElement('li');
    li.innerHTML = '<em>' + (i + 1) + '</em><span>' + s.t + '</span><small>стр. ' + s.a + (s.b !== s.a ? '–' + s.b : '') + '</small>';
    li.addEventListener('click', function () { go(i, true); });
    list.appendChild(li);
  });

  function lerp(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
  function along(pts, f) {
    if (!pts || pts.length < 2) return null;
    var L = [], tot = 0;
    for (var i = 1; i < pts.length; i++) { var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
    var want = tot * f;
    for (i = 1; i < pts.length; i++) {
      if (want <= L[i - 1] || i === pts.length - 1) return lerp(pts[i - 1], pts[i], L[i - 1] ? Math.min(1, want / L[i - 1]) : 1);
      want -= L[i - 1];
    }
    return pts[pts.length - 1];
  }
  function ease(f) { return f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2; }
  function pt(ref, i) { return typeof ref === 'string' ? P[i][ref] : ref; }

  // кадр: i — шаг, f — доля перехода из i-1 в i (1 = шаг показан целиком)
  function camAt(i, f) {
    var a = CAM[CAMS[i ? i - 1 : 0]], b = CAM[CAMS[i]], e = ease(f);
    if (!i) return a;
    return a.map(function (v, k) { return v + (b[k] - v) * e; });
  }
  // подписи: пробуем места вокруг точки, берём первое, где не налезает на чужие точки и подписи
  var SPOTS = [[10, -8, 'start'], [10, 15, 'start'], [-10, -8, 'end'], [-10, 15, 'end'], [0, 24, 'middle'], [0, -14, 'middle']];
  function declutter(pos, cam, z) {
    var placed = [], dots = [];
    ORDER.forEach(function (k) { if (pos[k]) dots.push([pos[k][0], pos[k][1], 8 * z]); });
    ['grace', 'nikto', 'merchant', 'sword', 'axe', 'boy', 'ryaboy', 'arb', 'driver', 'mare', 'gelding'].forEach(function (k) {
      var n = nodes[k], p = pos[k], best = SPOTS[0], bestBad = 1e9;
      SPOTS.forEach(function (sp) {
        var w = n.w * z, h = 11 * z, x0 = p[0] + sp[0] * z - (sp[2] === 'end' ? w : sp[2] === 'middle' ? w / 2 : 0), y0 = p[1] + sp[1] * z - h;
        var bad = 0;
        placed.forEach(function (r) { if (x0 < r[2] && x0 + w > r[0] && y0 < r[3] && y0 + h > r[1]) bad += 3; });
        dots.forEach(function (d) { if (d[0] > x0 - d[2] && d[0] < x0 + w + d[2] && d[1] > y0 - d[2] && d[1] < y0 + h + d[2] && !(d[0] === p[0] && d[1] === p[1])) bad += 2; });
        if (x0 < cam[0] || x0 + w > cam[0] + cam[2] || y0 < cam[1] || y0 + h > cam[1] + cam[3]) bad += 2.5;
        if (bad < bestBad) { bestBad = bad; best = sp; }
      });
      var w = n.w * z, x0 = p[0] + best[0] * z - (best[2] === 'end' ? w : best[2] === 'middle' ? w / 2 : 0);
      placed.push([x0, p[1] + best[1] * z - 11 * z, x0 + w, p[1] + best[1] * z]);
      n.t.setAttribute('x', best[0]); n.t.setAttribute('y', best[1]); n.t.setAttribute('text-anchor', best[2]);
    });
  }

  function frame(i, f) {
    var e = ease(f);
    var cam = camAt(i, f), z = cam[2] / 460;
    svg.setAttribute('viewBox', cam.map(function (v) { return v.toFixed(1); }).join(' '));
    svg.style.setProperty('--z', z.toFixed(3));
    var pos = {};
    var w = i ? WAG[i - 1] + (WAG[i] - WAG[i - 1]) * e : WAG[0];
    wag.setAttribute('transform', 'translate(' + w + ',0)');
    // дверца торговца
    var open = i >= 12;
    doorS.setAttribute('fill', open ? 'var(--foe)' : 'var(--paper)');
    doorN.setAttribute('fill', i >= 13 ? 'var(--accent)' : 'var(--paper)');
    chest.setAttribute('opacity', i >= 18 ? 0 : 1);
    var sm = S[i].smoke || 0, smPrev = i ? (S[i - 1].smoke || 0) : 0;
    smoke.setAttribute('opacity', (smPrev + (sm - smPrev) * e).toFixed(2));
    smoke.setAttribute('transform', 'translate(' + (-14 * (i >= 9 ? 1 : e) * (sm ? 1 : 0)) + ',0)');
    ORDER.forEach(function (k) {
      var p;
      if (i === 0) p = P[0][k];
      else if (PATH[i][k]) {
        var path = PATH[i][k].slice();
        // путь начинается оттуда, где участник стоял на прошлом шаге
        if (path.length && (path[0][0] !== P[i - 1][k][0] || path[0][1] !== P[i - 1][k][1])) path.unshift(P[i - 1][k]);
        p = along(path, e);
      } else p = P[i][k];
      // повозка везёт тех, кто на ней или рядом, пока подходит
      var onWagon = ['arb', 'driver', 'merchant', 'sword', 'axe', 'boy', 'ryaboy'].indexOf(k) >= 0;
      if (i <= 1 && onWagon && i === 1) p = lerp(P[0][k], P[1][k], e);
      var n = nodes[k], st = ST[i][k], prevSt = i ? ST[i - 1][k] : '';
      // смерть наступает в середине перехода, а не в начале
      var cur = f < .55 ? prevSt : st;
      if (k === 'nikto' && i === 2) cur = f < .2 ? 'hidden' : '';
      pos[k] = p;
      n.g.setAttribute('transform', 'translate(' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ') scale(' + z.toFixed(3) + ')');
      n.x.setAttribute('opacity', cur === 'dead' ? 1 : 0);
      n.q.setAttribute('opacity', cur === 'unknown' ? 1 : 0);
      var circle = n.g.firstChild;
      circle.setAttribute('fill', cur === 'dead' ? 'var(--dead)' : A[k].c);
      n.g.setAttribute('opacity', cur === 'hidden' ? .45 : cur === 'gone' ? (f < 1 ? 1 - .7 * e : .3) : 1);
      n.t.setAttribute('opacity', cur === 'ride' && A[k].hero ? 1 : 1);
    });
    declutter(pos, cam, z);
    // Грейс за кадром — метка у верхнего края
    var gp = pos.grace, out = gp[1] < cam[1] + 6;
    offG.setAttribute('opacity', out ? 1 : 0);
    if (out) offG.setAttribute('transform', 'translate(' + Math.max(cam[0] + 60 * z, Math.min(cam[0] + cam[2] - 60 * z, gp[0])).toFixed(1) + ',' + (cam[1] + 14 * z).toFixed(1) + ') scale(' + z.toFixed(3) + ')');
    // полёты
    fxLayer.innerHTML = '';
    (S[i].fx || []).forEach(function (fx) {
      var from = pt(fx.from, i ? i - 1 : 0), to = pt(fx.to, i);
      if (fx.from === 'nikto' || fx.from === 'axe') from = P[i][fx.from];
      var col = fx.c || (fx.k === 'bolt' ? 'var(--hero-g)' : fx.k === 'knife' ? 'var(--hero-n)' : 'var(--foe)');
      el('line', { x1: from[0], y1: from[1], x2: to[0], y2: to[1], stroke: col, 'stroke-width': 1.6, 'stroke-dasharray': '4 4', opacity: .8, 'vector-effect': 'non-scaling-stroke' }, fxLayer);
      var d = fx.d || 0, g = Math.max(0, Math.min(1, (f - .1 - d) / .45));
      if (g > 0 && g < 1) {
        var q = lerp(from, to, g);
        el('circle', { cx: q[0], cy: q[1], r: (fx.k === 'spear' ? 4 : 3) * Math.max(z, .6), fill: col }, fxLayer);
      }
      if (g >= 1) el('circle', { cx: to[0], cy: to[1], r: 3.5 * Math.max(z, .6), fill: 'none', stroke: col, 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' }, fxLayer);
    });
  }

  // управление
  var cur = 0, playing = false, speed = 1, anim = null;
  var slider = document.getElementById('slider');
  slider.max = S.length - 1;
  function caption(i) {
    var s = S[i];
    document.getElementById('capT').textContent = (i + 1) + '. ' + s.t;
    var link = '<a href="' + STORY + s.a + (s.b !== s.a ? '-' + s.b : '') + '">стр. ' + s.a + (s.b !== s.a ? '–' + s.b : '') + ' →</a>';
    document.getElementById('capX').innerHTML = s.x + ' ' + link;
    var shots = SHOTS[i], dots = '';
    for (var k = 1; k <= 5; k++) dots += k <= shots ? '●' : '○';
    document.getElementById('shots').innerHTML = 'Выстрелы Грейс: <b>' + dots + '</b> · на каждый взвод козьей ножкой уходит десять-двенадцать ударов сердца';
    document.getElementById('num').textContent = (i + 1) + ' из ' + S.length;
    slider.value = i;
    Array.prototype.forEach.call(list.children, function (li, k) { li.classList.toggle('cur', k === i); });
    renderLegend(i);
  }
  function go(i, user) {
    if (i < 0 || i >= S.length) return;
    if (user && playing) toggle();
    cancelAnimationFrame(anim);
    var from = cur;
    cur = i;
    caption(i);
    if (i !== from + 1 && !(i === from && i === 0)) { frame(i, 1); return; }
    var t0 = performance.now(), dur = (PATH[i] && Object.keys(PATH[i]).some(function (k) { return PATH[i][k] && PATH[i][k].length > 4; }) ? 2600 : 1500) / speed;
    (function tick(now) {
      var f = Math.min(1, (now - t0) / dur);
      frame(i, f);
      if (f < 1) anim = requestAnimationFrame(tick);
      else if (playing) anim = setTimeout(function () { if (playing) { if (cur < S.length - 1) go(cur + 1); else toggle(); } }, 1800 / speed);
    })(t0);
  }
  function toggle() {
    playing = !playing;
    document.getElementById('play').textContent = playing ? '❚❚' : '▶';
    if (playing) { if (cur >= S.length - 1) { cur = -1; go(0); setTimeout(function () { go(1); }, 900 / speed); } else go(cur + 1); }
    else { clearTimeout(anim); }
  }
  document.getElementById('play').addEventListener('click', toggle);
  document.getElementById('prev').addEventListener('click', function () { go(cur - 1, true); });
  document.getElementById('next').addEventListener('click', function () { if (playing) toggle(); go(cur + 1); });
  slider.addEventListener('input', function () { go(+slider.value, true); });
  document.getElementById('speed').addEventListener('click', function () {
    speed = speed === 1 ? .5 : speed === .5 ? 2 : 1;
    this.textContent = (speed === .5 ? '½' : speed) + '×';
    this.classList.toggle('on', speed !== 1);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { if (playing) toggle(); go(cur + 1); }
    if (e.key === 'ArrowLeft') go(cur - 1, true);
    if (e.key === ' ') { e.preventDefault(); toggle(); }
  });

  // тема: та же настройка, что у читалки
  var root = document.documentElement, KEY = 'kordim-reader:Ошерская_история:theme';
  var theme;
  try { theme = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  function applyTheme() { root.dataset.theme = theme; document.getElementById('theme').textContent = theme === 'dark' ? '☀' : '☾'; }
  document.getElementById('theme').addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark'; applyTheme();
    try { localStorage.setItem(KEY, JSON.stringify(theme)); } catch (e) {}
  });
  applyTheme();
  caption(0); frame(0, 1);
})();
</script>
